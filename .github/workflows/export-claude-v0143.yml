name: Factura Rapida - Export v0.1.43 files for Claude

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-claude-v0143.yml'

permissions:
  contents: read

env:
  FR_VERSION: "0.1.43"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconstruir exactamente la base v0.1.43
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          if($LASTEXITCODE -ne 0){throw 'No se pudo recuperar FIX1'}
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134'){throw "Hash FIX1 inesperado: $sha"}
          Expand-Archive FIX1.zip . -Force
          node scripts/rebase-fix1-native-v0142.mjs desktop
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node scripts/ensure-rust-deps-v0143.mjs desktop/src-tauri/Cargo.toml
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Push-Location desktop/src-tauri
          cargo generate-lockfile
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location
          Push-Location desktop
          node scripts/set-version.mjs "$env:FR_VERSION"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location

      - name: Crear paquete exacto solicitado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force claude-v0143 | Out-Null
          Copy-Item desktop/src-tauri/Cargo.toml claude-v0143/Cargo.toml
          Copy-Item desktop/src-tauri/src/main.rs claude-v0143/main.rs
          Copy-Item desktop/src-tauri/tauri.conf.json claude-v0143/tauri.conf.json
          Copy-Item desktop/src-tauri/Cargo.lock claude-v0143/Cargo.lock

          $lock=Get-Content desktop/src-tauri/Cargo.lock -Raw
          $names=@('tauri','tauri-plugin-updater','serde','serde_json')
          $blocks=@()
          foreach($name in $names){
            $pattern='(?ms)^\[\[package\]\]\r?\nname = "'+[regex]::Escape($name)+'"\r?\n.*?(?=^\[\[package\]\]|\z)'
            $m=[regex]::Match($lock,$pattern)
            if($m.Success){$blocks += $m.Value.Trim()}
            else{$blocks += "NO ENCONTRADO: $name"}
          }
          ($blocks -join "`r`n`r`n") | Set-Content claude-v0143/Cargo.lock-dependencias-relevantes.txt -Encoding UTF8

          @'
PAQUETE EXACTO DE REVISION v0.1.43

Archivos reconstruidos con el mismo procedimiento del workflow v0.1.43:
- Base FIX1 commit: 73ff1fa0d4345d492278eef5f2dc836e7ece7695
- SHA256 FIX1: 144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134
- Rebase: scripts/rebase-fix1-native-v0142.mjs
- Correccion Rust: scripts/ensure-rust-deps-v0143.mjs
- Version final: 0.1.43

Incluye:
1. Cargo.toml completo
2. main.rs completo
3. tauri.conf.json completo
4. Cargo.lock completo
5. Cargo.lock-dependencias-relevantes.txt con los bloques de tauri, tauri-plugin-updater, serde y serde_json

Objetivo de la revision: comprobar compatibilidad de dependencias Rust/Tauri y detectar cualquier otra dependencia o incompatibilidad antes del build.
'@ | Set-Content claude-v0143/LEEME.txt -Encoding UTF8

          Compress-Archive -Path claude-v0143/* -DestinationPath Paquete_Claude_v0.1.43_Rust_Tauri.zip -Force
          Write-Host "EXPORT_OK bytes=$((Get-Item Paquete_Claude_v0.1.43_Rust_Tauri.zip).Length)"

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: Paquete-Claude-v0.1.43-Rust-Tauri
          path: Paquete_Claude_v0.1.43_Rust_Tauri.zip
          retention-days: 7

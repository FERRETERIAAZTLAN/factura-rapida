name: SOLRAK - Release v0.1.94 Windows R2

on:
  push:
    branches: [release/v0.1.94-hardware]
    paths:
      - '.github/workflows/windows-release-v0194-r2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FR_VERSION: "0.1.94"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"
  FR_FIX1_SHA256: "144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight completo v0.1.94
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          try{gh api "/repos/$repo/git/ref/tags/$tag" *> $null;throw "$tag ya existe como tag"}catch{if($_.Exception.Message -like '*ya existe como tag*'){throw}}
          npm install --no-save --no-audit --no-fund --package-lock=false jsdom@26.1.0
          foreach($f in @('pos-module.js','solrak-sumapro-tickets-v0169.js','solrak-reports-v0172.js','solrak-shifts-v0189.js','solrak-ux-core-v0190.js','solrak-peripherals-v0191.js','solrak-ux-hardening-v0192.js','solrak-hardware-v0194.js','scripts/apply-hardware-v0194.mjs')){node --check $f}
          node tests/solrak-hardware-v0194-smoke.mjs
          node tests/solrak-peripherals-v0191-smoke.mjs
          node tests/solrak-v0193-ui-states-focus-smoke.mjs
          node tests/solrak-ux-operational-audit-v0192.mjs
          node tests/solrak-ux-hardening-v0192-smoke.mjs
          node tests/solrak-sumapro-tickets-v0169-smoke.mjs
          node tests/solrak-shifts-v0189-smoke.mjs
          node tests/solrak-caja-cortes-v0185-smoke.mjs
          node tests/solrak-held-tickets-v0176-smoke.mjs
          node tests/solrak-v0164-cash-report-contract.mjs
          node tests/pos-module-smoke.mjs
          Add-Type -Path desktop-native-v0194/solrak_raw_print_helper_v0194.cs
          if(-not ('SolrakRawPrinter' -as [type])){throw 'No compiló WinSpool helper'}
          $hardware=(Get-Content solrak-hardware-v0194.js -Raw)+(Get-Content desktop-native-v0194/solrak_hardware_v0194.rs -Raw)
          if($hardware -match '(?i)cfdi|finkok|\bdemo\b|\bmock\b|simulad[oa]'){throw 'Hardware fuera de alcance o simulado'}
          if(-not (Select-String -Path pos-module.js -Pattern 'const MAX_TICKETS = 8;' -Quiet)){throw 'MAX_TICKETS no es 8'}
          Write-Host 'SOLRAK_V0194_PREFLIGHT_R2_OK'

      - name: Reconstruir base Windows estable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          if($LASTEXITCODE -ne 0){throw 'No se pudo recuperar FIX1'}
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:FR_FIX1_SHA256){throw "FIX1 hash inesperado $sha"}
          Expand-Archive FIX1.zip . -Force
          node scripts/rebase-fix1-native-v0142.mjs desktop
          node scripts/ensure-rust-deps-v0143.mjs desktop/src-tauri/Cargo.toml
          Push-Location desktop
          npm install --no-audit --no-fund
          node scripts/set-version.mjs "$env:FR_VERSION"
          npm run tauri -- icon ../branding/solrak-icon.svg
          Pop-Location
          foreach($f in @('desktop/src-tauri/src/main.rs','desktop/src-tauri/icons/icon.ico','desktop/src-tauri/icons/128x128.png')){if(-not(Test-Path $f)){throw "Falta $f"}}
          Write-Host 'FIX1_V0194_BASE_OK'

      - name: Sincronizar UI productiva estable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $ok=$false
          for($i=1;$i -le 8;$i++){
            try{
              Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'} -TimeoutSec 30
              if((Get-Item production-source.html).Length -gt 10000){$ok=$true;break}
            }catch{Write-Host "UI fetch $i falló: $($_.Exception.Message)"}
            Start-Sleep -Seconds ([Math]::Min(3*$i,15))
          }
          if(-not $ok){throw 'UI productiva no disponible'}
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          Pop-Location
          node scripts/sanitize-production-ui-v0142.mjs desktop/dist/index.html
          node scripts/clean-webview-startup-v0148.mjs desktop/dist/index.html
          node scripts/fix-facturar-mutation-v0148.mjs desktop/dist/index.html
          Write-Host 'PRODUCTION_UI_SYNC_SANITIZED_OK'

      - name: Integrar módulos SOLRAK v0.1.62 a v0.1.94
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $mods=@(
            'quotes-module.js','quotes-email-module.js','product-images-module.js','pos-module.js',
            'solrak-desktop-v0162.js','solrak-logo-v0162.js','solrak-desktop-v0163.js','solrak-sales-report-v0163.js',
            'solrak-pos-workspace-v0165.js','solrak-professional-pos-v0166.js','solrak-pos-clear-footer-v0167.js','solrak-simple-ui-v0168.js',
            'solrak-sumapro-tickets-v0169.js','solrak-redesign-v0170.js','solrak-sumapro-fiel-v0171.js','solrak-reports-v0172.js','solrak-flow-v0173.js',
            'solrak-sales-v0174.js','solrak-inventory-v0175.js','solrak-held-tickets-v0176.js','solrak-price-verifier-v0177.js','solrak-permissions-v0179.js',
            'solrak-product-lifecycle-v0180.js','solrak-clients-credit-v0181.js','solrak-credit-accounts-v0182.js','solrak-ui-operativa-v0183.js','solrak-ui-hardening-v0184.js',
            'solrak-caja-cortes-v0185.js','solrak-formularios-v0186.js','solrak-categorias-v0187.js','solrak-inventory-mode-v0188.js','solrak-shifts-v0189.js',
            'solrak-ux-core-v0190.js','solrak-peripherals-v0191.js','solrak-ux-hardening-v0192.js'
          )
          foreach($f in $mods){if(-not(Test-Path $f)){throw "Falta módulo $f"};Copy-Item $f "desktop/dist/$f" -Force;node --check "desktop/dist/$f"}
          $tags=@(
            '<script src="quotes-module.js?v=1"></script>','<script src="quotes-email-module.js?v=1"></script>','<script src="product-images-module.js?v=1"></script>',
            '<script src="solrak-desktop-v0162.js?v=1"></script>','<script src="solrak-logo-v0162.js?v=1"></script>','<script src="solrak-desktop-v0163.js?v=1"></script>','<script src="solrak-sales-report-v0163.js?v=1"></script>',
            '<script src="solrak-pos-workspace-v0165.js?v=1"></script>','<script src="solrak-professional-pos-v0166.js?v=1"></script>','<script src="solrak-pos-clear-footer-v0167.js?v=1"></script>','<script src="solrak-simple-ui-v0168.js?v=1"></script>',
            '<script src="solrak-sumapro-tickets-v0169.js?v=1"></script>','<script src="solrak-redesign-v0170.js?v=1"></script>','<script src="solrak-sumapro-fiel-v0171.js?v=1"></script>','<script src="solrak-reports-v0172.js?v=1"></script>','<script src="solrak-flow-v0173.js?v=1"></script>',
            '<script src="solrak-sales-v0174.js"></script>','<script src="solrak-inventory-v0175.js"></script>','<script src="solrak-held-tickets-v0176.js"></script>','<script src="solrak-price-verifier-v0177.js"></script>','<script src="solrak-permissions-v0179.js"></script>',
            '<script src="solrak-product-lifecycle-v0180.js"></script>','<script src="solrak-clients-credit-v0181.js"></script>','<script src="solrak-credit-accounts-v0182.js"></script>','<script src="solrak-ui-operativa-v0183.js"></script>','<script src="solrak-ui-hardening-v0184.js"></script>',
            '<script src="solrak-caja-cortes-v0185.js"></script>','<script src="solrak-formularios-v0186.js"></script>','<script src="solrak-categorias-v0187.js"></script>','<script src="solrak-inventory-mode-v0188.js"></script>','<script src="solrak-shifts-v0189.js"></script>',
            '<script src="solrak-ux-core-v0190.js"></script>','<script src="solrak-peripherals-v0191.js"></script>','<script src="solrak-ux-hardening-v0192.js"></script>'
          )
          $p='desktop/dist/index.html';$h=Get-Content $p -Raw
          foreach($tag in $tags){$h=$h.Replace($tag,'')}
          foreach($tag in $tags){if(-not $h.Contains('</body>')){throw 'index sin </body>'};$h=$h.Replace('</body>',"$tag`r`n</body>")}
          Set-Content $p $h -Encoding UTF8
          $qe=Get-Content desktop/dist/quotes-email-module.js -Raw
          if(-not $qe.Contains('pos-module.js?v=1')){throw 'quotes-email no carga POS'}
          node scripts/apply-hardware-v0194.mjs desktop
          node scripts/apply-hardware-v0194.mjs desktop
          node scripts/apply-solrak-brand-v0162.mjs desktop
          $h=Get-Content $p -Raw
          foreach($m in @('SOLRAK','solrak-desktop-v0162.js?v=1','solrak-sumapro-tickets-v0169.js?v=1','solrak-reports-v0172.js?v=1','solrak-shifts-v0189.js','solrak-ux-hardening-v0192.js','solrak-hardware-v0194.js')){if(-not $h.Contains($m)){throw "Paquete incompleto: $m"}}
          $tickets=Get-Content desktop/dist/solrak-sumapro-tickets-v0169.js -Raw
          if(-not $tickets.Contains('nativeHardware?.directPrintEnabled?.()')){throw 'Tickets no conectados a impresora nativa'}
          Write-Host 'SOLRAK_MODULE_CHAIN_V0194_OK'

      - name: Auditoría web empaquetada
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $dest='desktop/dist/vendor/xlsx.full.min.js';$ok=$false
          for($i=1;$i -le 6;$i++){
            try{Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile $dest -UseBasicParsing -TimeoutSec 30;if((Get-Item $dest).Length -gt 500000){$ok=$true;break}}catch{Write-Host "XLSX fetch $i falló"}
            Start-Sleep -Seconds (2*$i)
          }
          if(-not $ok){throw 'XLSX incompleto'}
          node scripts/vendor-windows-xlsx-lazy-v0144.mjs desktop/dist/index.html $dest
          node tests/windows-xlsx-lazy-v0144.mjs desktop/dist/index.html
          node tests/windows-facturar-mutation-v0148.mjs desktop/dist/index.html
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html
          $h=Get-Content desktop/dist/index.html -Raw
          if($h.Contains('Factura Rápida') -or $h.Contains('Factura Rapida')){throw 'Quedó marca anterior visible'}
          if(([regex]::Matches($h,'solrak-hardware-v0194\.js')).Count -ne 1){throw 'Hardware script duplicado o faltante'}
          Write-Host 'SOLRAK_V0194_WEB_PACKAGE_AUDIT_OK'

      - name: Cargo test check y contrato nativo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          Push-Location desktop/src-tauri
          cargo generate-lockfile
          cargo test --locked
          cargo check --locked
          Pop-Location
          $main=Get-Content desktop/src-tauri/src/main.rs -Raw
          foreach($m in @('hardware_status_v0194','list_serial_ports_v0194','scale_connect_v0194','scale_read_v0194','scale_disconnect_v0194','list_windows_printers_v0194','print_raw_ticket_v0194')){if(-not $main.Contains($m)){throw "main.rs sin $m"}}
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){throw 'Versión Tauri incorrecta'}
          if([string]$t.productName -ne 'SOLRAK'){throw 'Marca Tauri incorrecta'}
          if([string]$t.identifier -ne 'com.facturarapida.desktop'){throw 'Identifier técnico cambió'}
          Write-Host 'SOLRAK_V0194_NATIVE_CONTRACT_OK'

      - name: Configurar updater firmado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar EXE real
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Aceptación EXE real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log';Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 150;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE se cerró: $txt"}
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started') -and $txt.Contains('PAGE_LOAD Finished')
                $dom=$txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('"ok":true') -and $txt.Contains('"hitOk":true') -and $txt.Contains('"focusOk":true')
                if($base -and $dom -and $ready){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE real no pasó aceptación: $txt"}
            Start-Sleep -Seconds 15
            if($p.HasExited){throw 'EXE se cerró después de LOGIN_UI_READY'}
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}
          Write-Host 'WINDOWS_REAL_ACCEPTANCE_0.1.94_SOLRAK_OK'

      - name: Preparar assets firmados
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis';$exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}
          $sig="$($exe.FullName).sig";if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="SOLRAK_$env:FR_VERSION`_x64-setup.exe"
          Copy-Item $exe.FullName "release-files/$name" -Force;Copy-Item $sig "release-files/$name.sig" -Force
          $eh=(Get-FileHash "release-files/$name" -Algorithm SHA256).Hash.ToLowerInvariant();$sh=(Get-FileHash "release-files/$name.sig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$eh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION";$signature=(Get-Content "release-files/$name.sig" -Raw).Trim();$url="https://github.com/$repo/releases/download/$tag/$name"
          $notes='SOLRAK v0.1.94: impresora térmica RAW/ESC-POS Windows, báscula USB/COM real y lector tipo teclado; conserva POS, reportes, tickets, caja automática, inventario, clientes, créditos y UX v0.1.93. Sin cambios de precios/inventario ni CFDI/Finkok.'
          $j=[ordered]@{version=$env:FR_VERSION;notes=$notes;pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          "FR_LATEST_SHA256=$((Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Respaldar instalador firmado
        uses: actions/upload-artifact@v4
        with:
          name: SOLRAK-v0.1.94-windows-signed
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar v0.1.94 estable y Latest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target '${{ github.sha }}' --title "SOLRAK $tag" --notes 'v0.1.94 estable: hardware Windows nativo para impresora térmica RAW/ESC-POS, báscula USB/COM y lector tipo teclado. Conserva POS, reportes, tickets, caja automática y UX. EXE real validado y updater firmado.' --draft
          $r=$null
          for($i=1;$i -le 20;$i++){$rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json;$r=$rels|Where-Object {$_.tag_name -eq $tag -and $_.draft}|Select-Object -First 1;if($r -and $r.assets.Count -ge 3){break};Start-Sleep -Seconds 2}
          if(-not $r){throw 'No se encontró borrador'}
          $expected=@{$env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256";"$env:FR_ASSET_EXE.sig"="sha256:$env:FR_SIG_SHA256";'latest.json'="sha256:$env:FR_LATEST_SHA256"}
          foreach($n in $expected.Keys){$a=$r.assets|Where-Object {$_.name -eq $n}|Select-Object -First 1;if(-not $a){throw "Falta asset $n"};if([string]$a.digest -ne $expected[$n]){throw "Hash remoto incorrecto $n"}}
          $pub=gh api --method PATCH "/repos/$repo/releases/$($r.id)" -F draft=false -F prerelease=false | ConvertFrom-Json
          if($pub.draft -or $pub.prerelease){throw 'Release no quedó pública'}
          gh release edit $tag --repo $repo --latest
          Write-Host 'V0194_SOLRAK_PUBLICADA_LATEST'

      - name: Verificación pública final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $r=gh api "/repos/$repo/releases/tags/$tag" | ConvertFrom-Json;$latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if($r.draft -or $r.prerelease -or [string]$r.tag_name -ne $tag){throw 'Release inválida'}
          if([string]$latest.tag_name -ne $tag){throw 'v0.1.94 no es Latest'}
          foreach($n in @($env:FR_ASSET_EXE,"$env:FR_ASSET_EXE.sig",'latest.json')){if(-not($r.assets|Where-Object {$_.name -eq $n})){throw "Falta asset $n"}}
          $j=Invoke-RestMethod "https://github.com/$repo/releases/latest/download/latest.json" -TimeoutSec 30
          if([string]$j.version -ne $env:FR_VERSION){throw 'latest.json incorrecto'}
          Write-Host 'PUBLIC_RELEASE_OK v0.1.94 SOLRAK LATEST'

      - name: Limpiar borrador si falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          try{$rels=gh api "/repos/$repo/releases?per_page=100"|ConvertFrom-Json;$r=$rels|Where-Object {$_.tag_name -eq $tag -and $_.draft}|Select-Object -First 1;if($r){gh api --method DELETE "/repos/$repo/releases/$($r.id)"|Out-Null;Write-Host 'Borrador fallido eliminado'}}catch{Write-Host "Limpieza no crítica: $($_.Exception.Message)"}

name: SOLRAK - Release v0.1.94 Hardware Windows

on:
  push:
    branches: [release/v0.1.94-hardware]
    paths:
      - '.github/workflows/windows-release-v0194.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FR_VERSION: "0.1.94"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"
  FR_FIX1_SHA256: "144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight v0.1.94 sin publicar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){throw "$tag ya existe como tag"}
          $global:LASTEXITCODE=0
          npm install --no-save --no-audit --no-fund --package-lock=false jsdom@26.1.0
          foreach($f in @(
            'pos-module.js',
            'solrak-sumapro-tickets-v0169.js',
            'solrak-reports-v0172.js',
            'solrak-shifts-v0189.js',
            'solrak-ux-core-v0190.js',
            'solrak-peripherals-v0191.js',
            'solrak-ux-hardening-v0192.js',
            'solrak-hardware-v0194.js',
            'scripts/apply-hardware-v0194.mjs'
          )){ node --check $f }
          node tests/solrak-hardware-v0194-smoke.mjs
          node tests/solrak-peripherals-v0191-smoke.mjs
          node tests/solrak-v0193-ui-states-focus-smoke.mjs
          node tests/solrak-ux-operational-audit-v0192.mjs
          node tests/solrak-ux-hardening-v0192-smoke.mjs
          node tests/solrak-sumapro-tickets-v0169-smoke.mjs
          node tests/solrak-shifts-v0189-smoke.mjs
          node tests/solrak-caja-cortes-v0185-smoke.mjs
          node tests/solrak-held-tickets-v0176-smoke.mjs
          node tests/solrak-v0164-cash-report-contract.mjs
          node tests/pos-module-smoke.mjs
          if(-not(Test-Path 'branding/solrak-icon.svg')){throw 'Falta icono SOLRAK'}
          $hardware=(Get-Content solrak-hardware-v0194.js -Raw)+(Get-Content desktop-native-v0194/solrak_hardware_v0194.rs -Raw)
          if($hardware -match '(?i)cfdi|finkok|\bdemo\b|\bmock\b|simulad[oa]'){throw 'Hardware fuera de alcance o simulado'}
          if(-not (Select-String -Path pos-module.js -Pattern 'const MAX_TICKETS = 8;' -Quiet)){throw 'MAX_TICKETS ya no es 8'}
          Write-Host 'SOLRAK_V0194_PREFLIGHT_OK'

      - name: Compilar helper WinSpool real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -Path desktop-native-v0194/solrak_raw_print_helper_v0194.cs
          if(-not ('SolrakRawPrinter' -as [type])){throw 'No compiló SolrakRawPrinter'}
          Write-Host 'WIN_SPOOL_HELPER_COMPILE_OK'

      - name: Reconstruir Windows estable e integrar main v0.1.94
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item desktop -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item FIX1.zip -Force -ErrorAction SilentlyContinue
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          if($LASTEXITCODE -ne 0){throw 'No se pudo recuperar FIX1'}
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:FR_FIX1_SHA256){throw "FIX1 hash inesperado $sha"}
          Expand-Archive FIX1.zip . -Force
          if(-not(Test-Path desktop/src-tauri/src/main.rs)){throw 'FIX1 incompleto'}
          node scripts/rebase-fix1-native-v0142.mjs desktop
          Copy-Item index.html desktop/dist/index.html -Force
          Get-ChildItem -Path . -File -Filter '*.js' | ForEach-Object {
            Copy-Item $_.FullName (Join-Path 'desktop/dist' $_.Name) -Force
          }
          Push-Location desktop
          npm install --no-audit --no-fund
          node scripts/set-version.mjs "$env:FR_VERSION"
          Pop-Location
          node scripts/apply-hardware-v0194.mjs desktop
          node scripts/apply-hardware-v0194.mjs desktop
          node scripts/apply-solrak-brand-v0162.mjs desktop
          Push-Location desktop
          npm run tauri -- icon ../branding/solrak-icon.svg
          Pop-Location
          foreach($f in @(
            'desktop/dist/solrak-hardware-v0194.js',
            'desktop/src-tauri/src/solrak_hardware_v0194.rs',
            'desktop/src-tauri/src/solrak_raw_print_helper_v0194.cs',
            'desktop/src-tauri/icons/icon.ico'
          )){if(-not(Test-Path $f)){throw "Falta integración $f"}}
          Write-Host 'SOLRAK_V0194_WINDOWS_INTEGRATED'

      - name: XLSX local y auditoría del paquete
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $dest='desktop/dist/vendor/xlsx.full.min.js'
          $ok=$false
          for($i=1;$i -le 6;$i++){
            try{
              Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile $dest -UseBasicParsing -TimeoutSec 30
              if((Get-Item $dest).Length -gt 500000){$ok=$true;break}
            }catch{Write-Host "XLSX fetch $i falló: $($_.Exception.Message)"}
            Start-Sleep -Seconds (2*$i)
          }
          if(-not $ok){throw 'XLSX incompleto'}
          node scripts/vendor-windows-xlsx-lazy-v0144.mjs desktop/dist/index.html $dest
          node tests/windows-xlsx-lazy-v0144.mjs desktop/dist/index.html
          node tests/windows-facturar-mutation-v0148.mjs desktop/dist/index.html
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html
          $h=Get-Content desktop/dist/index.html -Raw
          foreach($m in @(
            'SOLRAK',
            'solrak-hardware-v0194.js',
            'solrak-sumapro-tickets-v0169.js',
            'solrak-reports-v0172.js',
            'solrak-shifts-v0189.js',
            'solrak-ux-hardening-v0192.js'
          )){if(-not $h.Contains($m)){throw "Marcador empaquetado faltante $m"}}
          $tickets=Get-Content desktop/dist/solrak-sumapro-tickets-v0169.js -Raw
          if(-not $tickets.Contains('nativeHardware?.directPrintEnabled?.()')){throw 'Ticket no quedó conectado al hardware'}
          Write-Host 'SOLRAK_V0194_PACKAGE_AUDIT_OK'

      - name: Cargo test check y contrato nativo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location desktop/src-tauri
          cargo generate-lockfile
          cargo test --locked
          cargo check --locked
          Pop-Location
          $main=Get-Content desktop/src-tauri/src/main.rs -Raw
          foreach($m in @(
            'hardware_status_v0194',
            'list_serial_ports_v0194',
            'scale_connect_v0194',
            'scale_read_v0194',
            'scale_disconnect_v0194',
            'list_windows_printers_v0194',
            'print_raw_ticket_v0194'
          )){if(-not $main.Contains($m)){throw "main.rs no registra $m"}}
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){throw 'Versión Tauri incorrecta'}
          if([string]$t.productName -ne 'SOLRAK'){throw 'productName no es SOLRAK'}
          if([string]$t.identifier -ne 'com.facturarapida.desktop'){throw 'Identifier técnico cambió'}
          Write-Host 'SOLRAK_V0194_NATIVE_CARGO_OK'

      - name: Configurar updater firmado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $c=@{
            app=@{withGlobalTauri=$true}
            bundle=@{createUpdaterArtifacts=$true}
            plugins=@{
              updater=@{
                pubkey=$env:FR_UPDATER_PUBKEY
                endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')
              }
            }
          }
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar EXE real
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Aceptación EXE real Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 150;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){
                $txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'}
                throw "EXE se cerró: $txt"
              }
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started') -and $txt.Contains('PAGE_LOAD Finished')
                $dom=$txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('"ok":true') -and $txt.Contains('"hitOk":true') -and $txt.Contains('"focusOk":true')
                if($base -and $dom -and $ready){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){
              $txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'}
              throw "EXE real no pasó aceptación: $txt"
            }
            Start-Sleep -Seconds 15
            if($p.HasExited){throw 'EXE se cerró después de LOGIN_UI_READY'}
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }
          Write-Host 'WINDOWS_REAL_ACCEPTANCE_0.1.94_SOLRAK_OK'

      - name: Preparar assets firma hashes y latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}
          $sig="$($exe.FullName).sig"
          if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="SOLRAK_$env:FR_VERSION`_x64-setup.exe"
          Copy-Item $exe.FullName "release-files/$name" -Force
          Copy-Item $sig "release-files/$name.sig" -Force
          $eh=(Get-FileHash "release-files/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh=(Get-FileHash "release-files/$name.sig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$eh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $signature=(Get-Content "release-files/$name.sig" -Raw).Trim()
          if([string]::IsNullOrWhiteSpace($signature)){throw 'Firma vacía'}
          $url="https://github.com/$repo/releases/download/$tag/$name"
          $notes='SOLRAK v0.1.94: hardware Windows nativo para impresora térmica RAW/ESC-POS, báscula USB/COM y lector de códigos tipo teclado; además conserva POS, reportes, tickets, caja automática, inventario, clientes, créditos y UX de v0.1.93. Sin cambios de precios/inventario ni CFDI/Finkok.'
          $j=[ordered]@{
            version=$env:FR_VERSION
            notes=$notes
            pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms=[ordered]@{
              'windows-x86_64'=[ordered]@{signature=$signature;url=$url}
            }
          }
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          "FR_LATEST_SHA256=$((Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Respaldar instalador firmado
        uses: actions/upload-artifact@v4
        with:
          name: SOLRAK-v0.1.94-windows-signed
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar estable y marcar Latest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target '${{ github.sha }}' --title "SOLRAK $tag" --notes 'v0.1.94 estable: integra impresora térmica Windows RAW/ESC-POS, báscula USB/COM real y lector tipo teclado, conservando POS, reportes, tickets, caja automática y UX. EXE real validado y updater firmado.' --draft
          if($LASTEXITCODE -ne 0){throw 'GitHub no permitió crear release v0.1.94'}
          $r=$null
          for($i=1;$i -le 20;$i++){
            $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
            $r=$rels | Where-Object {$_.tag_name -eq $tag -and $_.draft} | Select-Object -First 1
            if($r -and $r.assets.Count -ge 3){break}
            Start-Sleep -Seconds 2
          }
          if(-not $r){throw 'No se encontró borrador v0.1.94'}
          $expected=@{
            $env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256"
            "$env:FR_ASSET_EXE.sig"="sha256:$env:FR_SIG_SHA256"
            'latest.json'="sha256:$env:FR_LATEST_SHA256"
          }
          foreach($n in $expected.Keys){
            $a=$r.assets | Where-Object {$_.name -eq $n} | Select-Object -First 1
            if(-not $a){throw "Falta asset $n"}
            if([string]$a.digest -ne $expected[$n]){throw "Hash remoto incorrecto $n"}
          }
          $pub=gh api --method PATCH "/repos/$repo/releases/$($r.id)" -F draft=false -F prerelease=false | ConvertFrom-Json
          if($pub.draft -or $pub.prerelease -or [string]$pub.tag_name -ne $tag){throw 'Release no quedó pública'}
          gh release edit $tag --repo $repo --latest
          Write-Host 'V0194_SOLRAK_PUBLICADA_Y_MARCADA_LATEST'

      - name: Verificación pública final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $r=gh api "/repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if($r.draft -or $r.prerelease -or [string]$r.tag_name -ne $tag){throw 'Release tag inválida'}
          if([string]$latest.tag_name -ne $tag){throw 'v0.1.94 no es Latest'}
          foreach($n in @($env:FR_ASSET_EXE,"$env:FR_ASSET_EXE.sig",'latest.json')){
            if(-not($r.assets | Where-Object {$_.name -eq $n})){throw "Falta asset público $n"}
          }
          $j=Invoke-RestMethod "https://github.com/$repo/releases/latest/download/latest.json" -TimeoutSec 30
          if([string]$j.version -ne $env:FR_VERSION){throw 'latest.json versión incorrecta'}
          Write-Host 'PUBLIC_RELEASE_OK v0.1.94 SOLRAK LATEST'

      - name: Limpiar borrador si falla antes de publicar
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          try{
            $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
            $r=$rels | Where-Object {$_.tag_name -eq $tag -and $_.draft} | Select-Object -First 1
            if($r){
              gh api --method DELETE "/repos/$repo/releases/$($r.id)" | Out-Null
              Write-Host 'Borrador fallido eliminado'
            }
          }catch{
            Write-Host "Limpieza no crítica: $($_.Exception.Message)"
          }

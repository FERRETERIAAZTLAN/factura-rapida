name: Product images safe integration
on:
  push:
    branches: [feature/truper-product-images]
    paths:
      - product-images-module.js
      - .github/workflows/inject-product-images-safe.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate product images JavaScript
        run: node --check product-images-module.js
      - name: Inject product images module safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="product-images-module.js?v=1"></script>'
          if tag not in s:
              anchor='<script src="quotes-module.js?v=1"></script>'
              if anchor in s:
                  s=s.replace(anchor, tag+anchor, 1)
              elif '</body>' in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
              else:
                  raise SystemExit('No se encontró un punto seguro de inyección')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Prove index only adds product image loader
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > /tmp/main-index.html
          python - <<'PY'
          from pathlib import Path
          main=Path('/tmp/main-index.html').read_text(encoding='utf-8')
          branch=Path('index.html').read_text(encoding='utf-8')
          tag='<script src="product-images-module.js?v=1"></script>'
          expected=main
          if tag not in expected:
              anchor='<script src="quotes-module.js?v=1"></script>'
              if anchor in expected:
                  expected=expected.replace(anchor,tag+anchor,1)
              else:
                  expected=expected.replace('</body>',tag+'\n</body>',1)
          if branch != expected:
              raise SystemExit('index.html contiene cambios adicionales; integración bloqueada')
          print('OK: index.html solo agrega product-images-module.js')
          PY
      - name: Commit safe loader on feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Loader already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: load product images module safely'
          git push origin HEAD:feature/truper-product-images

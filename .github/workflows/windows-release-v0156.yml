name: Factura Rapida - Release v0.1.56 Quote Email Stable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0156.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.56"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"
  FR_QUOTE_EMAIL_API: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/quote-delivery-api"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight version nueva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){throw "$tag ya existe como tag"}
          $global:LASTEXITCODE=0

      - name: Backend productivo read-only sin CFDI
        shell: pwsh
        run: node tests/production-live-smoke.mjs

      - name: Reconstruir base FIX1 validada
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          if($LASTEXITCODE -ne 0){throw 'No se pudo recuperar FIX1'}
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134'){throw "FIX1 hash inesperado $sha"}
          Expand-Archive FIX1.zip . -Force
          node scripts/rebase-fix1-native-v0142.mjs desktop
          node scripts/ensure-rust-deps-v0143.mjs desktop/src-tauri/Cargo.toml
          Push-Location desktop
          npm install --no-audit --no-fund
          node scripts/set-version.mjs "$env:FR_VERSION"
          Pop-Location
          npm install --no-save --no-audit --no-fund jsdom@25

      - name: Sincronizar UI productiva estable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ok=$false
          for($i=1;$i -le 8;$i++){
            try{
              Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'} -TimeoutSec 30
              if((Get-Item production-source.html).Length -gt 10000){$ok=$true;break}
            } catch { Write-Host "UI fetch $i fallo: $($_.Exception.Message)" }
            Start-Sleep -Seconds ([Math]::Min(3*$i,15))
          }
          if(-not $ok){throw 'UI productiva no disponible'}
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          Pop-Location
          node scripts/sanitize-production-ui-v0142.mjs desktop/dist/index.html
          node scripts/clean-webview-startup-v0148.mjs desktop/dist/index.html
          node scripts/fix-facturar-mutation-v0148.mjs desktop/dist/index.html

      - name: Integrar Cotizaciones y correo de forma aislada
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check quotes-module.js
          node --check quotes-email-module.js
          node tests/quote-email-ui-smoke.mjs
          Copy-Item quotes-module.js desktop/dist/quotes-module.js -Force
          Copy-Item quotes-email-module.js desktop/dist/quotes-email-module.js -Force
          $p='desktop/dist/index.html'
          $h=Get-Content $p -Raw
          $quoteTag='<script src="quotes-module.js?v=1"></script>'
          $mailTag='<script src="quotes-email-module.js?v=1"></script>'
          if(-not $h.Contains($quoteTag)){
            if(-not $h.Contains('</body>')){throw 'index.html sin cierre body'}
            $h=$h.Replace('</body>',"$quoteTag`r`n</body>")
          }
          if(-not $h.Contains($mailTag)){
            if(-not $h.Contains('</body>')){throw 'index.html sin cierre body'}
            $h=$h.Replace('</body>',"$mailTag`r`n</body>")
          }
          Set-Content $p $h -Encoding UTF8
          $check=Get-Content $p -Raw
          foreach($m in @($quoteTag,$mailTag)){if(-not $check.Contains($m)){throw "Marcador de Cotizaciones faltante: $m"}}
          foreach($f in @('desktop/dist/quotes-module.js','desktop/dist/quotes-email-module.js')){if(-not(Test-Path $f)){throw "Falta $f"}}
          $q=Get-Content desktop/dist/quotes-module.js -Raw
          foreach($m in @('quote-api','Cotizaciones','Guardar cotización','Pasar a factura')){if(-not $q.Contains($m)){throw "Cotizaciones incompletas: $m"}}
          $e=Get-Content desktop/dist/quotes-email-module.js -Raw
          foreach($m in @('quote-delivery-api','Enviar correo','Reenviar correo','sendQuote','last_email_sent_at')){if(-not $e.Contains($m)){throw "Correo de cotizaciones incompleto: $m"}}
          Write-Host 'COTIZACIONES_Y_CORREO_INTEGRADOS_OK'

      - name: Verificar salud quote-delivery-api sin enviar correo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $h=Get-Content desktop/dist/index.html -Raw
          $m=[regex]::Match($h,"const\s+ANON_KEY\s*=\s*['\"]([^'\"]+)['\"]")
          if(-not $m.Success){throw 'No se pudo leer ANON_KEY pública para health check'}
          $anon=$m.Groups[1].Value
          $headers=@{Authorization="Bearer $anon";apikey=$anon}
          $body='{"action":"health"}'
          $r=Invoke-RestMethod -Method Post -Uri $env:FR_QUOTE_EMAIL_API -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 30
          if(-not $r.ok -or [string]$r.service -ne 'quote-delivery-api' -or [int]$r.version -ne 1){throw 'quote-delivery-api health inválido'}
          if($r.isolatedFromCfdi -ne $true){throw 'quote-delivery-api no reporta aislamiento CFDI'}
          Write-Host 'QUOTE_DELIVERY_API_HEALTH_OK_NO_EMAIL_SENT'

      - name: XLSX local lazy y pruebas estables
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $dest='desktop/dist/vendor/xlsx.full.min.js'
          $ok=$false
          for($i=1;$i -le 6;$i++){
            try{
              Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile $dest -UseBasicParsing -TimeoutSec 30
              if((Get-Item $dest).Length -gt 500000){$ok=$true;break}
            } catch { Write-Host "XLSX fetch $i fallo" }
            Start-Sleep -Seconds (2*$i)
          }
          if(-not $ok){throw 'XLSX incompleto'}
          node scripts/vendor-windows-xlsx-lazy-v0144.mjs desktop/dist/index.html $dest
          node tests/windows-xlsx-lazy-v0144.mjs desktop/dist/index.html
          node tests/windows-facturar-mutation-v0148.mjs desktop/dist/index.html

      - name: Auditorias productivas y login seguro
        shell: pwsh
        run: |
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html
          $env:FR_LOCAL_UI_PATH='desktop/dist/index.html'
          node tests/production-live-smoke.mjs
          $h=Get-Content desktop/dist/index.html -Raw
          foreach($m in @('frNativeBar','frNativeDesktopJs','window.__TAURI__','desktop_info','check_for_updates','install_update','quotes-module.js?v=1','quotes-email-module.js?v=1')){if(-not $h.Contains($m)){throw "Marcador faltante $m"}}

      - name: Cargo check y configurar updater firmado
        shell: pwsh
        run: |
          Push-Location desktop/src-tauri
          cargo generate-lockfile
          cargo check --locked
          Pop-Location
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){throw 'Version incorrecta'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar EXE real
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Aceptacion EXE real completa
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 150;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE se cerro: $txt"}
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started') -and $txt.Contains('PAGE_LOAD Finished')
                $dom=$txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('"ok":true') -and $txt.Contains('"hitOk":true') -and $txt.Contains('"focusOk":true')
                if($base -and $dom -and $ready){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE real no paso aceptacion: $txt"}
            Start-Sleep -Seconds 25
            if($p.HasExited){throw 'EXE se cerro despues de LOGIN_UI_READY'}
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }
          Write-Host 'WINDOWS_REAL_ACCEPTANCE_0.1.56_OK'

      - name: Preparar assets firma y hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}
          $sig="$($exe.FullName).sig"
          if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe"
          Copy-Item $exe.FullName "release-files/$name" -Force
          Copy-Item $sig "release-files/$name.sig" -Force
          $eh=(Get-FileHash "release-files/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh=(Get-FileHash "release-files/$name.sig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$eh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $signature=(Get-Content "release-files/$name.sig" -Raw).Trim()
          $url="https://github.com/$repo/releases/download/$tag/$name"
          $j=[ordered]@{version=$env:FR_VERSION;notes='Cotizaciones por correo desde el Gmail configurado del negocio, con PDF adjunto y registro de envío. Base estable FIX1; EXE real validado; sin emitir CFDI durante pruebas.';pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          "FR_LATEST_SHA256=$((Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publicar estable y marcar Latest explicitamente
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target $env:GITHUB_SHA --title "Factura Rapida $tag" --notes 'v0.1.56 estable: envío de cotizaciones por Gmail con PDF adjunto y registro de envío. EXE real, DOM, hit-test, foco y permanencia validados. No se emitió CFDI durante pruebas.' --draft
          $r=$null
          for($i=1;$i -le 30;$i++){
            $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
            $r=$rels | Where-Object {$_.tag_name -eq $tag -and $_.draft} | Select-Object -First 1
            if($r -and $r.assets.Count -ge 3){break}
            Start-Sleep -Seconds 2
          }
          if(-not $r){throw 'No se encontro borrador de release'}
          $expected=@{$env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256";"$env:FR_ASSET_EXE.sig"="sha256:$env:FR_SIG_SHA256";'latest.json'="sha256:$env:FR_LATEST_SHA256"}
          foreach($n in $expected.Keys){
            $a=$r.assets | Where-Object {$_.name -eq $n} | Select-Object -First 1
            if(-not $a){throw "Falta asset $n"}
            if([string]$a.digest -ne $expected[$n]){throw "Hash remoto incorrecto $n"}
          }
          $pub=gh api --method PATCH "/repos/$repo/releases/$($r.id)" -F draft=false -F prerelease=false | ConvertFrom-Json
          if($pub.draft -or $pub.prerelease -or [string]$pub.tag_name -ne $tag){throw 'Release no quedo publica'}
          gh release edit $tag --repo $repo --latest
          $published=gh api "/repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if($published.draft -or $published.prerelease){throw 'v0.1.56 no quedo estable'}
          Write-Host 'V0156_PUBLICADA_Y_MARCADA_LATEST'

      - name: Verificacion publica final por tag y latest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $tagBase="https://github.com/$repo/releases/download/$tag"
          New-Item -ItemType Directory -Force public-check | Out-Null
          foreach($n in @($env:FR_ASSET_EXE,"$env:FR_ASSET_EXE.sig",'latest.json')){
            $ok=$false
            for($i=1;$i -le 20;$i++){
              try{Invoke-WebRequest "$tagBase/$n" -OutFile "public-check/$n" -UseBasicParsing -TimeoutSec 30;$ok=$true;break}catch{Start-Sleep -Seconds 2}
            }
            if(-not $ok){throw "No descarga publica por tag: $n"}
          }
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_EXE_SHA256){throw 'EXE hash'}
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE.sig" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_SIG_SHA256){throw 'SIG hash'}
          if((Get-FileHash public-check/latest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_LATEST_SHA256){throw 'latest tag hash'}
          $latest=$null
          for($i=1;$i -le 60;$i++){
            try{$latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json}catch{$latest=$null}
            if($latest -and [string]$latest.tag_name -eq $tag -and -not $latest.draft -and -not $latest.prerelease){break}
            if($i -eq 20 -or $i -eq 40){gh release edit $tag --repo $repo --latest}
            Start-Sleep -Seconds 2
          }
          if(-not $latest -or [string]$latest.tag_name -ne $tag){throw 'v0.1.56 no quedo como latest'}
          $latestUrl="https://github.com/$repo/releases/latest/download/latest.json"
          $ok=$false
          for($i=1;$i -le 20;$i++){
            try{Invoke-WebRequest $latestUrl -OutFile public-check/latest-via-latest.json -UseBasicParsing -TimeoutSec 30;$ok=$true;break}catch{Start-Sleep -Seconds 2}
          }
          if(-not $ok){throw 'Updater latest.json no descargable por /releases/latest'}
          if((Get-FileHash public-check/latest-via-latest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_LATEST_SHA256){throw 'latest endpoint hash'}
          $manifest=Get-Content public-check/latest-via-latest.json -Raw | ConvertFrom-Json
          if([string]$manifest.version -ne $env:FR_VERSION){throw 'latest version'}
          if([string]$manifest.platforms.'windows-x86_64'.signature -ne (Get-Content "public-check/$env:FR_ASSET_EXE.sig" -Raw).Trim()){throw 'latest firma'}
          if(-not([string]$manifest.platforms.'windows-x86_64'.url).Contains("/releases/download/$tag/$env:FR_ASSET_EXE")){throw 'latest URL'}
          Write-Host 'PUBLIC_RELEASE_OK v0.1.56 QUOTE EMAIL LATEST'

      - name: Limpiar version fallida
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach($r in ($rels | Where-Object {$_.tag_name -eq $tag})){gh api --method DELETE "/repos/$repo/releases/$($r.id)" *> $null}
          gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" *> $null
          $global:LASTEXITCODE=0

name: SOLRAK v0.1.94 - Extraer diagnóstico run Windows

on:
  push:
    branches: [release/v0.1.94-hardware]
    paths:
      - '.github/workflows/extract-v0194-run2-log.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.94-hardware
          fetch-depth: 0
      - name: Extraer error del diagnóstico 33616500812
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf runlogs runlogs.zip
          mkdir -p runlogs diagnostics-v0194
          gh api "/repos/${{ github.repository }}/actions/runs/33616500812/logs" > runlogs.zip
          unzip -q runlogs.zip -d runlogs
          {
            echo 'RUN=33616500812'
            echo 'HEAD=88fe6e03b9eb95c56f86e7395fab2f583e97d665'
            grep -RInaE 'Error|ERROR|Exception|throw|Falta|falta|incomplet|No se pudo|failed|FAIL|audit|AUDIT' runlogs || true
          } > diagnostics-v0194/packaging-diagnostic-run3.txt
          cat diagnostics-v0194/packaging-diagnostic-run3.txt
      - name: Guardar diagnóstico
        run: |
          set -euo pipefail
          git config user.name 'FERRETERIAAZTLAN'
          git config user.email '48nym4hh7h@privaterelay.appleid.com'
          git add diagnostics-v0194/packaging-diagnostic-run3.txt
          git commit -m 'diagnostic: extraer fallo del instrumentador v0.1.94'
          git push origin HEAD:release/v0.1.94-hardware

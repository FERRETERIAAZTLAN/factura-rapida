name: Factura Rapida - Release v0.1.30 Clean Startup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0130.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.30"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_PRODUCTION_HEALTH_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-production-health?business=AZTLAN"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight de release limpio
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $existing=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($existing | Where-Object { $_.tag_name -eq $tag }) { throw "$tag ya existe como release" }
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){ throw "$tag ya existe como tag" }
          $global:LASTEXITCODE=0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Auditoria LIVE de produccion
        shell: pwsh
        run: node tests/production-live-smoke.mjs

      - name: Preparar Desktop base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip' | Select-Object -First 1
          if(-not $zip){ throw 'No se encontro ZIP base' }
          Expand-Archive $zip.FullName . -Force
          if(-not(Test-Path desktop)){ throw 'No se creo desktop' }

      - name: Validar llaves de firma y updater
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){ throw 'Falta TAURI_SIGNING_PRIVATE_KEY' }
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)){ throw 'Falta TAURI_SIGNING_PRIVATE_KEY_PASSWORD' }
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){ throw 'Falta TAURI_UPDATER_PUBKEY' }

      - name: Preparar sync-web Rust y puente Tauri global
        shell: pwsh
        run: node scripts/prepare-windows-desktop.mjs

      - name: Verificar puente nativo antes del merge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sync=Get-Content desktop/scripts/sync-web.mjs -Raw
          if(-not $sync.Contains('process.env.FR_WEB_SOURCE')){ throw 'sync-web no acepta la UI productiva como fuente' }
          $rust=Get-Content desktop/src-tauri/src/main.rs -Raw
          foreach($m in @('CARGO_PKG_VERSION','desktop_info','check_for_updates','install_update')){
            if(-not $rust.Contains($m)){ throw "Rust perdio comando/marcador nativo: $m" }
          }
          foreach($bad in @('START 0.1.4','SETUP_OK 0.1.4','UPDATER_PLUGIN_OK 0.1.4')){
            if($rust.Contains($bad)){ throw "Persistio log hardcodeado: $bad" }
          }
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if($t.app.withGlobalTauri -ne $true){ throw 'app.withGlobalTauri no quedo habilitado' }
          Write-Host 'PUENTE TAURI GLOBAL OK'

      - name: Instalar dependencias Desktop
        working-directory: desktop
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Asegurar serde_json
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          if(-not(Select-String -Path Cargo.toml -Pattern 'serde_json' -Quiet)){ cargo add serde_json@1 }

      - name: Establecer version real
        working-directory: desktop
        shell: pwsh
        run: node scripts/set-version.mjs "$env:FR_VERSION"

      - name: Descargar UI productiva como fuente del merge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'}
          if(-not(Test-Path production-source.html)){ throw 'No se descargo UI productiva' }
          $h=Get-Content production-source.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-webview-debug="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"')){
            if(-not $h.Contains($m)){ throw "Fuente productiva incompleta: $m" }
          }
          Write-Host "FUENTE PRODUCTIVA SHA256 $((Get-FileHash production-source.html -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Fusionar UI productiva con puentes nativos Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          Pop-Location
          if(-not(Test-Path desktop/dist/index.html)){ throw 'sync-web no genero desktop/dist/index.html' }

      - name: Inyectar arranque limpio WebView2 antes de la app
        shell: pwsh
        run: node scripts/finalize-windows-html.mjs desktop/dist/index.html

      - name: Verificar almacenamiento limpio y puente nativo exactos
        shell: pwsh
        run: node tests/windows-storage-startup-v0130.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json

      - name: Verificar merge final productivo nativo y sin sesion vieja
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $h=Get-Content desktop/dist/index.html -Raw
          foreach($m in @(
            'data-fr-production-clean="1"',
            'data-fr-webview-debug="1"',
            'data-fr-facturar-real="8"',
            'data-fr-login-clean="1"',
            'id="frStorageMigration"',
            'data-fr-storage-version="0.1.30"',
            'fr_webview_storage_version',
            'localStorage.clear()',
            'sessionStorage.clear()',
            'id="frNativeBar"',
            'id="frNativeDesktopJs"',
            'window.__TAURI__',
            'desktop_info',
            'check_for_updates',
            'install_update',
            'LOGIN_LOADALL_SLOW',
            'RESTORE_LOADALL_SLOW'
          )){
            if(-not $h.Contains($m)){ throw "HTML final perdio marcador: $m" }
          }
          $firstScript=[regex]::Match($h,'<script(?:\s[^>]*)?>',[System.Text.RegularExpressions.RegexOptions]::IgnoreCase).Value
          if(-not $firstScript.Contains('frStorageMigration')){ throw 'La limpieza de localStorage no es el primer script' }
          if($h.Contains("loadAll tardó más de 15000 ms")){ throw 'Persistio watchdog intrusivo de login' }
          if($h.Contains("restore loadAll tardó más de 15000 ms")){ throw 'Persistio watchdog intrusivo de restore' }
          Write-Host "HTML FINAL CLEAN SHA256 $((Get-FileHash desktop/dist/index.html -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Auditoria del HTML exacto que entra al EXE
        shell: pwsh
        env:
          FR_LOCAL_UI_PATH: desktop/dist/index.html
        run: node tests/production-live-smoke.mjs

      - name: Verificar version y configuracion Tauri
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){ throw 'tauri.conf no tiene version real' }
          if([string]$t.build.frontendDist -ne '../dist'){ throw 'Tauri no apunta a ../dist' }
          if($t.app.withGlobalTauri -ne $true){ throw 'Tauri global API no esta habilitada' }
          $cargo=Get-Content desktop/src-tauri/Cargo.toml -Raw
          if($cargo -notmatch ('version\s*=\s*"'+[regex]::Escape($env:FR_VERSION)+'"')){ throw 'Cargo.toml no tiene version real' }
          $c=@{
            app=@{withGlobalTauri=$true}
            bundle=@{createUpdaterArtifacts=$true}
            plugins=@{updater=@{
              pubkey=$env:FR_UPDATER_PUBKEY
              endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')
            }}
          }
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar Windows sin publicar
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
          if($LASTEXITCODE -ne 0){ throw "Tauri build fallo con codigo $LASTEXITCODE" }

      - name: Preparar artefactos y hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){ throw 'No se genero EXE NSIS' }
          $sigPath="$($exe.FullName).sig"
          if(-not(Test-Path $sigPath)){ throw 'No se genero firma .exe.sig' }
          New-Item -ItemType Directory -Force release-files | Out-Null
          $safeExe="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe"
          $safeSig="$safeExe.sig"
          Copy-Item $exe.FullName "release-files/$safeExe" -Force
          Copy-Item $sigPath "release-files/$safeSig" -Force
          $exeHash=(Get-FileHash "release-files/$safeExe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sigHash=(Get-FileHash "release-files/$safeSig" -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature=(Get-Content "release-files/$safeSig" -Raw).Trim()
          if([string]::IsNullOrWhiteSpace($signature)){ throw 'Firma vacia' }
          "FR_ASSET_EXE=$safeExe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_ASSET_SIG=$safeSig" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$exeHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sigHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "EXE SHA256 $exeHash"
          Write-Host "SIG SHA256 $sigHash"

      - name: Generar latest.json local
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $signature=(Get-Content "release-files/$env:FR_ASSET_SIG" -Raw).Trim()
          $url="https://github.com/$repo/releases/download/$tag/$env:FR_ASSET_EXE"
          $j=[ordered]@{
            version=$env:FR_VERSION
            notes="Factura Rapida $env:FR_VERSION - arranque limpio WebView2: elimina localStorage/sessionStorage obsoletos al cambiar version y expone window.__TAURI__ de forma explicita"
            pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms=[ordered]@{
              'windows-x86_64'=[ordered]@{signature=$signature;url=$url}
            }
          }
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          $latestHash=(Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_LATEST_SHA256=$latestHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $check=Get-Content release-files/latest.json -Raw | ConvertFrom-Json
          if([string]$check.version -ne $env:FR_VERSION){ throw 'latest.json tiene version incorrecta' }
          if([string]$check.platforms.'windows-x86_64'.signature.Trim() -ne $signature){ throw 'latest.json no contiene la firma exacta' }

      - name: Crear release borrador y subir artefactos
        id: draft
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          gh release create $tag `
            "release-files/$env:FR_ASSET_EXE" `
            "release-files/$env:FR_ASSET_SIG" `
            "release-files/latest.json" `
            --repo $repo `
            --target $env:GITHUB_SHA `
            --title "Factura Rapida $tag" `
            --notes "Instalador limpio para WebView2. Al detectar cambio de version limpia localStorage y sessionStorage antes de restaurar auth. Tauri expone window.__TAURI__ con withGlobalTauri=true. UI productiva y flujo fiscal se verifican sin emitir CFDI." `
            --draft
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          $r=$rels | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if(-not $r){ throw 'No se encontro el release borrador recien creado' }
          if(-not $r.draft){ throw 'El release debia permanecer borrador durante la verificacion' }
          "release_id=$($r.id)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verificar artefactos remotos antes de publicar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $rid='${{ steps.draft.outputs.release_id }}'
          $r=gh api "/repos/$repo/releases/$rid" | ConvertFrom-Json
          if(-not $r.draft -or $r.prerelease){ throw 'Estado inesperado del borrador' }
          $exe=$r.assets | Where-Object { $_.name -eq $env:FR_ASSET_EXE } | Select-Object -First 1
          $sig=$r.assets | Where-Object { $_.name -eq $env:FR_ASSET_SIG } | Select-Object -First 1
          $lat=$r.assets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1
          if(-not $exe -or -not $sig -or -not $lat){ throw 'Borrador incompleto: faltan EXE, SIG o latest.json' }
          if($exe.digest -and $exe.digest -ne "sha256:$env:FR_EXE_SHA256"){ throw 'Hash remoto del EXE no coincide' }
          if($sig.digest -and $sig.digest -ne "sha256:$env:FR_SIG_SHA256"){ throw 'Hash remoto de SIG no coincide' }
          if($lat.digest -and $lat.digest -ne "sha256:$env:FR_LATEST_SHA256"){ throw 'Hash remoto de latest.json no coincide' }
          Write-Host 'BORRADOR REMOTO LIMPIO OK'

      - name: Publicar release estable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $rid='${{ steps.draft.outputs.release_id }}'
          gh api --method PATCH "/repos/$repo/releases/$rid" -F draft=false -F prerelease=false -F make_latest=true | Out-Null
          $r=gh api "/repos/$repo/releases/$rid" | ConvertFrom-Json
          if($r.draft -or $r.prerelease -or [string]$r.tag_name -ne "v$env:FR_VERSION"){ throw 'Release no quedo estable' }
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if([string]$latest.tag_name -ne "v$env:FR_VERSION"){ throw 'GitHub latest no apunta a la version nueva' }

      - name: Verificacion publica final por descarga
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          New-Item -ItemType Directory -Force verify-public | Out-Null
          $base="https://github.com/$repo/releases/download/$tag"
          $items=@(
            @{url="$base/$env:FR_ASSET_EXE";out='verify-public/app.exe'},
            @{url="$base/$env:FR_ASSET_SIG";out='verify-public/app.exe.sig'},
            @{url="https://github.com/$repo/releases/latest/download/latest.json";out='verify-public/latest.json'}
          )
          foreach($item in $items){
            $ok=$false
            for($i=1;$i -le 6;$i++){
              try{
                Invoke-WebRequest -Uri $item.url -OutFile $item.out -UseBasicParsing
                if((Get-Item $item.out).Length -gt 0){$ok=$true;break}
              }catch{ Start-Sleep -Seconds 3 }
            }
            if(-not $ok){ throw "No se pudo descargar publicamente $($item.url)" }
          }
          $exeHash=(Get-FileHash verify-public/app.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sigHash=(Get-FileHash verify-public/app.exe.sig -Algorithm SHA256).Hash.ToLowerInvariant()
          if($exeHash -ne $env:FR_EXE_SHA256){ throw 'EXE publico distinto al construido' }
          if($sigHash -ne $env:FR_SIG_SHA256){ throw 'SIG publico distinto al construido' }
          $j=Get-Content verify-public/latest.json -Raw | ConvertFrom-Json
          $signature=(Get-Content verify-public/app.exe.sig -Raw).Trim()
          $p=$j.platforms.'windows-x86_64'
          if([string]$j.version -ne $env:FR_VERSION){ throw 'latest.json publico tiene version incorrecta' }
          if(-not $p -or [string]$p.signature.Trim() -ne $signature){ throw 'latest.json publico no coincide con la firma publicada' }
          if([string]$p.url -ne "$base/$env:FR_ASSET_EXE"){ throw 'latest.json publico apunta a URL incorrecta' }
          Write-Host "VERIFICACION FINAL OK v$env:FR_VERSION - EXE limpio, firma y latest.json identicos y publicos"

      - name: Limpiar release incompleto si falla
        if: failure() && steps.draft.outputs.release_id != ''
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'
          $rid='${{ steps.draft.outputs.release_id }}'
          $r=gh api "/repos/$repo/releases/$rid" 2>$null | ConvertFrom-Json
          if($r -and $r.draft){
            gh api --method DELETE "/repos/$repo/releases/$rid" | Out-Null
            Write-Host 'Release borrador incompleto eliminado'
          }

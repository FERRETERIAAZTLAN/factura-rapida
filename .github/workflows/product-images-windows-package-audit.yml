name: Product images Windows package audit
on:
  push:
    branches: [feature/truper-product-images]
    paths:
      - .github/workflows/product-images-windows-package-audit.yml
      - product-images-module.js
      - index.html
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand desktop source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop
          mkdir desktop
          unzip -q Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip -d desktop
          test -f desktop/package.json
      - name: Inspect sync-web contract
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(!p.scripts?.['sync-web']) throw new Error('Falta script sync-web'); console.log(p.scripts['sync-web'])"
      - name: Run same web synchronization used by Windows build
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run sync-web
      - name: Assert all external web modules are packaged
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          echo 'Buscando archivos sincronizados:'
          find . -type f \( -name 'index.html' -o -name 'quotes-module.js' -o -name 'product-images-module.js' \) -print
          test "$(find . -type f -name 'index.html' | wc -l)" -ge 1
          test "$(find . -type f -name 'quotes-module.js' | wc -l)" -ge 1
          test "$(find . -type f -name 'product-images-module.js' | wc -l)" -ge 1
          echo 'OK: index, cotizaciones e imágenes están en el paquete de escritorio.'

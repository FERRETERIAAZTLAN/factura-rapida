name: SOLRAK v0.1.72 Bootstrap

on:
  push:
    branches: [release/v0.1.72-venta-reportes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[v0172-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.72-venta-reportes

      - name: Materializar módulo y prueba v0.1.72
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > solrak-reports-v0172.js
          mkdir -p tests
          printf '%s' '' | base64 -d | gzip -d > tests/solrak-reports-v0172-smoke.mjs

      - name: Integrar carga después de v0.1.71
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="solrak-reports-v0172.js?v=1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html no contiene </body>')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s)
          if s.count(tag) != 1:
              raise SystemExit('La carga v0.1.72 debe aparecer exactamente una vez')
          PY

      - name: Crear Safe Test permanente
        run: |
          set -euo pipefail
          cat > .github/workflows/solrak-v0172-reports-test.yml <<'EOF'
          name: SOLRAK v0.1.72 Venta Reportes Safe Test

          on:
            push:
              branches: [release/v0.1.72-venta-reportes]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            safe-test:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"

                - name: Dependencias de pruebas
                  run: npm install --no-save --no-audit --no-fund jsdom@25

                - name: Validar v0.1.72
                  run: |
                    set -euo pipefail
                    node --check solrak-reports-v0172.js
                    node tests/solrak-reports-v0172-smoke.mjs
                    test "$(grep -o 'solrak-reports-v0172.js?v=1' index.html | wc -l)" -eq 1
                    if grep -qi 'Recargas y Servicios' solrak-reports-v0172.js; then exit 1; fi

                - name: Regresiones POS y facturación
                  run: |
                    set -euo pipefail
                    node tests/solrak-sumapro-fiel-v0171-smoke.mjs
                    node tests/solrak-pos-operations-v0171-contract.mjs
                    node tests/pos-module-smoke.mjs
                    node tests/solrak-redesign-v0170-smoke.mjs
                    node tests/quote-email-ui-smoke.mjs
          EOF

      - name: Verificación local de parche
        run: |
          set -euo pipefail
          node --check solrak-reports-v0172.js
          node tests/solrak-reports-v0172-smoke.mjs
          test "$(grep -o 'solrak-reports-v0172.js?v=1' index.html | wc -l)" -eq 1

      - name: Confirmar cambios en rama
        run: |
          set -euo pipefail
          git config user.name "SOLRAK Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add solrak-reports-v0172.js tests/solrak-reports-v0172-smoke.mjs index.html .github/workflows/solrak-v0172-reports-test.yml
          if git diff --cached --quiet; then
            echo "v0.1.72 ya estaba materializada"
            exit 0
          fi
          git commit -m "feat: restaurar Venta y reportes funcionales v0.1.72 [v0172-bootstrap]"
          git push origin HEAD:release/v0.1.72-venta-reportes

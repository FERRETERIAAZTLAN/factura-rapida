name: Factura Rapida - Release v0.1.42 FIX1 Rebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0142.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.42"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_PRODUCTION_HEALTH_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-production-health?business=AZTLAN"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight version nueva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){throw "$tag ya existe como tag"}
          $global:LASTEXITCODE=0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Auditar backend productivo sin emitir CFDI
        shell: pwsh
        run: |
          node tests/production-live-smoke.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Recuperar exactamente la ultima base FIX1 confirmada
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          if($LASTEXITCODE -ne 0){throw 'No se pudo recuperar FIX1 historico'}
          if((Get-Item FIX1.zip).Length -lt 10000){throw 'FIX1.zip incompleto'}
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "FIX1_SHA256=$sha"
          Expand-Archive FIX1.zip . -Force
          if(-not(Test-Path desktop)){throw 'FIX1 no contiene desktop'}
          node scripts/rebase-fix1-native-v0142.mjs desktop
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Instalar dependencias del FIX1 rebasado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location desktop
          npm install --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location
          npm install --no-save --no-audit --no-fund jsdom@25
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Push-Location desktop/src-tauri
          cargo generate-lockfile
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location

      - name: Establecer version 0.1.42
        working-directory: desktop
        shell: pwsh
        run: |
          node scripts/set-version.mjs "$env:FR_VERSION"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Descargar UI productiva actual y fusionarla sobre FIX1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'}
          $h=Get-Content production-source.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-webview-debug="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"','data-fr-usage-ui="1"','data-fr-business-mail-ui="1"','data-fr-issue-delivery="2"')){if(-not $h.Contains($m)){throw "Fuente productiva incompleta: $m"}}
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location

      - name: Sanear solo arranque WebView2 preservando flujo productivo
        shell: pwsh
        run: |
          node scripts/sanitize-production-ui-v0142.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Empaquetar XLSX local con defer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $dest='desktop/dist/vendor/xlsx.full.min.js'
          Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile $dest -UseBasicParsing
          if((Get-Item $dest).Length -lt 500000){throw 'XLSX incompleto'}
          node scripts/vendor-windows-xlsx-defer-v0142.mjs desktop/dist/index.html $dest
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Pruebas estaticas estrictas FIX1 rebase
        shell: pwsh
        run: |
          node tests/windows-xlsx-defer-v0142.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/windows-fix1-rebase-v0142.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json desktop/src-tauri/src/main.rs desktop/scripts/sync-web.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Auditoria productiva del HTML exacto a empaquetar
        shell: pwsh
        env:
          FR_LOCAL_UI_PATH: desktop/dist/index.html
        run: |
          node tests/production-live-smoke.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Configurar firma y updater sin alterar perfil FIX1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){throw 'Version Tauri incorrecta'}
          if($t.app.withGlobalTauri -ne $true){throw 'window.__TAURI__ deshabilitado'}
          $w=$t.app.windows | Where-Object {$_.label -eq 'main'} | Select-Object -First 1
          if(-not $w){throw 'Ventana main ausente'}
          if($null -ne $w.dataDirectory -or $null -ne $w.incognito){throw 'El perfil FIX1 fue alterado'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar Windows
        working-directory: desktop
        shell: pwsh
        env:
          FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Probar EXE real - carga completa, DOM, hit-test y foco
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 75;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE se cerro antes de aceptar login: $txt"}
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started') -and $txt.Contains('PAGE_LOAD Finished')
                $parser=$txt.Contains('WEBVIEW_MILESTONE HEAD_SCRIPT_STARTED') -and $txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('"ok":true') -and $txt.Contains('"hitOk":true') -and $txt.Contains('"focusOk":true')
                if($base -and $parser -and $ready){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE real no paso aceptacion v0.1.42: $txt"}
            Start-Sleep -Seconds 5
            if($p.HasExited){throw 'EXE se cerro despues de alcanzar LOGIN_UI_READY'}
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}
          Write-Host 'WINDOWS REAL STARTUP ACCEPTANCE V0.1.42 OK'

      - name: Preparar assets y hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}
          $sig="$($exe.FullName).sig"; if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe"
          Copy-Item $exe.FullName "release-files/$name" -Force
          Copy-Item $sig "release-files/$name.sig" -Force
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$((Get-FileHash "release-files/$name" -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$((Get-FileHash "release-files/$name.sig" -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generar latest.json
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $sig=(Get-Content "release-files/$env:FR_ASSET_EXE.sig" -Raw).Trim()
          $url="https://github.com/$repo/releases/download/$tag/$env:FR_ASSET_EXE"
          $j=[ordered]@{version=$env:FR_VERSION;notes='Rebase desde FIX1 confirmado; UI productiva actual; XLSX local con defer; arranque WebView2 validado en EXE real. No se emitio CFDI en pruebas.';pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$sig;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          "FR_LATEST_SHA256=$((Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Crear borrador y verificar assets antes de publicarlo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target $env:GITHUB_SHA --title "Factura Rapida $tag" --notes 'v0.1.42 reconstruida desde FIX1 confirmado, conservando flujo fiscal productivo. XLSX queda local+defer. EXE real paso PAGE_LOAD Finished, DOMContentLoaded, hit-test y foco. No se emitio CFDI.' --draft
          $r=$null
          for($i=1;$i -le 20;$i++){
            $r=(gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json | Where-Object {$_.tag_name -eq $tag -and $_.draft} | Select-Object -First 1)
            if($r -and $r.assets.Count -ge 3){break}
            Start-Sleep -Seconds 2
          }
          if(-not $r){throw 'No se encontro borrador v0.1.42'}
          $expected=@{$env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256";"$env:FR_ASSET_EXE.sig"="sha256:$env:FR_SIG_SHA256";'latest.json'="sha256:$env:FR_LATEST_SHA256"}
          foreach($n in $expected.Keys){
            $a=$r.assets|Where-Object{$_.name -eq $n}|Select-Object -First 1
            if(-not $a){throw "Falta asset remoto $n"}
            $digest=[string]$a.digest
            if([string]::IsNullOrWhiteSpace($digest)){throw "GitHub aun no calculo digest de $n"}
            if($digest -ne $expected[$n]){throw "Hash remoto incorrecto $n esperado=$($expected[$n]) actual=$digest"}
          }
          gh api --method PATCH "/repos/$repo/releases/$($r.id)" -f draft=false -f prerelease=false -f make_latest=true | Out-Null

      - name: Verificacion publica final independiente
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $base="https://github.com/$repo/releases/download/$tag"
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if([string]$latest.tag_name -ne $tag -or $latest.draft -or $latest.prerelease){throw 'Release no estable/latest'}
          New-Item -ItemType Directory -Force public-check | Out-Null
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE" -OutFile "public-check/$env:FR_ASSET_EXE" -UseBasicParsing
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE.sig" -OutFile "public-check/$env:FR_ASSET_EXE.sig" -UseBasicParsing
          Invoke-WebRequest "$base/latest.json" -OutFile public-check/latest.json -UseBasicParsing
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_EXE_SHA256){throw 'EXE publico hash incorrecto'}
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE.sig" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_SIG_SHA256){throw 'SIG publico hash incorrecto'}
          if((Get-FileHash public-check/latest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_LATEST_SHA256){throw 'latest.json publico hash incorrecto'}
          $manifest=Get-Content public-check/latest.json -Raw | ConvertFrom-Json
          if([string]$manifest.version -ne $env:FR_VERSION){throw 'latest.json version incorrecta'}
          if(-not([string]$manifest.platforms.'windows-x86_64'.url).Contains("/releases/download/$tag/")){throw 'latest.json URL incorrecta'}
          Write-Host "PUBLIC_RELEASE_OK $tag EXE=$env:FR_EXE_SHA256 SIG=$env:FR_SIG_SHA256 LATEST=$env:FR_LATEST_SHA256"

      - name: Limpiar borrador o tag si cualquier paso posterior falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach($r in ($rels | Where-Object {$_.tag_name -eq $tag -and $_.draft})){gh api --method DELETE "/repos/$repo/releases/$($r.id)" | Out-Null}
          $ref=gh api "/repos/$repo/git/ref/tags/$tag" 2>$null | ConvertFrom-Json
          if($LASTEXITCODE -eq 0 -and $ref){gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" | Out-Null}
          $global:LASTEXITCODE=0

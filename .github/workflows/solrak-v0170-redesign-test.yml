name: SOLRAK v0.1.70 Redesign Safe Test

on:
  push:
    branches: [feature/v0.1.70-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de prueba
        run: npm install --no-save --no-audit --no-fund jsdom@25

      - name: Validar rediseño y regresiones productivas
        run: |
          set -euo pipefail
          node --check solrak-redesign-v0170.js
          node --check tests/solrak-redesign-v0170-smoke.mjs
          node tests/solrak-redesign-v0170-smoke.mjs
          node tests/solrak-sumapro-tickets-v0169-smoke.mjs
          node tests/pos-module-smoke.mjs
          node tests/solrak-simple-ui-v0168-smoke.mjs
          node tests/solrak-pos-clear-footer-v0167-smoke.mjs
          node tests/solrak-professional-pos-v0166-smoke.mjs
          node tests/solrak-pos-workspace-v0165-smoke.mjs
          node tests/pos-suma-v0163-smoke.mjs
          node tests/solrak-v0164-cash-report-contract.mjs
          node tests/solrak-desktop-v0163-smoke.mjs
          node tests/solrak-desktop-v0162-smoke.mjs
          node tests/quote-email-ui-smoke.mjs

      - name: Confirmar aislamiento visual
        run: |
          set -euo pipefail
          grep -q -- '--solrak-simple-accent:#e97618!important' solrak-redesign-v0170.js
          grep -q -- '--solrak-pos-blue:#e97618!important' solrak-redesign-v0170.js
          grep -q 'position:sticky!important' solrak-redesign-v0170.js
          grep -q 'Facturación' solrak-redesign-v0170.js
          grep -q 'resetNavigationScroll' solrak-redesign-v0170.js
          grep -q 'solrak-redesign-v0170.js?v=1' index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const code=fs.readFileSync('solrak-redesign-v0170.js','utf8')
            .replace(/\/\*[\s\S]*?\*\//g,'')
            .replace(/^\s*\/\/.*$/gm,'');
          if(/fetch\s*\(|XMLHttpRequest|completeSale|cfdi-api|finkok|supabase/i.test(code))
            throw new Error('La capa v0.1.70 invadió red o lógica productiva');
          NODE

      - name: Simular paquete Windows
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          cp index.html "$package_dir/index.html"
          for file in quotes-module.js quotes-email-module.js product-images-module.js pos-module.js solrak-desktop-v0162.js solrak-logo-v0162.js solrak-desktop-v0163.js solrak-sales-report-v0163.js solrak-pos-workspace-v0165.js solrak-professional-pos-v0166.js solrak-pos-clear-footer-v0167.js solrak-simple-ui-v0168.js solrak-sumapro-tickets-v0169.js solrak-redesign-v0170.js; do
            cp "$file" "$package_dir/$file"
            node --check "$package_dir/$file"
          done
          PACKAGE_DIR="$package_dir" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file=process.env.PACKAGE_DIR+'/index.html';
          let html=fs.readFileSync(file,'utf8');
          const prior='<script src="solrak-sumapro-tickets-v0169.js?v=1"></script>';
          const redesign='<script src="solrak-redesign-v0170.js?v=1"></script>';
          html=html.replace(redesign,'');
          if(!html.includes(prior))html=html.replace('</body>',prior+'\n</body>');
          html=html.replace('</body>',redesign+'\n</body>');
          fs.writeFileSync(file,html);
          if(html.indexOf(prior)>html.indexOf(redesign))throw new Error('v0.1.70 debe cargar después de v0.1.69');
          NODE
          test "$(grep -o 'solrak-redesign-v0170.js?v=1' "$package_dir/index.html" | wc -l)" -eq 1
          test "$(grep -o 'solrak-sumapro-tickets-v0169.js?v=1' "$package_dir/index.html" | wc -l)" -eq 1
          printf '%s\n' 'SOLRAK_V0170_WINDOWS_PACKAGE_SIMULATION_OK'

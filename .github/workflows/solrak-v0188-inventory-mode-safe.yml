name: SOLRAK v0.1.88 Modo sin inventario safe

on:
  push:
    branches:
      - feature/v0.1.88-modo-sin-inventario
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.1.88-modo-sin-inventario
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencia de pruebas
        run: npm install --no-save jsdom@26.1.0
      - name: Smoke v0.1.88 Modo sin inventario
        run: node tests/solrak-inventory-mode-v0188-smoke.mjs
      - name: Regresiones recientes
        run: |
          node tests/solrak-categorias-v0187-smoke.mjs
          node tests/solrak-formularios-v0186-smoke.mjs
          node tests/solrak-caja-cortes-v0185-smoke.mjs
          node tests/solrak-ui-hardening-v0184-smoke.mjs
          node tests/solrak-ui-operativa-v0183-smoke.mjs
          node tests/solrak-credit-accounts-v0182-smoke.mjs
          node tests/solrak-clients-credit-v0181-smoke.mjs
          node tests/solrak-product-lifecycle-v0180-smoke.mjs
          node tests/solrak-permissions-v0179-smoke.mjs
          node tests/solrak-price-verifier-v0177-smoke.mjs
          node tests/solrak-held-tickets-v0176-smoke.mjs
          node tests/solrak-inventory-v0175-smoke.mjs
          node tests/solrak-sales-v0174-smoke.mjs
          node tests/solrak-flow-v0173-smoke.mjs
          node tests/solrak-reports-v0172-smoke.mjs
          node tests/solrak-sumapro-fiel-v0171-smoke.mjs
          node tests/pos-module-smoke.mjs
      - name: Guardas de alcance
        run: |
          grep -q 'inventory_tracking_enabled boolean not null default true' supabase/migrations/202609020008_inventory_tracking_mode.sql
          grep -q 'inventory_applied boolean not null default true' supabase/migrations/202609020008_inventory_tracking_mode.sql
          grep -q 'Producto Común requiere nombre' supabase/migrations/202609020008_inventory_tracking_mode.sql
          grep -q 'const VERSION="0.1.88"' solrak-inventory-mode-v0188.js
          grep -q 'historicalLineFlag:true' supabase/functions/inventory-mode-api/index.ts
          ! grep -Eqi 'cfdi-api|finkok' solrak-inventory-mode-v0188.js supabase/functions/inventory-mode-api/index.ts
      - name: Integrar módulo v0.1.88 en index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tag='<script src="solrak-inventory-mode-v0188.js"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('index.html no contiene </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          grep -q '<script src="solrak-inventory-mode-v0188.js"></script>' index.html
      - name: Persistir integración en la rama
        run: |
          if git diff --quiet -- index.html; then echo 'Integración ya presente.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: integrar modo sin inventario v0.1.88 en index'
          git push origin HEAD:feature/v0.1.88-modo-sin-inventario
name: Factura Rapida - Publicar actualizacion segura V5

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FR_VERSION: "0.1.8"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui"

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar que la version no exista
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "v$env:FR_VERSION"
          $releases = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" `
            -Headers $headers
          $existing = $releases | Where-Object { $_.tag_name -eq $tag }
          if ($existing) { throw "Ya existe una release con tag $tag. No se sobrescribira." }

      - name: Preparar Factura Rapida Desktop
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File -Filter "Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip" | Select-Object -First 1
          if (-not $zip) { throw "No se encontro Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip" }
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force
          if (-not (Test-Path "desktop")) { throw "El ZIP base no creo la carpeta desktop." }

      - name: Descargar interfaz PRODUCCION limpia
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile "index.html" -UseBasicParsing
          $html = Get-Content "index.html" -Raw

          if ($html -notmatch 'data-fr-production-clean="1"') {
            throw "Falta el marcador obligatorio de PRODUCCION limpia."
          }
          if ($html -notmatch 'Finkok · PRODUCCI') {
            throw "La interfaz no contiene Finkok PRODUCCION."
          }
          if ($html -notmatch '>FACTURAR<') {
            throw "La interfaz no contiene el boton FACTURAR."
          }

          $forbidden = @(
            'id="pacForm"',
            'id="sandboxCsdForm"',
            'id="finkokSmokeBtn"',
            'id="finkokCancelBtn"',
            'id="finkokCancelCheckBtn"',
            '>Finkok · DEMO<',
            'Producción está bloqueada.',
            'Timbrar CFDI · Falta conectar PAC'
          )
          foreach ($bad in $forbidden) {
            if ($html.Contains($bad)) {
              throw "Se encontro contenido prohibido de DEMO: $bad"
            }
          }

          Write-Host "Interfaz productiva limpia validada antes de compilar."

      - name: Validar configuracion de firma
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Falta TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "Falta TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)) { throw "Falta TAURI_UPDATER_PUBKEY" }

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias JavaScript
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Agregar dependencia serde_json
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          cargo add serde_json@1
          if (-not (Select-String -Path "Cargo.toml" -Pattern "serde_json" -Quiet)) { throw "serde_json no quedo agregado a Cargo.toml" }

      - name: Establecer version 0.1.8
        working-directory: desktop
        run: node scripts/set-version.mjs "${{ env.FR_VERSION }}"

      - name: Sincronizar pagina web
        working-directory: desktop
        run: npm run sync-web

      - name: Verificar exactamente lo que Tauri va a empaquetar
        shell: pwsh
        run: |
          $path = "desktop/dist/index.html"
          if (-not (Test-Path $path)) { throw "No existe desktop/dist/index.html" }
          $html = Get-Content $path -Raw

          if ($html -notmatch 'data-fr-production-clean="1"') { throw "El HTML final perdio el marcador de PRODUCCION limpia." }
          if ($html -notmatch '>FACTURAR<') { throw "El HTML final no contiene FACTURAR." }

          $forbidden = @(
            'id="pacForm"',
            'id="sandboxCsdForm"',
            'id="finkokSmokeBtn"',
            'id="finkokCancelBtn"',
            'id="finkokCancelCheckBtn"',
            '>Finkok · DEMO<',
            'Producción está bloqueada.',
            'Timbrar CFDI · Falta conectar PAC'
          )
          foreach ($bad in $forbidden) {
            if ($html.Contains($bad)) { throw "El HTML final contiene contenido prohibido: $bad" }
          }

          $tauriPath = "desktop/src-tauri/tauri.conf.json"
          if (-not (Test-Path $tauriPath)) { throw "No existe desktop/src-tauri/tauri.conf.json" }

          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $frontendDist = [string]$tauri.build.frontendDist

          if ([string]::IsNullOrWhiteSpace($frontendDist)) {
            throw "tauri.conf.json no define build.frontendDist; se cancela."
          }

          $normalizedFrontendDist = $frontendDist.Replace("\\", "/").TrimEnd("/")
          if ($normalizedFrontendDist -ne "../dist") {
            throw "Tauri apunta a '$frontendDist' y no a ../dist; se cancela para evitar empaquetar otra interfaz."
          }

          Write-Host "desktop/dist/index.html es PRODUCCION limpia, contiene FACTURAR y Tauri build.frontendDist apunta a ../dist."

      - name: Generar configuracion del actualizador
        shell: pwsh
        run: |
          $config = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{
              pubkey = $env:FR_UPDATER_PUBKEY
              endpoints = @("https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json")
            }}
          }
          $json = $config | ConvertTo-Json -Depth 10
          Set-Content -Path "desktop/src-tauri/tauri.release.conf.json" -Value $json -Encoding UTF8

      - name: Compilar y firmar en Release BORRADOR
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        with:
          projectPath: desktop
          tagName: "v__VERSION__"
          releaseName: "Factura Rapida v__VERSION__"
          releaseBody: "Produccion limpia: Finkok PRODUCCION, boton FACTURAR y eliminacion fisica de controles DEMO."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: "--config src-tauri/tauri.release.conf.json --bundles nsis"

      - name: Verificar assets y latest.json del borrador
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "v$env:FR_VERSION"

          $releases = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" `
            -Headers $headers
          $release = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $release) { throw "No se encontro el Release borrador $tag." }
          if ($release.draft -ne $true) { throw "La release no esta en borrador; se cancela." }

          $exe = $release.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          $sig = $release.assets | Where-Object { $_.name -match '\.exe\.sig$' } | Select-Object -First 1
          $latest = $release.assets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1

          if (-not $exe) { throw "Falta el instalador .exe." }
          if (-not $sig) { throw "Falta la firma .exe.sig." }
          if (-not $latest) { throw "Falta latest.json." }

          Invoke-WebRequest -Uri $latest.browser_download_url -OutFile "latest.verify.json" -Headers $headers -UseBasicParsing
          $j = Get-Content "latest.verify.json" -Raw | ConvertFrom-Json
          if ([string]$j.version -ne $env:FR_VERSION) { throw "latest.json anuncia $($j.version), no $env:FR_VERSION." }

          $raw = Get-Content "latest.verify.json" -Raw
          if ($raw -notmatch '\.exe') { throw "latest.json no apunta a un instalador .exe." }
          if ($raw -notmatch '"signature"') { throw "latest.json no contiene firma del actualizador." }

          "RELEASE_ID=$($release.id)" >> $env:GITHUB_ENV
          Write-Host "Release borrador y actualizador validados correctamente."

      - name: Publicar SOLO despues de todas las verificaciones
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_ID)) { throw "No hay RELEASE_ID validado." }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{ draft = $false } | ConvertTo-Json

          $published = Invoke-RestMethod `
            -Method Patch `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body

          if ($published.draft -ne $false) { throw "GitHub no publico la release." }
          if ($published.tag_name -ne "v$env:FR_VERSION") { throw "Se publico un tag inesperado: $($published.tag_name)" }

          Write-Host "Factura Rapida v$env:FR_VERSION publicada despues de todas las verificaciones."


            plugins = @{ updater = @{
              pubkey = $env:FR_UPDATER_PUBKEY
              endpoints = @("https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json")
            }}
          }
          $json = $config | ConvertTo-Json -Depth 10
          Set-Content -Path "desktop/src-tauri/tauri.release.conf.json" -Value $json -Encoding UTF8

      - name: Compilar y firmar en Release BORRADOR
        if: env.RESUME_DRAFT != 'true'
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        with:
          projectPath: desktop
          tagName: "v__VERSION__"
          releaseName: "Factura Rapida v__VERSION__"
          releaseBody: "Produccion limpia: Finkok PRODUCCION, boton FACTURAR y eliminacion fisica de controles DEMO."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: "--config src-tauri/tauri.release.conf.json --bundles nsis"

      - name: Verificar assets y latest.json del borrador
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "v$env:FR_VERSION"

          $releases = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" `
            -Headers $headers
          $release = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $release) { throw "No se encontro el Release borrador $tag." }
          if ($release.draft -ne $true) { throw "La release no esta en borrador; se cancela." }

          $exe = $release.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          $sig = $release.assets | Where-Object { $_.name -match '\.exe\.sig$' } | Select-Object -First 1
          $latest = $release.assets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1

          if (-not $exe) { throw "Falta el instalador .exe." }
          if (-not $sig) { throw "Falta la firma .exe.sig." }
          if (-not $latest) { throw "Falta latest.json." }

          $assetHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/octet-stream"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          Invoke-WebRequest -Uri $latest.url -OutFile "latest.verify.json" -Headers $assetHeaders -UseBasicParsing
          $raw = Get-Content "latest.verify.json" -Raw
          $j = $raw | ConvertFrom-Json

          if ([string]$j.version -ne $env:FR_VERSION) {
            throw "latest.json anuncia $($j.version), no $env:FR_VERSION."
          }
          if ($raw -notmatch '\.exe') {
            throw "latest.json no apunta a un instalador .exe."
          }
          if ($raw -notmatch '"signature"') {
            throw "latest.json no contiene firma del actualizador."
          }

          $expectedTagPath = "/releases/download/v$env:FR_VERSION/"
          if ($raw -notmatch [regex]::Escape($expectedTagPath)) {
            throw "latest.json no apunta al tag v$env:FR_VERSION."
          }

          "RELEASE_ID=$($release.id)" >> $env:GITHUB_ENV
          Write-Host "Release borrador, instalador, firma y latest.json validados correctamente."

      - name: Publicar SOLO despues de todas las verificaciones
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_ID)) { throw "No hay RELEASE_ID validado." }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{ draft = $false } | ConvertTo-Json

          $published = Invoke-RestMethod `
            -Method Patch `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body

          if ($published.draft -ne $false) { throw "GitHub no publico la release." }
          if ($published.tag_name -ne "v$env:FR_VERSION") { throw "Se publico un tag inesperado: $($published.tag_name)" }

          Write-Host "Factura Rapida v$env:FR_VERSION publicada despues de todas las verificaciones."

name: SOLRAK v0.1.92 UX operational audit

on:
  push:
    branches:
      - feature/v0.1.92-ux-operational-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  ux-audit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom@26.1.0
      - name: Aplicar parche reproducible v0.1.92
        shell: bash
        run: |
          # En una rama ya materializada este paso debe ser un no-op; la suite valida los archivos persistidos.
          if grep -q 'solrak-ux-hardening-v0192.js' index.html; then
            echo 'SOLRAK_APPLY_UX_V0192_ALREADY_APPLIED'
          else
            node scripts/apply-ux-v0192.mjs
            node scripts/apply-ux-v0192-extra.mjs
          fi
      - name: Auditoría UX operativa
        run: node tests/solrak-ux-operational-audit-v0192.mjs
      - name: Smoke v0.1.92
        run: node tests/solrak-ux-hardening-v0192-smoke.mjs
      - name: Regresiones UX y POS
        run: |
          node tests/solrak-ux-core-v0190-smoke.mjs
          node tests/solrak-peripherals-v0191-smoke.mjs
          node tests/solrak-shifts-v0189-smoke.mjs
          node tests/solrak-inventory-mode-v0188-smoke.mjs
          node tests/solrak-categorias-v0187-smoke.mjs
          node tests/solrak-caja-cortes-v0185-smoke.mjs
          node tests/solrak-credit-accounts-v0182-smoke.mjs
          node tests/solrak-held-tickets-v0176-smoke.mjs
          node tests/pos-module-smoke.mjs
      - name: Persistir parche validado
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No hay cambios por persistir.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pos-module.js quotes-email-module.js quotes-module.js solrak-flow-v0173.js solrak-held-tickets-v0176.js solrak-price-verifier-v0177.js solrak-reports-v0172.js solrak-sales-v0174.js solrak-shifts-v0189.js solrak-sumapro-fiel-v0171.js solrak-caja-cortes-v0185.js solrak-categorias-v0187.js solrak-clients-credit-v0181.js solrak-credit-accounts-v0182.js solrak-inventory-mode-v0188.js solrak-inventory-v0175.js solrak-permissions-v0179.js solrak-product-lifecycle-v0180.js solrak-ui-hardening-v0184.js solrak-ui-operativa-v0183.js
          git commit -m 'SOLRAK v0.1.92: endurecer UX operativa'
          git push origin HEAD:feature/v0.1.92-ux-operational-audit

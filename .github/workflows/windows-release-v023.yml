name: SOLRAK - Facturacion real estable v0.2.3

on:
  push:
    branches: [fix/real-billing-v023]
    paths:
      - '.github/workflows/windows-release-v023.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FR_VERSION: "0.2.3"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar version nueva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){throw "$tag ya existe como tag"}
          $global:LASTEXITCODE=0
          Write-Host "VERSION_NUEVA_OK $tag"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconstruir Desktop estable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip' | Select-Object -First 1
          if(-not $zip){throw 'No se encontro ZIP base estable'}
          Expand-Archive $zip.FullName . -Force
          if(-not(Test-Path desktop)){throw 'No se creo desktop'}
          Push-Location desktop
          npm install --no-audit --no-fund
          if(-not(Select-String -Path src-tauri/Cargo.toml -Pattern serde_json -Quiet)){Push-Location src-tauri;cargo add serde_json@1;Pop-Location}
          node scripts/set-version.mjs "$env:FR_VERSION"
          Pop-Location
          $cfgPath='desktop/src-tauri/tauri.conf.json'
          $cfg=Get-Content $cfgPath -Raw | ConvertFrom-Json
          $cfg.productName='SOLRAK'
          $cfg.identifier='com.facturarapida.desktop'
          $cfg | ConvertTo-Json -Depth 30 | Set-Content $cfgPath -Encoding UTF8
          Write-Host 'DESKTOP_ESTABLE_RECONSTRUIDO'

      - name: Recuperar UI productiva de la version que facturo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ok=$false
          for($i=1;$i -le 6;$i++){
            try{
              Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile index.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'} -TimeoutSec 30
              if((Get-Item index.html).Length -gt 10000){$ok=$true;break}
            }catch{Write-Host "Descarga UI intento $i fallo: $($_.Exception.Message)"}
            Start-Sleep -Seconds ([Math]::Min(2*$i,10))
          }
          if(-not $ok){throw 'No se pudo obtener la UI real de facturacion'}
          $h=Get-Content index.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"',"api('saveDraft',{draft:payload})", "cfdiApi('preflight',{draftId:d.id})", "readiness('ensure')", "issueApi('timber',{draftId:d.id})",'cfdi-issue-api','FACTURAR')){if(-not $h.Contains($m)){throw "Falta flujo real: $m"}}
          foreach($m in @('Timbrar CFDI · Falta conectar PAC','>Finkok · DEMO<','id="sandboxCsdForm"','id="pacForm"','demo-facturacion',"cfdiApi('timber',{draftId:d.id})")){if($h.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "Contenido no productivo visible o ruta legacy: $m"}}
          Write-Host 'UI_FACTURACION_REAL_V15_VALIDADA'

      - name: Empaquetar y validar UI real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location desktop
          npm run sync-web
          Pop-Location
          if(-not(Test-Path desktop/dist/index.html)){throw 'No se genero desktop/dist/index.html'}
          $h=Get-Content desktop/dist/index.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"',"readiness('ensure')", "issueApi('timber',{draftId:d.id})",'cfdi-issue-api','FACTURAR')){if(-not $h.Contains($m)){throw "El paquete perdio flujo real: $m"}}
          foreach($m in @('Timbrar CFDI · Falta conectar PAC','>Finkok · DEMO<','id="sandboxCsdForm"','id="pacForm"',"cfdiApi('timber',{draftId:d.id})")){if($h.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "El paquete conserva control no productivo o ruta legacy: $m"}}
          @'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('desktop/dist/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked=0;
          for(let i=0;i<scripts.length;i++){
            const src=(scripts[i][1].match(/\bsrc=["']([^"']+)/i)||[])[1];
            if(src) continue;
            new vm.Script(scripts[i][2],{filename:`inline-${i+1}.js`});checked++;
          }
          if(!checked)throw Error('No se validaron scripts inline');
          console.log(`FACTURACION_REAL_INLINE_JS_OK checked=${checked}`);
          '@ | Set-Content validate-real-ui.mjs -Encoding utf8
          node validate-real-ui.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Write-Host 'PAQUETE_FACTURACION_REAL_OK'

      - name: Configurar updater firmado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)){throw 'Falta signing key password'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar EXE real
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Probar apertura del EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='desktop/src-tauri/target/release/factura-rapida.exe'
          if(-not(Test-Path $exe)){$exe=(Get-ChildItem desktop/src-tauri/target/release -File -Filter '*.exe' | Where-Object {$_.Name -notmatch 'setup'} | Sort-Object Length -Descending | Select-Object -First 1).FullName}
          if(-not $exe -or -not(Test-Path $exe)){throw 'No se encontro EXE ejecutable'}
          $p=Start-Process -FilePath (Resolve-Path $exe).Path -PassThru
          try{Start-Sleep -Seconds 20;if($p.HasExited){throw "El EXE se cerro. ExitCode=$($p.ExitCode)"};Write-Host "EXE_ABIERTO_OK pid=$($p.Id)"}finally{if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}

      - name: Preparar assets firmados
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}
          $sig="$($exe.FullName).sig";if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="SOLRAK_$env:FR_VERSION`_x64-setup.exe"
          Copy-Item $exe.FullName "release-files/$name" -Force
          Copy-Item $sig "release-files/$name.sig" -Force
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $signature=(Get-Content "release-files/$name.sig" -Raw).Trim()
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION";$url="https://github.com/$repo/releases/download/$tag/$name"
          $notes='SOLRAK v0.2.3: restaura la UI productiva v15 usada por Factura Rapida v0.1.25 y su flujo real de Finkok PRODUCCION. No agrega los modulos POS/redisenos posteriores y no modifica inventario ni precios.'
          $j=[ordered]@{version=$env:FR_VERSION;notes=$notes;pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8

      - name: Respaldar instalador
        uses: actions/upload-artifact@v4
        with:
          name: SOLRAK-v0.2.3-real-billing-windows-signed
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar v0.2.3 como Latest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target '${{ github.sha }}' --title "SOLRAK $tag" --notes 'v0.2.3 estable: restaurada la interfaz productiva usada por la version que facturo en Finkok PRODUCCION. EXE probado y updater firmado.'
          gh release edit $tag --repo $repo --latest

      - name: Verificacion publica final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $r=gh api "/repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if($r.draft -or $r.prerelease -or [string]$r.tag_name -ne $tag){throw 'Release invalida'}
          if([string]$latest.tag_name -ne $tag){throw 'v0.2.3 no es Latest'}
          foreach($n in @($env:FR_ASSET_EXE,"$env:FR_ASSET_EXE.sig",'latest.json')){if(-not($r.assets|Where-Object {$_.name -eq $n})){throw "Falta asset $n"}}
          $j=Invoke-RestMethod "https://github.com/$repo/releases/latest/download/latest.json" -TimeoutSec 30
          if([string]$j.version -ne $env:FR_VERSION){throw 'latest.json incorrecto'}
          Write-Host 'PUBLIC_RELEASE_OK v0.2.3 FACTURACION_REAL'

      - name: Limpiar release si falla
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          gh api "/repos/$repo/releases/tags/$tag" *> release-cleanup.json
          if($LASTEXITCODE -eq 0){$r=Get-Content release-cleanup.json -Raw | ConvertFrom-Json;gh api --method DELETE "/repos/$repo/releases/$($r.id)" *> $null}
          $global:LASTEXITCODE=0

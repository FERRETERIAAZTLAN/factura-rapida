name: Factura Rapida - Release v0.1.57 Product Images Stable

on:
  push:
    branches: [release/v0.1.57-product-images]
    paths:
      - '.github/workflows/windows-release-v0157.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.57"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"
  FR_QUOTE_EMAIL_API: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/quote-delivery-api"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Preflight
        shell: pwsh
        run: |
          $rels=gh api "/repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq 'v0.1.57'}){throw 'v0.1.57 ya existe'}
          node --check product-images-module.js
          node --check quotes-module.js
          node --check quotes-email-module.js
          node tests/product-images-ui-smoke.mjs
          node tests/quote-email-ui-smoke.mjs
      - name: Backend productivo read-only
        shell: pwsh
        run: node tests/production-live-smoke.mjs
      - name: Reconstruir FIX1
        shell: pwsh
        run: |
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134'){throw "FIX1 hash inesperado $sha"}
          Expand-Archive FIX1.zip . -Force
          node scripts/rebase-fix1-native-v0142.mjs desktop
          node scripts/ensure-rust-deps-v0143.mjs desktop/src-tauri/Cargo.toml
          Push-Location desktop; npm install --no-audit --no-fund; node scripts/set-version.mjs "$env:FR_VERSION"; Pop-Location
          npm install --no-save --no-audit --no-fund jsdom@25
      - name: Sincronizar UI y módulos
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -TimeoutSec 30
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop; npm run sync-web; Pop-Location
          node scripts/sanitize-production-ui-v0142.mjs desktop/dist/index.html
          node scripts/clean-webview-startup-v0148.mjs desktop/dist/index.html
          node scripts/fix-facturar-mutation-v0148.mjs desktop/dist/index.html
          Copy-Item quotes-module.js desktop/dist/quotes-module.js -Force
          Copy-Item quotes-email-module.js desktop/dist/quotes-email-module.js -Force
          Copy-Item product-images-module.js desktop/dist/product-images-module.js -Force
          $p='desktop/dist/index.html'; $h=Get-Content $p -Raw
          foreach($tag in @('<script src="quotes-module.js?v=1"></script>','<script src="quotes-email-module.js?v=1"></script>','<script src="product-images-module.js?v=1"></script>')){if(-not $h.Contains($tag)){$h=$h.Replace('</body>',"$tag`r`n</body>")}}
          Set-Content $p $h -Encoding UTF8
          foreach($f in @('quotes-module.js','quotes-email-module.js','product-images-module.js')){if(-not(Test-Path "desktop/dist/$f")){throw "Falta $f"}; node --check "desktop/dist/$f"}
          if(-not((Get-Content $p -Raw).Contains('product-images-module.js?v=1'))){throw 'Módulo imágenes no integrado'}
      - name: XLSX y auditorías
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile desktop/dist/vendor/xlsx.full.min.js -UseBasicParsing -TimeoutSec 30
          node scripts/vendor-windows-xlsx-lazy-v0144.mjs desktop/dist/index.html desktop/dist/vendor/xlsx.full.min.js
          node tests/windows-xlsx-lazy-v0144.mjs desktop/dist/index.html
          node tests/windows-facturar-mutation-v0148.mjs desktop/dist/index.html
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html
          $env:FR_LOCAL_UI_PATH='desktop/dist/index.html'; node tests/production-live-smoke.mjs
      - name: Cargo check y updater firmado
        shell: pwsh
        run: |
          Push-Location desktop/src-tauri; cargo generate-lockfile; cargo check --locked; Pop-Location
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8
      - name: Compilar y firmar EXE
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
      - name: Aceptación EXE real
        shell: pwsh
        run: |
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'; Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path; $p=Start-Process -FilePath $exe -PassThru
          try{$ok=$false;for($i=1;$i -le 150;$i++){Start-Sleep 1;if($p.HasExited){throw 'EXE se cerró'};if(Test-Path $log){$t=Get-Content $log -Raw;if($t.Contains('START 0.1.57') -and $t.Contains('SETUP_OK 0.1.57') -and $t.Contains('PAGE_LOAD Finished') -and $t.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED') -and $t.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $t.Contains('"hitOk":true') -and $t.Contains('"focusOk":true')){$ok=$true;break}}};if(-not $ok){throw 'EXE no pasó aceptación'};Start-Sleep 25;if($p.HasExited){throw 'EXE no permaneció abierto'}}finally{if(-not $p.HasExited){Stop-Process $p.Id -Force}}
      - name: Preparar y publicar Latest
        shell: pwsh
        run: |
          $nsis='desktop/src-tauri/target/release/bundle/nsis';$exe=Get-ChildItem $nsis -File -Filter '*.exe'|Select-Object -First 1;if(-not $exe){throw 'No EXE'};$sig="$($exe.FullName).sig";if(-not(Test-Path $sig)){throw 'No firma'}
          New-Item -ItemType Directory -Force release-files|Out-Null;$name='Factura.Rapida_0.1.57_x64-setup.exe';Copy-Item $exe.FullName "release-files/$name";Copy-Item $sig "release-files/$name.sig"
          $signature=(Get-Content "release-files/$name.sig" -Raw).Trim();$url="https://github.com/${{ github.repository }}/releases/download/v0.1.57/$name"
          $j=[ordered]@{version='0.1.57';notes='Imágenes de productos integradas en inventario, búsqueda, carrito y cotizaciones. Incluye Cotizaciones por correo de v0.1.56.';pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}};$j|ConvertTo-Json -Depth 8|Set-Content release-files/latest.json -Encoding UTF8
          gh release create v0.1.57 "release-files/$name" "release-files/$name.sig" release-files/latest.json --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Factura Rapida v0.1.57' --notes 'v0.1.57 estable: imágenes de productos integradas. Base FIX1, Cotizaciones y correo preservados; EXE real validado.' --latest
      - name: Verificar publicación pública
        shell: pwsh
        run: |
          $r=gh api '/repos/${{ github.repository }}/releases/latest'|ConvertFrom-Json;if($r.tag_name -ne 'v0.1.57'){throw 'v0.1.57 no es Latest'}
          $j=Invoke-RestMethod 'https://github.com/${{ github.repository }}/releases/latest/download/latest.json' -TimeoutSec 30;if($j.version -ne '0.1.57'){throw 'latest.json incorrecto'}

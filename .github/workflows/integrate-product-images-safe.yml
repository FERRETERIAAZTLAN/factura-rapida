name: Integrate product images safely
on:
  push:
    branches: [feature/truper-product-images]
    paths:
      - '.github/workflows/integrate-product-images-safe.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/truper-product-images
          fetch-depth: 0
      - name: Verify module syntax
        run: node --check product-images-module.js
      - name: Inject only the product image script tag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="product-images-module.js?v=1"></script>'
          if tag not in s:
              needle='<script src="quotes-module.js?v=1"></script>'
              if needle not in s:
                  raise SystemExit('quotes module marker missing')
              s=s.replace(needle, needle+'\n'+tag, 1)
              p.write_text(s)
          PY
          git show origin/main:index.html > /tmp/main-index.html
          python - <<'PY'
          from pathlib import Path
          base=Path('/tmp/main-index.html').read_text()
          actual=Path('index.html').read_text()
          tag='<script src="product-images-module.js?v=1"></script>'
          needle='<script src="quotes-module.js?v=1"></script>'
          expected=base if tag in base else base.replace(needle,needle+'\n'+tag,1)
          if actual!=expected:
              raise SystemExit('index.html differs from main by more than the approved image script tag')
          print('PRODUCT_IMAGE_INDEX_ISOLATION_OK')
          PY
      - name: Commit isolated integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: load product images module'
          git push origin HEAD:feature/truper-product-images

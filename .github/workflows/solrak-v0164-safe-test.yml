name: SOLRAK v0.1.64 Reports and Cash Safe Test

on:
  push:
    branches: [feature/v0.1.64-suma-reports]
  workflow_dispatch:

permissions:
  contents: read

env:
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pruebas POS reportes y corte
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund jsdom@25
          node --check pos-module.js
          node --check solrak-sales-report-v0163.js
          node tests/pos-suma-v0163-smoke.mjs
          node tests/solrak-sales-report-v0163-smoke.mjs
          node tests/solrak-v0164-cash-report-contract.mjs
          if grep -Eiq 'cfdi-api|finkok' pos-module.js solrak-sales-report-v0163.js; then
            echo 'POS/reportes v0.1.64 tocaron CFDI/Finkok' >&2
            exit 1
          fi
          if grep -Eiq '\bfetch\s*\(|XMLHttpRequest' solrak-sales-report-v0163.js; then
            echo 'El reporte intentó consultar endpoints directamente' >&2
            exit 1
          fi

      - name: Reconstruir FIX1 y empaquetar módulos
        shell: bash
        run: |
          set -euo pipefail
          git show "$FR_FIX1_COMMIT:Factura_Rapida_Desktop_Windows_FIX1.zip" > FIX1.zip
          echo '144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134  FIX1.zip' | sha256sum -c -
          unzip -q -o FIX1.zip
          node scripts/rebase-fix1-native-v0142.mjs desktop
          node scripts/ensure-rust-deps-v0143.mjs desktop/src-tauri/Cargo.toml
          cd desktop
          npm install --no-audit --no-fund
          node scripts/set-version.mjs 0.1.64
          cd ..
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$FR_PRODUCTION_UI_URL" -o production-source.html
          test "$(wc -c < production-source.html)" -gt 10000
          export FR_WEB_SOURCE="$PWD/production-source.html"
          cd desktop
          npm run sync-web
          cd ..
          node scripts/sanitize-production-ui-v0142.mjs desktop/dist/index.html
          node scripts/clean-webview-startup-v0148.mjs desktop/dist/index.html
          node scripts/fix-facturar-mutation-v0148.mjs desktop/dist/index.html
          for f in quotes-module.js quotes-email-module.js product-images-module.js pos-module.js solrak-desktop-v0162.js solrak-logo-v0162.js solrak-desktop-v0163.js solrak-sales-report-v0163.js; do
            cp "$f" "desktop/dist/$f"
            node --check "desktop/dist/$f"
          done

      - name: Auditoría de compatibilidad
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('desktop/src-tauri/tauri.conf.json','utf8'));
          if(t.identifier!=='com.facturarapida.desktop')throw new Error('identifier técnico cambió');
          const rust=fs.readFileSync('desktop/src-tauri/src/main.rs','utf8');
          if(!rust.includes('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json'))throw new Error('updater cambió');
          const pos=fs.readFileSync('desktop/dist/pos-module.js','utf8');
          if(!pos.includes("posApi('completeSale'")||!pos.includes('payments:[payment]'))throw new Error('venta atómica o contrato de pagos cambió');
          if(/cfdi-api|finkok/i.test(pos))throw new Error('POS tocó CFDI/Finkok');
          const report=fs.readFileSync('desktop/dist/solrak-sales-report-v0163.js','utf8');
          if(!report.includes("const VERSION='0.1.64'"))throw new Error('reporte no avanzó a v0.1.64');
          if(/cfdi-api|finkok|\bfetch\s*\(/i.test(report))throw new Error('reporte invadió backend/fiscal');
          console.log('SOLRAK_V0164_COMPATIBILITY_OK');
          NODE

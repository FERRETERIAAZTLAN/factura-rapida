# final exact-code pass
name: Truper official image bulk import
on:
  push:
    branches: [feature/truper-product-images]
    paths: ['.github/workflows/truper-image-import-smoke.yml']
permissions:
  contents: read
  id-token: write
jobs:
  bulk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import official Truper images into Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          URL='https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/truper-image-import-api'
          total_selected=0
          total_uploaded=0
          total_failed=0
          completed=0
          for batch in $(seq 1 60); do
            TOKEN_JSON=$(curl -fsSL --retry 3 --retry-all-errors \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=factura-rapida-truper-import")
            OIDC=$(printf '%s' "$TOKEN_JSON" | jq -r '.value')
            test -n "$OIDC" && test "$OIDC" != "null"
            RESP=$(curl -fsSL --retry 3 --retry-all-errors --max-time 150 \
              -X POST "$URL" \
              -H "Authorization: Bearer ${OIDC}" \
              -H 'Content-Type: application/json' \
              --data '{"action":"importBatch","limit":15}')
            ok=$(printf '%s' "$RESP" | jq -r '.ok')
            selected=$(printf '%s' "$RESP" | jq -r '.selected // 0')
            uploaded=$(printf '%s' "$RESP" | jq -r '.uploaded // 0')
            failed=$(printf '%s' "$RESP" | jq -r '.failed // 0')
            test "$ok" = "true"
            echo "batch=$batch selected=$selected uploaded=$uploaded failed=$failed"
            total_selected=$((total_selected + selected))
            total_uploaded=$((total_uploaded + uploaded))
            total_failed=$((total_failed + failed))
            if [ "$selected" -eq 0 ]; then completed=1; break; fi
            sleep 1
          done
          echo "TRUPER_IMPORT_TOTAL selected=$total_selected uploaded=$total_uploaded failed=$total_failed"
          if [ "$completed" -ne 1 ]; then echo 'El importador no agotó la cola dentro del límite seguro.' >&2; exit 1; fi

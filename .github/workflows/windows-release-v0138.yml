name: Factura Rapida - Release v0.1.38 Deferred App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0138.yml'
      - 'scripts/defer-windows-app-scripts-v0138.mjs'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.38"
  FR_WEBVIEW_PROFILE: "webview-profile-v8"
  FR_STORAGE_BOOT_MODE: "isolated-profile"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_PRODUCTION_HEALTH_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-production-health?business=AZTLAN"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight release nuevo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object { $_.tag_name -eq $tag }){ throw "$tag ya existe como release" }
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){ throw "$tag ya existe como tag" }
          $global:LASTEXITCODE=0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Auditoria LIVE de produccion
        shell: pwsh
        run: node tests/production-live-smoke.mjs

      - name: Preparar Desktop base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip' | Select-Object -First 1
          if(-not $zip){throw 'No se encontro ZIP base'}
          Expand-Archive $zip.FullName . -Force
          if(-not(Test-Path desktop)){throw 'No se creo desktop'}

      - name: Preparar WebView2 y puentes nativos
        shell: pwsh
        run: node scripts/prepare-windows-desktop.mjs

      - name: Instalar dependencias
        shell: pwsh
        run: |
          Push-Location desktop
          npm install --no-audit --no-fund
          Pop-Location
          npm install --no-save --no-audit --no-fund jsdom@25
          Push-Location desktop/src-tauri
          if(-not(Select-String -Path Cargo.toml -Pattern 'serde_json' -Quiet)){cargo add serde_json@1}
          Pop-Location

      - name: Establecer version real
        working-directory: desktop
        shell: pwsh
        run: node scripts/set-version.mjs "$env:FR_VERSION"

      - name: Descargar y fusionar UI productiva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'}
          $h=Get-Content production-source.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-webview-debug="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"')){if(-not $h.Contains($m)){throw "Fuente productiva incompleta: $m"}}
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          Pop-Location
          if(-not(Test-Path desktop/dist/index.html)){throw 'sync-web no genero HTML'}

      - name: Preparar arranque aislado y login
        shell: pwsh
        run: |
          node scripts/finalize-windows-html.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node scripts/guard-windows-login-v0135.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node scripts/reorder-windows-login-guard-v0137.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Empaquetar XLSX local
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $dest='desktop/dist/vendor/xlsx.full.min.js'
          Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile $dest -UseBasicParsing
          if((Get-Item $dest).Length -lt 500000){throw 'XLSX local incompleto'}
          node scripts/vendor-windows-static-assets.mjs desktop/dist/index.html $dest
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Diferir scripts productivos hasta DOMContentLoaded
        shell: pwsh
        run: |
          node scripts/defer-windows-app-scripts-v0138.mjs desktop/dist/index.html desktop/dist/vendor/fr-app
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Pruebas estrictas del HTML final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tests/windows-xlsx-nonblocking-v0136.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/windows-login-hit-target-v0135.mjs desktop/dist/index.html desktop/src-tauri/src/main.rs desktop/src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $html=Get-Content desktop/dist/index.html -Raw
          foreach($m in @('id="frStorageMigration"','id="frWindowsLoginHitJs"','id="frDeferredAppLoader"','data-fr-deferred-app="1"','APP_SCRIPTS_LOADED','frNativeBar','frNativeDesktopJs','window.__TAURI__','desktop_info','check_for_updates','install_update')){if(-not $html.Contains($m)){throw "HTML final sin $m"}}
          $bootStart=$html.IndexOf('id="frStorageMigration"');$bootEnd=$html.IndexOf('</script>',$bootStart);$boot=$html.Substring($bootStart,$bootEnd-$bootStart)
          foreach($bad in @('localStorage','sessionStorage','indexedDB','caches.')){if($boot.Contains($bad)){throw "Bootstrap toca $bad"}}

      - name: Auditoria productiva del HTML exacto
        shell: pwsh
        env:
          FR_LOCAL_UI_PATH: desktop/dist/index.html
        run: node tests/production-live-smoke.mjs

      - name: Config Tauri release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $w=$t.app.windows | Where-Object {$_.label -eq 'main'} | Select-Object -First 1
          $w.dataDirectory=$env:FR_WEBVIEW_PROFILE
          $w.incognito=$false
          $t.app.withGlobalTauri=$true
          $t.version=$env:FR_VERSION
          $t | ConvertTo-Json -Depth 30 | Set-Content desktop/src-tauri/tauri.conf.json -Encoding UTF8
          $cargo=Get-Content desktop/src-tauri/Cargo.toml -Raw
          if($cargo -notmatch ('version\s*=\s*"'+[regex]::Escape($env:FR_VERSION)+'"')){throw 'Cargo.toml version incorrecta'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar Windows
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
          if($LASTEXITCODE -ne 0){throw "Tauri build fallo $LASTEXITCODE"}

      - name: Probar EXE real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log';Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 60;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE se cerro. Log: $txt"}
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started')
                $dom=$txt.Contains('WEBVIEW_MILESTONE HEAD_SCRIPT_STARTED') -and $txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('\"ok\":true') -and $txt.Contains('\"hitOk\":true') -and $txt.Contains('\"focusOk\":true')
                $apps=$txt.Contains('WEBVIEW_MILESTONE APP_SCRIPTS_LOADED')
                if($base -and $dom -and $ready -and $apps){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE real no supero aceptacion. Log: $txt"}
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}

      - name: Preparar artefactos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis';$exe=Get-ChildItem $nsis -File -Filter '*.exe'|Select-Object -First 1
          if(-not $exe){throw 'No se genero EXE'}
          $sig="$($exe.FullName).sig";if(-not(Test-Path $sig)){throw 'No se genero sig'}
          New-Item -ItemType Directory -Force release-files|Out-Null
          $safeExe="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe";$safeSig="$safeExe.sig"
          Copy-Item $exe.FullName "release-files/$safeExe" -Force;Copy-Item $sig "release-files/$safeSig" -Force
          $eh=(Get-FileHash "release-files/$safeExe" -Algorithm SHA256).Hash.ToLowerInvariant();$sh=(Get-FileHash "release-files/$safeSig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_ASSET_EXE=$safeExe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_ASSET_SIG=$safeSig"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$eh"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sh"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generar latest.json
        shell: pwsh
        run: |
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION";$signature=(Get-Content "release-files/$env:FR_ASSET_SIG" -Raw).Trim();$url="https://github.com/$repo/releases/download/$tag/$env:FR_ASSET_EXE"
          $j=[ordered]@{version=$env:FR_VERSION;notes="Factura Rapida $env:FR_VERSION - scripts productivos locales cargados despues de DOMContentLoaded y EXE real validado";pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}}
          $j|ConvertTo-Json -Depth 8|Set-Content release-files/latest.json -Encoding UTF8
          $lh=(Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant();"FR_LATEST_SHA256=$lh"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Crear y verificar release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_SIG" "release-files/latest.json" --repo $repo --target $env:GITHUB_SHA --title "Factura Rapida $tag" --notes "v$env:FR_VERSION: parser WebView2 liberado externalizando scripts productivos locales y ejecutandolos despues de DOMContentLoaded. EXE real valido DOM, hit-test, foco y carga de scripts. No se emitio CFDI durante pruebas." --latest
          $r=gh api "/repos/$repo/releases/tags/$tag"|ConvertFrom-Json
          if($r.draft -or $r.prerelease){throw 'Release no estable'}
          if($r.assets.Count -ne 3){throw 'Assets incompletos'}
          New-Item -ItemType Directory -Force public-check|Out-Null
          $base="https://github.com/$repo/releases/download/$tag"
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE" -OutFile "public-check/$env:FR_ASSET_EXE" -UseBasicParsing
          Invoke-WebRequest "$base/$env:FR_ASSET_SIG" -OutFile "public-check/$env:FR_ASSET_SIG" -UseBasicParsing
          Invoke-WebRequest "$base/latest.json" -OutFile public-check/latest.json -UseBasicParsing
          $eh=(Get-FileHash "public-check/$env:FR_ASSET_EXE" -Algorithm SHA256).Hash.ToLowerInvariant();$sh=(Get-FileHash "public-check/$env:FR_ASSET_SIG" -Algorithm SHA256).Hash.ToLowerInvariant();$lh=(Get-FileHash public-check/latest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if($eh -ne $env:FR_EXE_SHA256 -or $sh -ne $env:FR_SIG_SHA256 -or $lh -ne $env:FR_LATEST_SHA256){throw 'Hash publico incorrecto'}
          $j=Get-Content public-check/latest.json -Raw|ConvertFrom-Json
          if([string]$j.version -ne $env:FR_VERSION){throw 'latest.json version incorrecta'}
          if([string]$j.platforms.'windows-x86_64'.url -ne "$base/$env:FR_ASSET_EXE"){throw 'latest.json URL incorrecta'}
          Write-Host "PUBLIC RELEASE OK v$env:FR_VERSION EXE_SHA256=$eh"

      - name: Limpiar si falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION";$rels=gh api "/repos/$repo/releases?per_page=100"|ConvertFrom-Json
          foreach($r in ($rels|Where-Object{$_.tag_name -eq $tag})){gh api --method DELETE "/repos/$repo/releases/$($r.id)"|Out-Null}
          gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" 2>$null;$global:LASTEXITCODE=0

name: SOLRAK v0.1.90 Keyboard Ticket UX safe

on:
  push:
    branches:
      - feature/v0.1.90-keyboard-ticket-ux
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.1.90-keyboard-ticket-ux
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar endurecimiento UX
        run: python scripts/apply-v0190-patches.py
      - name: Dependencia de pruebas
        run: npm install --no-save jsdom@26.1.0
      - name: Smoke v0.1.90
        run: node tests/solrak-keyboard-ticket-ux-v0190-smoke.mjs
      - name: Regresiones recientes
        run: |
          node tests/solrak-shifts-v0189-smoke.mjs
          node tests/solrak-inventory-mode-v0188-smoke.mjs
          node tests/solrak-categorias-v0187-smoke.mjs
          node tests/solrak-formularios-v0186-smoke.mjs
          node tests/solrak-caja-cortes-v0185-smoke.mjs
          node tests/solrak-ui-hardening-v0184-smoke.mjs
          node tests/solrak-ui-operativa-v0183-smoke.mjs
          node tests/solrak-credit-accounts-v0182-smoke.mjs
          node tests/solrak-clients-credit-v0181-smoke.mjs
          node tests/solrak-product-lifecycle-v0180-smoke.mjs
          node tests/solrak-permissions-v0179-smoke.mjs
          node tests/solrak-price-verifier-v0177-smoke.mjs
          node tests/solrak-held-tickets-v0176-smoke.mjs
          node tests/solrak-inventory-v0175-smoke.mjs
          node tests/solrak-sales-v0174-smoke.mjs
          node tests/solrak-flow-v0173-smoke.mjs
          node tests/solrak-reports-v0172-smoke.mjs
          node tests/solrak-sumapro-fiel-v0171-smoke.mjs
          node tests/pos-module-smoke.mjs
      - name: Auditoría UX operativa
        run: |
          grep -q 'const MAX_TICKETS = 8;' pos-module.js
          grep -Fq 'const barcodeValue = String(receipt?.saleNumber || 0);' solrak-sumapro-tickets-v0169.js
          ! grep -Pq '(^|[^.\w])(confirm|prompt)\s*\(|window\.(confirm|prompt)\s*\(' pos-module.js solrak-sumapro-fiel-v0171.js
          grep -q 'confirmSaleVoid' solrak-sumapro-fiel-v0171.js
          grep -q 'confirmReturnImpact' solrak-sumapro-fiel-v0171.js
          grep -q 'solrak-keyboard-ticket-ux-v0190.js' index.html
          echo 'Referencias nativas restantes en JS raíz:'
          grep -Pn '(^|[^.\w])(alert|confirm|prompt)\s*\(|window\.(alert|confirm|prompt)\s*\(' ./*.js || true
      - name: Guardas de alcance
        run: |
          ! grep -Eqi 'cfdi-api|finkok' solrak-keyboard-ticket-ux-v0190.js supabase/functions/ticket-ux-api/index.ts
          grep -q 'ticket_barcode_enabled' supabase/migrations/202609020010_keyboard_ticket_ux.sql
      - name: Persistir integración y endurecimiento
        run: |
          if git diff --quiet; then echo 'Sin cambios pendientes.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pos-module.js solrak-sumapro-fiel-v0171.js solrak-sumapro-tickets-v0169.js solrak-shifts-v0189.js
          git commit -m 'chore: integrar UX teclado y ticket v0.1.90'
          git push origin HEAD:feature/v0.1.90-keyboard-ticket-ux

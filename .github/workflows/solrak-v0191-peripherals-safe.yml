name: SOLRAK v0.1.91 Periféricos escritorio safe

on:
  push:
    branches:
      - feature/v0.1.91-desktop-peripherals-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.1.91-desktop-peripherals-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom@26.1.0
      - name: Smoke periféricos
        run: node tests/solrak-peripherals-v0191-smoke.mjs
      - name: Regresiones núcleo
        run: |
          node tests/solrak-ux-core-v0190-smoke.mjs
          node tests/solrak-shifts-v0189-smoke.mjs
          node tests/solrak-inventory-mode-v0188-smoke.mjs
          node tests/solrak-categorias-v0187-smoke.mjs
          node tests/solrak-caja-cortes-v0185-smoke.mjs
          node tests/solrak-credit-accounts-v0182-smoke.mjs
          node tests/solrak-held-tickets-v0176-smoke.mjs
          node tests/pos-module-smoke.mjs
      - name: Guardas
        run: |
          grep -q 'const VERSION = "0.1.91"' solrak-peripherals-v0191.js
          grep -q 'CODE128' solrak-peripherals-v0191.js
          grep -q 'solrak:scale-weight' solrak-peripherals-v0191.js
          grep -q 'const MAX_TICKETS = 8;' pos-module.js
          grep -q 'const barcodeValue = number;' solrak-sumapro-tickets-v0169.js
          ! grep -Eq '\b(alert|confirm|prompt)[[:space:]]*\(' solrak-peripherals-v0191.js
          ! grep -Eqi 'cfdi-api|finkok|completeSale' solrak-peripherals-v0191.js
      - name: Integrar v0.1.91
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tag='<script src="solrak-peripherals-v0191.js"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('index incompleto')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Persistir integración
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: integrar periféricos v0.1.91 en index'
          git push origin HEAD:feature/v0.1.91-desktop-peripherals-hardening
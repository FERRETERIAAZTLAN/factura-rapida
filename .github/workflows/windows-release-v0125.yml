name: SOLRAK - Rollback estable v0.2.2

on:
  push:
    branches: [rollback-facturacion-v0125]
    paths:
      - '.github/workflows/windows-release-v0125.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FR_VERSION: "0.2.2"
  FR_WORKING_UI_BLOB: "8bd8ad009cd8474f520ccd6da250ccc1662731e8"

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout rollback
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar snapshot funcional y version nueva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          try{gh api "/repos/$repo/git/ref/tags/$tag" *> $null;throw "$tag ya existe como tag"}catch{if($_.Exception.Message -like '*ya existe como tag*'){throw}}
          if(-not(Test-Path index.html)){throw 'Falta index.html funcional'}
          $blob=(git hash-object index.html).Trim()
          if($blob -ne $env:FR_WORKING_UI_BLOB){throw "El index ya no es el snapshot funcional esperado: $blob"}
          foreach($p in @('solrak-sales-suma-v0201.js','solrak-redesign-v0170.js','solrak-reports-v0172.js','pos-module.js','quotes-module.js')){if(Test-Path $p){throw "Quedo modulo posterior: $p"}}
          Write-Host "ROLLBACK_UI_EXACTA blob=$blob"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconstruir Desktop de la version funcional
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip' | Select-Object -First 1
          if(-not $zip){throw 'No se encontro ZIP base funcional'}
          Expand-Archive $zip.FullName . -Force
          if(-not(Test-Path desktop)){throw 'No se creo desktop'}
          Push-Location desktop
          npm install --no-audit --no-fund
          if(-not(Select-String -Path src-tauri/Cargo.toml -Pattern serde_json -Quiet)){Push-Location src-tauri;cargo add serde_json@1;Pop-Location}
          node scripts/set-version.mjs "$env:FR_VERSION"
          Pop-Location
          $cfgPath='desktop/src-tauri/tauri.conf.json'
          $cfg=Get-Content $cfgPath -Raw | ConvertFrom-Json
          $cfg.productName='SOLRAK'
          $cfg.identifier='com.facturarapida.desktop'
          $cfg | ConvertTo-Json -Depth 30 | Set-Content $cfgPath -Encoding UTF8
          Write-Host 'DESKTOP_FUNCIONAL_RECONSTRUIDO'

      - name: Empaquetar UI funcional
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          Push-Location desktop
          npm run sync-web
          Pop-Location
          if(-not(Test-Path desktop/dist/index.html)){throw 'No se genero desktop/dist/index.html'}
          if((Get-Item desktop/dist/index.html).Length -lt 10000){throw 'desktop/dist/index.html quedo incompleto'}
          foreach($p in @('desktop/dist/solrak-sales-suma-v0201.js','desktop/dist/solrak-redesign-v0170.js','desktop/dist/solrak-reports-v0172.js','desktop/dist/pos-module.js','desktop/dist/quotes-module.js')){if(Test-Path $p){throw "Quedo modulo posterior en paquete: $p"}}
          @'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('desktop/dist/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked=0;
          for(let i=0;i<scripts.length;i++){
            const src=(scripts[i][1].match(/\bsrc=["']([^"']+)/i)||[])[1];
            if(src) continue;
            new vm.Script(scripts[i][2],{filename:`inline-${i+1}.js`});
            checked++;
          }
          if(!checked) throw new Error('No se validaron scripts inline');
          console.log(`ROLLBACK_INLINE_JS_OK checked=${checked}`);
          '@ | Set-Content validate-rollback-ui.mjs -Encoding utf8
          node validate-rollback-ui.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Write-Host 'ROLLBACK_UI_PACKAGE_OK'

      - name: Configurar updater firmado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)){throw 'Falta signing key password'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar EXE real
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Probar que el EXE realmente abre
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='desktop/src-tauri/target/release/factura-rapida.exe'
          if(-not(Test-Path $exe)){$exe=(Get-ChildItem desktop/src-tauri/target/release -File -Filter '*.exe' | Where-Object {$_.Name -notmatch 'setup'} | Sort-Object Length -Descending | Select-Object -First 1).FullName}
          if(-not $exe -or -not(Test-Path $exe)){throw 'No se encontro EXE ejecutable'}
          $p=Start-Process -FilePath (Resolve-Path $exe).Path -PassThru
          try{
            Start-Sleep -Seconds 20
            if($p.HasExited){throw "El EXE se cerro durante la prueba de apertura. ExitCode=$($p.ExitCode)"}
            Write-Host "EXE_ABIERTO_OK pid=$($p.Id)"
          } finally {if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}

      - name: Preparar assets firmados
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}
          $sig="$($exe.FullName).sig";if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="SOLRAK_$env:FR_VERSION`_x64-setup.exe"
          Copy-Item $exe.FullName "release-files/$name" -Force
          Copy-Item $sig "release-files/$name.sig" -Force
          $eh=(Get-FileHash "release-files/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh=(Get-FileHash "release-files/$name.sig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$eh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $signature=(Get-Content "release-files/$name.sig" -Raw).Trim()
          $url="https://github.com/$repo/releases/download/$tag/$name"
          $notes='SOLRAK v0.2.2: rollback total a la version funcional de facturacion usada en produccion. Se retiraron los modulos, redisenos y funciones agregados despues. Conserva el flujo de CFDI real de esa version.'
          $j=[ordered]@{version=$env:FR_VERSION;notes=$notes;pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          "FR_LATEST_SHA256=$((Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Respaldar instalador firmado
        uses: actions/upload-artifact@v4
        with:
          name: SOLRAK-v0.2.2-rollback-windows-signed
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar rollback v0.2.2 como Latest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target '${{ github.sha }}' --title "SOLRAK $tag" --notes 'v0.2.2 estable: rollback total a la version funcional de facturacion. EXE real probado, updater firmado y sin los modulos posteriores.' --draft
          $r=$null
          for($i=1;$i -le 20;$i++){$rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json;$r=$rels|Where-Object {$_.tag_name -eq $tag -and $_.draft}|Select-Object -First 1;if($r -and $r.assets.Count -ge 3){break};Start-Sleep -Seconds 2}
          if(-not $r){throw 'No se encontro borrador'}
          $expected=@{$env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256";"$env:FR_ASSET_EXE.sig"="sha256:$env:FR_SIG_SHA256";'latest.json'="sha256:$env:FR_LATEST_SHA256"}
          foreach($n in $expected.Keys){$a=$r.assets|Where-Object {$_.name -eq $n}|Select-Object -First 1;if(-not $a){throw "Falta asset $n"};if([string]$a.digest -ne $expected[$n]){throw "Hash remoto incorrecto $n"}}
          $pub=gh api --method PATCH "/repos/$repo/releases/$($r.id)" -F draft=false -F prerelease=false | ConvertFrom-Json
          if($pub.draft -or $pub.prerelease){throw 'Release no quedo publica'}
          gh release edit $tag --repo $repo --latest
          Write-Host 'ROLLBACK_V0202_PUBLICADO_LATEST'

      - name: Verificacion publica final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $r=gh api "/repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if($r.draft -or $r.prerelease -or [string]$r.tag_name -ne $tag){throw 'Release invalida'}
          if([string]$latest.tag_name -ne $tag){throw 'v0.2.2 no es Latest'}
          foreach($n in @($env:FR_ASSET_EXE,"$env:FR_ASSET_EXE.sig",'latest.json')){if(-not($r.assets|Where-Object {$_.name -eq $n})){throw "Falta asset $n"}}
          $j=Invoke-RestMethod "https://github.com/$repo/releases/latest/download/latest.json" -TimeoutSec 30
          if([string]$j.version -ne $env:FR_VERSION){throw 'latest.json incorrecto'}
          Write-Host 'PUBLIC_RELEASE_OK v0.2.2 ROLLBACK'

      - name: Limpiar borrador si falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          try{$rels=gh api "/repos/$repo/releases?per_page=100"|ConvertFrom-Json;$r=$rels|Where-Object {$_.tag_name -eq $tag -and $_.draft}|Select-Object -First 1;if($r){gh api --method DELETE "/repos/$repo/releases/$($r.id)"|Out-Null;Write-Host 'Borrador fallido eliminado'}}catch{Write-Host "Limpieza no critica: $($_.Exception.Message)"}

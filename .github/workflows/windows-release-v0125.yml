name: Factura Rapida - Release v0.1.25

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FR_VERSION: "0.1.25"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar version nueva
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          $ErrorActionPreference='Stop'
          $tag="v$env:FR_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if($LASTEXITCODE -eq 0){throw "$tag ya existe"}
          $global:LASTEXITCODE=0

      - name: Preparar Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip'|Select-Object -First 1
          if(-not $zip){throw 'No se encontro ZIP base'}
          Expand-Archive $zip.FullName . -Force
          if(-not(Test-Path desktop)){throw 'No se creo desktop'}
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile index.html -UseBasicParsing

      - name: Validar firma y updater
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta TAURI_SIGNING_PRIVATE_KEY'}
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)){throw 'Falta TAURI_SIGNING_PRIVATE_KEY_PASSWORD'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta TAURI_UPDATER_PUBKEY'}

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias Desktop
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Asegurar serde_json
        working-directory: desktop/src-tauri
        shell: pwsh
        run: if(-not(Select-String -Path Cargo.toml -Pattern serde_json -Quiet)){cargo add serde_json@1}

      - name: Establecer version
        working-directory: desktop
        run: node scripts/set-version.mjs "${{ env.FR_VERSION }}"

      - name: Sincronizar interfaz productiva
        working-directory: desktop
        run: npm run sync-web

      - name: Configurar actualizador
        shell: pwsh
        run: |
          $c=@{bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c|ConvertTo-Json -Depth 10|Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar firmar y publicar
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: Factura Rapida v__VERSION__
          releaseBody: Produccion real Finkok. Emision por cfdi-issue-api con preflight, confirmacion explicita, proteccion de folio, Timbres, Gmail y PDF/XML.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Reconstruir latest.json
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $a=gh release view $tag --repo $repo --json assets|ConvertFrom-Json
          $exe=$a.assets|?{$_.name-match'\.exe$'}|select -First 1
          $sig=$a.assets|?{$_.name-match'\.exe\.sig$'}|select -First 1
          if(-not$exe-or-not$sig){throw 'Faltan EXE o firma'}
          mkdir release-files -Force|Out-Null
          gh release download $tag --repo $repo --pattern '*.exe.sig' --dir release-files --clobber
          $sf=Get-ChildItem release-files -Filter '*.exe.sig'|select -First 1
          $st=(Get-Content $sf.FullName -Raw).Trim()
          $url="https://github.com/$repo/releases/download/$tag/$([uri]::EscapeDataString($exe.name))"
          $j=[ordered]@{version=$env:FR_VERSION;notes="Factura Rapida $env:FR_VERSION";pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$st;url=$url}}}
          $j|ConvertTo-Json -Depth 8|Set-Content latest.json -Encoding UTF8
          gh release upload $tag latest.json --clobber --repo $repo

      - name: Verificacion final de firma y updater
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          $repo='${{ github.repository }}';$tag="v$env:FR_VERSION"
          $r=gh release view $tag --repo $repo --json isDraft,isPrerelease,assets,tagName|ConvertFrom-Json
          if($r.tagName-ne$tag-or$r.isDraft-or$r.isPrerelease){throw 'Release no estable'}
          $exe=$r.assets|?{$_.name-match'\.exe$'}|select -First 1
          $sig=$r.assets|?{$_.name-match'\.exe\.sig$'}|select -First 1
          $lat=$r.assets|?{$_.name-eq'latest.json'}|select -First 1
          if(-not$exe-or-not$sig-or-not$lat){throw 'Release incompleta'}
          mkdir verify-files -Force|Out-Null
          gh release download $tag --repo $repo --pattern latest.json --dir verify-files --clobber
          gh release download $tag --repo $repo --pattern '*.exe.sig' --dir verify-files --clobber
          $j=Get-Content verify-files/latest.json -Raw|ConvertFrom-Json
          $sf=Get-ChildItem verify-files -Filter '*.exe.sig'|select -First 1
          $st=(Get-Content $sf.FullName -Raw).Trim()
          $p=$j.platforms.'windows-x86_64'
          if([string]$j.version-ne$env:FR_VERSION-or-not$p-or[string]$p.signature.Trim()-ne$st){throw 'latest.json o firma no coinciden'}
          Write-Host 'VERIFICACION FINAL OK'

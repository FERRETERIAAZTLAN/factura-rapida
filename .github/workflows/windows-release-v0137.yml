name: Factura Rapida - Release v0.1.37 Isolated Startup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0137.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.37"
  FR_WEBVIEW_PROFILE: "webview-profile-v7"
  FR_STORAGE_BOOT_MODE: "isolated-profile"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_PRODUCTION_HEALTH_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-production-health?business=AZTLAN"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight release nuevo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object { $_.tag_name -eq $tag }){ throw "$tag ya existe como release" }
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){ throw "$tag ya existe como tag" }
          $global:LASTEXITCODE=0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Auditoria LIVE de produccion
        shell: pwsh
        run: node tests/production-live-smoke.mjs

      - name: Preparar Desktop base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip' | Select-Object -First 1
          if(-not $zip){ throw 'No se encontro ZIP base' }
          Expand-Archive $zip.FullName . -Force
          if(-not(Test-Path desktop)){ throw 'No se creo desktop' }

      - name: Validar firma y updater
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){ throw 'Falta TAURI_SIGNING_PRIVATE_KEY' }
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)){ throw 'Falta TAURI_SIGNING_PRIVATE_KEY_PASSWORD' }
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){ throw 'Falta TAURI_UPDATER_PUBKEY' }
          if([string]$env:FR_STORAGE_BOOT_MODE -ne 'isolated-profile'){ throw 'Storage boot debe ser isolated-profile' }

      - name: Preparar WebView2 y handshake nativo
        shell: pwsh
        run: node scripts/prepare-windows-desktop.mjs

      - name: Verificar puente y perfil antes del merge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $w=$t.app.windows | Where-Object { $_.label -eq 'main' } | Select-Object -First 1
          if(-not $w){throw 'No existe ventana main'}
          if([string]$w.dataDirectory -ne $env:FR_WEBVIEW_PROFILE){throw 'Perfil WebView2 incorrecto'}
          if($w.incognito -ne $false){throw 'Perfil WebView2 debe ser persistente'}
          if($t.app.withGlobalTauri -ne $true){throw 'window.__TAURI__ no habilitado'}
          $rust=Get-Content desktop/src-tauri/src/main.rs -Raw
          foreach($m in @('CARGO_PKG_VERSION','desktop_info','check_for_updates','install_update','webview_milestone','login_ui_ready','PAGE_LOAD')){if(-not $rust.Contains($m)){throw "Rust perdio $m"}}

      - name: Instalar dependencias Desktop
        working-directory: desktop
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Instalar JSDOM
        shell: pwsh
        run: npm install --no-save --no-audit --no-fund jsdom@25

      - name: Asegurar serde_json
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          if(-not(Select-String -Path Cargo.toml -Pattern 'serde_json' -Quiet)){ cargo add serde_json@1 }

      - name: Establecer version real
        working-directory: desktop
        shell: pwsh
        run: node scripts/set-version.mjs "$env:FR_VERSION"

      - name: Descargar UI productiva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'}
          $h=Get-Content production-source.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-webview-debug="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"')){if(-not $h.Contains($m)){throw "Fuente productiva incompleta: $m"}}

      - name: Fusionar UI productiva con puentes nativos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop; npm run sync-web; Pop-Location
          if(-not(Test-Path desktop/dist/index.html)){throw 'sync-web no genero HTML'}

      - name: Preparar arranque SIN acceso a storage
        shell: pwsh
        run: node scripts/finalize-windows-html.mjs desktop/dist/index.html

      - name: Blindar clic y foco del login
        shell: pwsh
        run: node scripts/guard-windows-login-v0135.mjs desktop/dist/index.html

      - name: Mover guardia de login al inicio real
        shell: pwsh
        run: node scripts/reorder-windows-login-guard-v0137.mjs desktop/dist/index.html

      - name: Empaquetar XLSX local y ASYNC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $url='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; $dest='desktop/dist/vendor/xlsx.full.min.js'
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          if((Get-Item $dest).Length -lt 500000){throw 'XLSX local incompleto'}
          node scripts/vendor-windows-static-assets.mjs desktop/dist/index.html $dest

      - name: Pruebas de arranque no bloqueante
        shell: pwsh
        run: |
          node tests/windows-xlsx-nonblocking-v0136.mjs desktop/dist/index.html
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          node tests/windows-storage-isolated-v0137.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json
          node tests/windows-webview-profile-v0132.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json desktop/src-tauri/src/main.rs
          node tests/windows-login-hit-target-v0135.mjs desktop/dist/index.html desktop/src-tauri/src/main.rs desktop/src-tauri/tauri.conf.json
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html

      - name: Auditoria productiva del HTML exacto
        shell: pwsh
        env:
          FR_LOCAL_UI_PATH: desktop/dist/index.html
        run: node tests/production-live-smoke.mjs

      - name: Config Tauri release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){throw 'tauri.conf version incorrecta'}
          if([string]$t.build.frontendDist -ne '../dist'){throw 'frontendDist incorrecto'}
          if($t.app.withGlobalTauri -ne $true){throw 'Tauri global API deshabilitada'}
          $w=$t.app.windows | Where-Object { $_.label -eq 'main' } | Select-Object -First 1
          if([string]$w.dataDirectory -ne $env:FR_WEBVIEW_PROFILE){throw 'Perfil WebView2 se perdio'}
          $cargo=Get-Content desktop/src-tauri/Cargo.toml -Raw
          if($cargo -notmatch ('version\s*=\s*"'+[regex]::Escape($env:FR_VERSION)+'"')){throw 'Cargo.toml version incorrecta'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar Windows
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
          if($LASTEXITCODE -ne 0){throw "Tauri build fallo $LASTEXITCODE"}

      - name: Probar EXE real - parser, DOM, hit-test y foco
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'; Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 50;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE se cerro. Log: $txt"}
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started')
                $parser=$txt.Contains('WEBVIEW_MILESTONE HEAD_SCRIPT_STARTED') -and $txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('\"ok\":true') -and $txt.Contains('\"hitOk\":true') -and $txt.Contains('\"focusOk\":true') -and $txt.Contains('businessCode') -and $txt.Contains('loginUser') -and $txt.Contains('loginPin') -and $txt.Contains('loginBtn')
                if($base -and $parser -and $ready){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE real no supero arranque/login. Log: $txt"}
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}
          Write-Host 'WINDOWS REAL LOGIN ACCEPTANCE OK'

      - name: Preparar artefactos y hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'; $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No se genero EXE NSIS'}
          $sigPath="$($exe.FullName).sig"; if(-not(Test-Path $sigPath)){throw 'No se genero .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $safeExe="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe"; $safeSig="$safeExe.sig"
          Copy-Item $exe.FullName "release-files/$safeExe" -Force; Copy-Item $sigPath "release-files/$safeSig" -Force
          $eh=(Get-FileHash "release-files/$safeExe" -Algorithm SHA256).Hash.ToLowerInvariant(); $sh=(Get-FileHash "release-files/$safeSig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_ASSET_EXE=$safeExe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_ASSET_SIG=$safeSig" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$eh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "EXE SHA256 $eh"

      - name: Generar latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $signature=(Get-Content "release-files/$env:FR_ASSET_SIG" -Raw).Trim(); if([string]::IsNullOrWhiteSpace($signature)){throw 'Firma vacia'}
          $url="https://github.com/$repo/releases/download/$tag/$env:FR_ASSET_EXE"
          $j=[ordered]@{version=$env:FR_VERSION;notes="Factura Rapida $env:FR_VERSION - arranque WebView2 aislado sin acceso sincronico a storage; login validado en EXE real";pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          $lh=(Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant(); "FR_LATEST_SHA256=$lh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Crear borrador y localizar por consistencia
        id: draft
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $title="Factura Rapida $tag"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_SIG" "release-files/latest.json" --repo $repo --target $env:GITHUB_SHA --title $title --notes "Arranque Windows corregido: perfil WebView2 nuevo y primer script sin localStorage/sessionStorage. Guardia de login corre antes de scripts productivos. El EXE real valido parser, DOMContentLoaded, hit-test y foco antes de publicar. No se emitio CFDI durante pruebas." --draft
          $r=$null
          for($i=1;$i -le 12;$i++){$rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json;$r=$rels|Where-Object{$_.draft -eq $true -and ($_.tag_name -eq $tag -or $_.name -eq $title)}|Sort-Object created_at -Descending|Select-Object -First 1;if($r){break};Start-Sleep -Seconds 2}
          if(-not $r){throw 'No se encontro borrador'}
          "release_id=$($r.id)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verificar borrador remoto por hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $rid='${{ steps.draft.outputs.release_id }}'; $r=gh api "/repos/$repo/releases/$rid" | ConvertFrom-Json
          if(-not $r.draft -or $r.prerelease){throw 'Estado inesperado borrador'}
          if([string]$r.tag_name -ne "v$env:FR_VERSION"){throw 'Tag inesperado'}
          if($r.assets.Count -ne 3){throw "Assets inesperados: $($r.assets.Count)"}
          $expected=@{$env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256";$env:FR_ASSET_SIG="sha256:$env:FR_SIG_SHA256";'latest.json'="sha256:$env:FR_LATEST_SHA256"}
          foreach($name in $expected.Keys){$a=$r.assets|Where-Object{$_.name -eq $name}|Select-Object -First 1;if(-not $a){throw "Falta $name"};if([string]$a.digest -ne $expected[$name]){throw "Hash remoto incorrecto $name"}}

      - name: Publicar release estable
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'; $rid='${{ steps.draft.outputs.release_id }}'
          gh api --method PATCH "/repos/$repo/releases/$rid" -f draft=false -f prerelease=false -f make_latest=true | Out-Null

      - name: Verificacion publica final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if([string]$latest.tag_name -ne "v$env:FR_VERSION" -or $latest.draft -or $latest.prerelease){throw 'Release final no estable/latest'}
          New-Item -ItemType Directory -Force public-check | Out-Null; $base="https://github.com/$repo/releases/download/v$env:FR_VERSION"
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE" -OutFile "public-check/$env:FR_ASSET_EXE" -UseBasicParsing
          Invoke-WebRequest "$base/$env:FR_ASSET_SIG" -OutFile "public-check/$env:FR_ASSET_SIG" -UseBasicParsing
          Invoke-WebRequest "$base/latest.json" -OutFile "public-check/latest.json" -UseBasicParsing
          $eh=(Get-FileHash "public-check/$env:FR_ASSET_EXE" -Algorithm SHA256).Hash.ToLowerInvariant(); $sh=(Get-FileHash "public-check/$env:FR_ASSET_SIG" -Algorithm SHA256).Hash.ToLowerInvariant(); $lh=(Get-FileHash public-check/latest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if($eh -ne $env:FR_EXE_SHA256 -or $sh -ne $env:FR_SIG_SHA256 -or $lh -ne $env:FR_LATEST_SHA256){throw 'Hash publico incorrecto'}
          $j=Get-Content public-check/latest.json -Raw | ConvertFrom-Json; if([string]$j.version -ne $env:FR_VERSION){throw 'latest.json version incorrecta'}
          Write-Host "PUBLIC RELEASE OK v$env:FR_VERSION EXE_SHA256=$eh"

      - name: Limpiar borrador si falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach($r in ($rels|Where-Object{$_.draft -eq $true -and $_.tag_name -eq $tag})){gh api --method DELETE "/repos/$repo/releases/$($r.id)" | Out-Null}
          gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" 2>$null; $global:LASTEXITCODE=0

name: Factura Rapida Windows 0.1.4 - Build Seguro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip"
      - ".github/workflows/windows-safe-014-build.yml"
      - "index.html"
      - "quotes-module.js"
      - "product-images-module.js"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir Factura Rapida Desktop
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File -Filter "Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip" | Select-Object -First 1
          if (-not $zip) { throw "No se encontro el paquete seguro 0.1.4" }
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force

      - name: Validar clave publica
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)) {
            throw "Falta TAURI_UPDATER_PUBKEY"
          }

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Sincronizar web
        working-directory: desktop
        run: npm run sync-web

      - name: Sincronizar modulos web externos
        shell: pwsh
        run: |
          $assets = @("quotes-module.js", "product-images-module.js")
          foreach ($asset in $assets) {
            $source = Join-Path $PWD $asset
            if (-not (Test-Path $source)) { throw "Falta modulo web requerido: $asset" }
            Copy-Item -Path $source -Destination (Join-Path $PWD "desktop/dist/$asset") -Force
          }
          foreach ($asset in $assets) {
            if (-not (Test-Path (Join-Path $PWD "desktop/dist/$asset"))) { throw "No se empaqueto: $asset" }
          }

      - name: Compilar instalador
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Factura-Rapida-Windows-0.1.4-SAFE
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

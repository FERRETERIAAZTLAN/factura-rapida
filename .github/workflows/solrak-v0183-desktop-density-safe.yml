name: SOLRAK v0.1.83 desktop density UI safe

on:
  push:
    branches:
      - feature/v0.1.83-desktop-density-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.1.83-desktop-density-ui
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencia de pruebas
        run: npm install --no-save jsdom@26.1.0
      - name: Smoke v0.1.83 interfaz escritorio
        run: node tests/solrak-desktop-density-v0183-smoke.mjs
      - name: Regresiones recientes
        run: |
          node tests/solrak-credit-accounts-v0182-smoke.mjs
          node tests/solrak-clients-credit-v0181-smoke.mjs
          node tests/solrak-product-lifecycle-v0180-smoke.mjs
          node tests/solrak-permissions-v0179-smoke.mjs
          node tests/solrak-price-verifier-v0177-smoke.mjs
          node tests/solrak-held-tickets-v0176-smoke.mjs
          node tests/solrak-inventory-v0175-smoke.mjs
          node tests/solrak-sales-v0174-smoke.mjs
          node tests/solrak-flow-v0173-smoke.mjs
          node tests/solrak-reports-v0172-smoke.mjs
          node tests/solrak-sumapro-fiel-v0171-smoke.mjs
          node tests/solrak-pos-operations-v0171-contract.mjs
          node tests/pos-module-smoke.mjs
      - name: Guardas de alcance
        run: |
          ! grep -Eqi 'cfdi-api|finkok' solrak-desktop-density-v0183.js
          grep -q 'MAX_TICKETS = 8' solrak-desktop-density-v0183.js
          grep -q 'Recargas / Servicios' solrak-desktop-density-v0183.js
          grep -q 'No configurado' solrak-desktop-density-v0183.js
          grep -q 'Sin lectura real' solrak-desktop-density-v0183.js
          grep -q 'Cotización borrador' solrak-desktop-density-v0183.js
          grep -q 'solrak-held-tickets-v0176.js' index.html
          grep -q 'solrak-credit-accounts-v0182.js' index.html
      - name: Integrar módulo v0.1.83 en index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tag='<script src="solrak-desktop-density-v0183.js"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('index.html no contiene </body>')
              s=s.replace('</body>',tag+'\n</body>',1);p.write_text(s,encoding='utf-8')
          PY
          grep -q '<script src="solrak-desktop-density-v0183.js"></script>' index.html
      - name: Persistir integración en la rama
        run: |
          if git diff --quiet -- index.html; then echo 'Integración ya presente.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: integrar interfaz escritorio v0.1.83 en index'
          git push origin HEAD:feature/v0.1.83-desktop-density-ui

name: Truper image retry safe codes
on:
  push:
    branches: [feature/truper-product-images]
    paths: ['.github/workflows/truper-image-retry-missing.yml']
permissions:
  contents: read
  id-token: write
jobs:
  retry-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retry only products previously marked missing code
        shell: bash
        run: |
          set -euo pipefail
          URL='https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/truper-image-import-api'
          total_selected=0; total_uploaded=0; total_failed=0
          for batch in $(seq 1 10); do
            TOKEN_JSON=$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=factura-rapida-truper-import")
            OIDC=$(printf '%s' "$TOKEN_JSON" | jq -r '.value')
            RESP=$(curl -fsSL --retry 3 --retry-all-errors --max-time 150 -X POST "$URL" -H "Authorization: Bearer ${OIDC}" -H 'Content-Type: application/json' --data '{"action":"retryMissing","limit":15}')
            selected=$(printf '%s' "$RESP" | jq -r '.selected // 0'); uploaded=$(printf '%s' "$RESP" | jq -r '.uploaded // 0'); failed=$(printf '%s' "$RESP" | jq -r '.failed // 0')
            test "$(printf '%s' "$RESP" | jq -r '.ok')" = "true"
            echo "retry batch=$batch selected=$selected uploaded=$uploaded failed=$failed"
            total_selected=$((total_selected+selected));total_uploaded=$((total_uploaded+uploaded));total_failed=$((total_failed+failed))
            [ "$selected" -eq 0 ] && break
            sleep 1
          done
          echo "TRUPER_RETRY_TOTAL selected=$total_selected uploaded=$total_uploaded failed=$total_failed"

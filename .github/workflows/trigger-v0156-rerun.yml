name: Trigger v0.1.56 after smoke fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-v0156-rerun.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Lanzar release v0.1.56 con main corregido
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run windows-release-v0156.yml --repo "${{ github.repository }}" --ref main

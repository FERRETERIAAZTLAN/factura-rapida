name: SOLRAK v0.1.72 PR Materialize

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rama v0.1.72
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.72-venta-reportes
          persist-credentials: true

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materializar archivos finales desde payload validado
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          source = Path('.github/workflows/solrak-v0172-bootstrap.yml').read_text()
          matches = re.findall(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d > ([^\n]+)", source)
          if len(matches) < 2:
              raise SystemExit('No se encontraron los dos payloads v0.1.72')

          expected = ['solrak-reports-v0172.js', 'tests/solrak-reports-v0172-smoke.mjs']
          for (payload, target), wanted in zip(matches[:2], expected):
              target = target.strip()
              if target != wanted:
                  raise SystemExit(f'Target inesperado: {target}')
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(payload)))

          index = Path('index.html')
          html = index.read_text()
          tag = '<script src="solrak-reports-v0172.js?v=1"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('index.html no contiene </body>')
              html = html.replace('</body>', tag + '\n</body>', 1)
              index.write_text(html)
          if index.read_text().count(tag) != 1:
              raise SystemExit('La carga v0.1.72 debe existir exactamente una vez')
          PY

      - name: Dependencias de pruebas
        run: npm install --no-save --no-audit --no-fund --package-lock=false jsdom@25

      - name: Validar corrección y regresiones
        shell: bash
        run: |
          set -euo pipefail
          node --check solrak-reports-v0172.js
          node tests/solrak-reports-v0172-smoke.mjs
          node tests/solrak-sumapro-fiel-v0171-smoke.mjs
          node tests/solrak-pos-operations-v0171-contract.mjs
          node tests/pos-module-smoke.mjs
          node tests/solrak-redesign-v0170-smoke.mjs
          node tests/quote-email-ui-smoke.mjs
          test "$(grep -o 'solrak-reports-v0172.js?v=1' index.html | wc -l)" -eq 1
          if grep -qi 'Recargas y Servicios' solrak-reports-v0172.js; then exit 1; fi

      - name: Guardar archivos finales en la rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SOLRAK Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add solrak-reports-v0172.js tests/solrak-reports-v0172-smoke.mjs index.html
          if git diff --cached --quiet; then
            echo "Archivos v0.1.72 ya materializados"
            exit 0
          fi
          git commit -m "feat: restaurar Venta y reportes funcionales v0.1.72"
          git push origin HEAD:release/v0.1.72-venta-reportes

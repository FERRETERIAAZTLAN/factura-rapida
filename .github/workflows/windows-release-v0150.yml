name: Factura Rapida - Release v0.1.50 Publication Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0150.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.50"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_PRODUCTION_HEALTH_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-production-health?business=AZTLAN"
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable

      - name: Preflight version nueva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){throw "$tag ya existe como tag"}
          $global:LASTEXITCODE=0

      - name: Auditar backend productivo sin emitir CFDI
        shell: pwsh
        run: node tests/production-live-smoke.mjs

      - name: Reconstruir FIX1 y Rust
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134'){throw "FIX1 hash inesperado $sha"}
          Expand-Archive FIX1.zip . -Force
          node scripts/rebase-fix1-native-v0142.mjs desktop
          node scripts/ensure-rust-deps-v0143.mjs desktop/src-tauri/Cargo.toml
          Push-Location desktop; npm install --no-audit --no-fund; Pop-Location
          npm install --no-save --no-audit --no-fund jsdom@25
          Push-Location desktop/src-tauri; cargo generate-lockfile; cargo check --locked; Pop-Location

      - name: Establecer version
        working-directory: desktop
        shell: pwsh
        run: node scripts/set-version.mjs "$env:FR_VERSION"

      - name: Fusionar UI productiva
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'}
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop; npm run sync-web; Pop-Location
          node scripts/sanitize-production-ui-v0142.mjs desktop/dist/index.html
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html

      - name: XLSX local lazy y scripts pesados postDOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $dest='desktop/dist/vendor/xlsx.full.min.js'
          Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile $dest -UseBasicParsing
          if((Get-Item $dest).Length -lt 500000){throw 'XLSX incompleto'}
          node scripts/vendor-windows-xlsx-lazy-v0144.mjs desktop/dist/index.html $dest
          node scripts/postdom-inline-scripts-v0148.mjs desktop/dist/index.html
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          $h=Get-Content desktop/dist/index.html -Raw
          foreach($m in @('data-fr-login-clean="1"','frNativeBar','frNativeDesktopJs','window.__TAURI__','desktop_info','check_for_updates','install_update')){if(-not $h.Contains($m)){throw "Marcador faltante $m"}}
          if(-not $h.Contains('type="application/fr-postdom" data-fr-postdom="1" data-fr-facturar-real="8"')){throw 'Controlador fiscal no quedó diferido'}

      - name: Auditoria productiva HTML exacto y login seguro
        shell: pwsh
        env:
          FR_LOCAL_UI_PATH: desktop/dist/index.html
        run: |
          node tests/production-live-smoke.mjs
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html

      - name: Configurar firma updater
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){throw 'Version incorrecta'}
          if($t.app.withGlobalTauri -ne $true){throw 'window.__TAURI__ deshabilitado'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar Windows
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Aceptacion EXE real completa
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'; Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 150;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE se cerro: $txt"}
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started') -and $txt.Contains('PAGE_LOAD Finished')
                $parser=$txt.Contains('WEBVIEW_MILESTONE HEAD_SCRIPT_STARTED') -and $txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('"ok":true') -and $txt.Contains('"hitOk":true') -and $txt.Contains('"focusOk":true')
                if($base -and $parser -and $ready){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE real no paso aceptacion v0.1.50: $txt"}
            Start-Sleep -Seconds 20
            if($p.HasExited){throw 'EXE se cerro despues de LOGIN_UI_READY'}
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}
          Write-Host 'WINDOWS REAL STARTUP ACCEPTANCE V0.1.50 OK'

      - name: Preparar assets hashes latest
        shell: pwsh
        run: |
          $nsis='desktop/src-tauri/target/release/bundle/nsis'; $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}; $sig="$($exe.FullName).sig"; if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe"; Copy-Item $exe.FullName "release-files/$name" -Force; Copy-Item $sig "release-files/$name.sig" -Force
          $eh=(Get-FileHash "release-files/$name" -Algorithm SHA256).Hash.ToLowerInvariant(); $sh=(Get-FileHash "release-files/$name.sig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8; "FR_EXE_SHA256=$eh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8; "FR_SIG_SHA256=$sh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $signature=(Get-Content "release-files/$name.sig" -Raw).Trim(); $url="https://github.com/$repo/releases/download/$tag/$name"
          $j=[ordered]@{version=$env:FR_VERSION;notes='EXE real validado con DOMContentLoaded, hit-test y foco; login seguro probado; UI productiva auditada; XLSX local lazy; no se emitió CFDI.';pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$signature;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          "FR_LATEST_SHA256=$((Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publicar estable y verificar hashes remotos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target $env:GITHUB_SHA --title "Factura Rapida $tag" --notes 'v0.1.50 estable: EXE real pasó START/SETUP, PAGE_LOAD Finished, DOMContentLoaded, hit-test y foco; permaneció abierto; auditoría productiva y login seguro OK; no se emitió CFDI.' --draft
          $r=$null
          for($i=1;$i -le 20;$i++){
            try {$r=gh api "/repos/$repo/releases/tags/$tag" | ConvertFrom-Json} catch {$r=$null}
            if($r -and $r.draft -and $r.assets.Count -ge 3){break}
            Start-Sleep -Seconds 2
          }
          if(-not $r -or -not $r.draft){throw 'No se pudo resolver el borrador recién creado por tag'}
          $expected=@{$env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256";"$env:FR_ASSET_EXE.sig"="sha256:$env:FR_SIG_SHA256";'latest.json'="sha256:$env:FR_LATEST_SHA256"}
          foreach($n in $expected.Keys){$a=$r.assets|Where-Object{$_.name -eq $n}|Select-Object -First 1;if(-not $a){throw "Falta $n"};if([string]$a.digest -ne $expected[$n]){throw "Hash remoto incorrecto $n esperado=$($expected[$n]) actual=$($a.digest)"}}
          gh api --method PATCH "/repos/$repo/releases/$($r.id)" -f draft=false -f prerelease=false -f make_latest=true | Out-Null

      - name: Verificacion publica final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $base="https://github.com/$repo/releases/download/$tag"
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if([string]$latest.tag_name -ne $tag -or $latest.draft -or $latest.prerelease){throw 'Release no estable/latest'}
          New-Item -ItemType Directory -Force public-check | Out-Null
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE" -OutFile "public-check/$env:FR_ASSET_EXE" -UseBasicParsing; Invoke-WebRequest "$base/$env:FR_ASSET_EXE.sig" -OutFile "public-check/$env:FR_ASSET_EXE.sig" -UseBasicParsing; Invoke-WebRequest "$base/latest.json" -OutFile public-check/latest.json -UseBasicParsing
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_EXE_SHA256){throw 'EXE hash'}
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE.sig" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_SIG_SHA256){throw 'SIG hash'}
          if((Get-FileHash public-check/latest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_LATEST_SHA256){throw 'latest hash'}
          $manifest=Get-Content public-check/latest.json -Raw | ConvertFrom-Json
          if([string]$manifest.version -ne $env:FR_VERSION){throw 'latest version'}
          if([string]$manifest.platforms.'windows-x86_64'.signature -ne (Get-Content "public-check/$env:FR_ASSET_EXE.sig" -Raw).Trim()){throw 'Firma latest'}
          if(-not([string]$manifest.platforms.'windows-x86_64'.url).Contains("/releases/download/$tag/$env:FR_ASSET_EXE")){throw 'URL latest'}
          Write-Host "PUBLIC_RELEASE_OK $tag"

      - name: Limpiar borrador o tag si falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach($r in ($rels | Where-Object {$_.tag_name -eq $tag -and $_.draft})){gh api --method DELETE "/repos/$repo/releases/$($r.id)" | Out-Null}
          $ref=gh api "/repos/$repo/git/ref/tags/$tag" 2>$null | ConvertFrom-Json
          if($LASTEXITCODE -eq 0 -and $ref){gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" | Out-Null}; $global:LASTEXITCODE=0

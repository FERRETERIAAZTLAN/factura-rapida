name: Compilar Factura Rapida Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Factura_Rapida_Desktop_Windows_*.zip"
      - ".github/workflows/windows-bootstrap.yml"
      - "index.html"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Desktop
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File -Filter "Factura_Rapida_Desktop_Windows_*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "No se encontro el ZIP de Factura Rapida Desktop"
          }
          Write-Host "Usando ZIP: $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Sincronizar pagina web
        working-directory: desktop
        run: npm run sync-web

      - name: Compilar instalador EXE
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - name: Guardar instalador EXE
        uses: actions/upload-artifact@v4
        with:
          name: Factura-Rapida-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

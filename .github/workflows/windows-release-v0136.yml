name: Factura Rapida - Release v0.1.36 Nonblocking Startup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0136.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.36"
  FR_WEBVIEW_PROFILE: "webview-profile-v6"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_PRODUCTION_HEALTH_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-production-health?business=AZTLAN"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight release nuevo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object { $_.tag_name -eq $tag }) { throw "$tag ya existe como release" }
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){ throw "$tag ya existe como tag" }
          $global:LASTEXITCODE=0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Auditoria LIVE de produccion
        shell: pwsh
        run: node tests/production-live-smoke.mjs

      - name: Preparar Desktop base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip' | Select-Object -First 1
          if(-not $zip){ throw 'No se encontro ZIP base' }
          Expand-Archive $zip.FullName . -Force
          if(-not(Test-Path desktop)){ throw 'No se creo desktop' }

      - name: Validar firma y updater
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){ throw 'Falta TAURI_SIGNING_PRIVATE_KEY' }
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)){ throw 'Falta TAURI_SIGNING_PRIVATE_KEY_PASSWORD' }
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){ throw 'Falta TAURI_UPDATER_PUBKEY' }
          if([string]::IsNullOrWhiteSpace($env:FR_WEBVIEW_PROFILE)){ throw 'Falta FR_WEBVIEW_PROFILE' }

      - name: Preparar WebView2 y handshake nativo de login
        shell: pwsh
        run: node scripts/prepare-windows-desktop.mjs

      - name: Verificar puente nativo antes del merge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $w=$t.app.windows | Where-Object { $_.label -eq 'main' } | Select-Object -First 1
          if(-not $w){ throw 'No existe ventana main' }
          if([string]$w.dataDirectory -ne $env:FR_WEBVIEW_PROFILE){ throw 'WebView2 no apunta al perfil nuevo' }
          if($w.incognito -ne $false){ throw 'Perfil WebView2 debe ser persistente' }
          if($t.app.withGlobalTauri -ne $true){ throw 'window.__TAURI__ no esta habilitado' }
          $rust=Get-Content desktop/src-tauri/src/main.rs -Raw
          foreach($m in @('CARGO_PKG_VERSION','desktop_info','check_for_updates','install_update','fn webview_milestone(step: String, detail: String)','WEBVIEW_MILESTONE {} {}','webview_milestone','fn login_ui_ready(report: String)','LOGIN_UI_READY {}','login_ui_ready')){
            if(-not $rust.Contains($m)){ throw "Rust perdio marcador: $m" }
          }
          Write-Host 'NATIVE LOGIN HANDSHAKE PRECHECK OK'

      - name: Instalar dependencias Desktop
        working-directory: desktop
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Instalar JSDOM para smoke estricto
        shell: pwsh
        run: npm install --no-save --no-audit --no-fund jsdom@25

      - name: Asegurar serde_json
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          if(-not(Select-String -Path Cargo.toml -Pattern 'serde_json' -Quiet)){ cargo add serde_json@1 }

      - name: Establecer version real
        working-directory: desktop
        shell: pwsh
        run: node scripts/set-version.mjs "$env:FR_VERSION"

      - name: Descargar UI productiva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'}
          $h=Get-Content production-source.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-webview-debug="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"')){
            if(-not $h.Contains($m)){ throw "Fuente productiva incompleta: $m" }
          }

      - name: Fusionar UI productiva con puentes nativos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          Pop-Location
          if(-not(Test-Path desktop/dist/index.html)){ throw 'sync-web no genero desktop/dist/index.html' }

      - name: Aplicar limpieza y watchdogs pasivos
        shell: pwsh
        run: node scripts/finalize-windows-html.mjs desktop/dist/index.html

      - name: Blindar clic y foco reales del login
        shell: pwsh
        run: node scripts/guard-windows-login-v0135.mjs desktop/dist/index.html

      - name: Empaquetar XLSX local y ASYNC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $url='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'
          $dest='desktop/dist/vendor/xlsx.full.min.js'
          $done=$false
          for($i=1;$i -le 3;$i++){
            try{
              Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
              if((Get-Item $dest).Length -gt 500000){$done=$true;break}
            }catch{
              if($i -eq 3){throw}
              Start-Sleep -Seconds 2
            }
          }
          if(-not $done){throw 'No se pudo obtener XLSX local completo'}
          node scripts/vendor-windows-static-assets.mjs desktop/dist/index.html $dest

      - name: Exigir XLSX no bloqueante
        shell: pwsh
        run: node tests/windows-xlsx-nonblocking-v0136.mjs desktop/dist/index.html

      - name: Verificar cero recursos externos de arranque
        shell: pwsh
        run: node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero

      - name: Pruebas exactas de login y arranque
        shell: pwsh
        run: |
          node tests/windows-storage-startup-v0130.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json
          node tests/windows-webview-profile-v0132.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json desktop/src-tauri/src/main.rs
          node tests/windows-login-hit-target-v0135.mjs desktop/dist/index.html desktop/src-tauri/src/main.rs desktop/src-tauri/tauri.conf.json
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html

      - name: Auditoria productiva del HTML exacto del EXE
        shell: pwsh
        env:
          FR_LOCAL_UI_PATH: desktop/dist/index.html
        run: node tests/production-live-smoke.mjs

      - name: Verificar version y generar config Tauri release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){ throw 'tauri.conf no tiene version real' }
          if([string]$t.build.frontendDist -ne '../dist'){ throw 'Tauri no apunta a ../dist' }
          if($t.app.withGlobalTauri -ne $true){ throw 'Tauri global API no esta habilitada' }
          $w=$t.app.windows | Where-Object { $_.label -eq 'main' } | Select-Object -First 1
          if([string]$w.dataDirectory -ne $env:FR_WEBVIEW_PROFILE){ throw 'Se perdio el perfil WebView2 nuevo' }
          $cargo=Get-Content desktop/src-tauri/Cargo.toml -Raw
          if($cargo -notmatch ('version\s*=\s*"'+[regex]::Escape($env:FR_VERSION)+'"')){ throw 'Cargo.toml no tiene version real' }
          $c=@{
            app=@{withGlobalTauri=$true}
            bundle=@{createUpdaterArtifacts=$true}
            plugins=@{updater=@{
              pubkey=$env:FR_UPDATER_PUBKEY
              endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')
            }}
          }
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar Windows
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
          if($LASTEXITCODE -ne 0){ throw "Tauri build fallo con codigo $LASTEXITCODE" }

      - name: Probar parser y login interactivo dentro del EXE real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 45;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){
                $txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'}
                throw "El EXE se cerro antes de validar el login. Log: $txt"
              }
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $parser=$txt.Contains('WEBVIEW_MILESTONE HEAD_SCRIPT_STARTED') -and $txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('\"ok\":true') -and $txt.Contains('\"hitOk\":true') -and $txt.Contains('\"focusOk\":true') -and $txt.Contains('businessCode') -and $txt.Contains('loginUser') -and $txt.Contains('loginPin') -and $txt.Contains('loginBtn')
                if($txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started') -and $parser -and $ready){
                  $ok=$true
                  Write-Host $txt
                  break
                }
              }
            }
            if(-not $ok){
              $txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'}
              throw "El WebView2 real no supero parser + hit-test + foco. Log: $txt"
            }
          } finally {
            if(-not $p.HasExited){ Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host 'WINDOWS REAL PARSER + LOGIN HIT-FOCUS OK'

      - name: Preparar artefactos y hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){ throw 'No se genero EXE NSIS' }
          $sigPath="$($exe.FullName).sig"
          if(-not(Test-Path $sigPath)){ throw 'No se genero firma .exe.sig' }
          New-Item -ItemType Directory -Force release-files | Out-Null
          $safeExe="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe"
          $safeSig="$safeExe.sig"
          Copy-Item $exe.FullName "release-files/$safeExe" -Force
          Copy-Item $sigPath "release-files/$safeSig" -Force
          $exeHash=(Get-FileHash "release-files/$safeExe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sigHash=(Get-FileHash "release-files/$safeSig" -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature=(Get-Content "release-files/$safeSig" -Raw).Trim()
          if([string]::IsNullOrWhiteSpace($signature)){ throw 'Firma vacia' }
          "FR_ASSET_EXE=$safeExe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_ASSET_SIG=$safeSig" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_EXE_SHA256=$exeHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sigHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "EXE SHA256 $exeHash"

      - name: Generar latest.json local
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $signature=(Get-Content "release-files/$env:FR_ASSET_SIG" -Raw).Trim()
          $url="https://github.com/$repo/releases/download/$tag/$env:FR_ASSET_EXE"
          $j=[ordered]@{
            version=$env:FR_VERSION
            notes="Factura Rapida $env:FR_VERSION - parser WebView2 liberado, XLSX local async y login validado por hit-test/foco real"
            pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms=[ordered]@{
              'windows-x86_64'=[ordered]@{signature=$signature;url=$url}
            }
          }
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          $latestHash=(Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_LATEST_SHA256=$latestHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Crear borrador de release
        id: draft
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $title="Factura Rapida $tag"
          gh release create $tag `
            "release-files/$env:FR_ASSET_EXE" `
            "release-files/$env:FR_ASSET_SIG" `
            "release-files/latest.json" `
            --repo $repo `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes "Corrige el bloqueo del parser de WebView2: XLSX sigue incluido localmente pero ahora carga async y no puede detener DOMContentLoaded. El EXE real debe demostrar DOMContentLoaded, hit-test y foco de Codigo de negocio, Usuario, PIN y Entrar antes de publicar. No se emitio CFDI durante pruebas." `
            --draft
          $r=$null
          for($i=1;$i -le 12;$i++){
            $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
            $r=$rels | Where-Object { $_.draft -eq $true -and ($_.tag_name -eq $tag -or $_.name -eq $title) } | Sort-Object created_at -Descending | Select-Object -First 1
            if($r){break}
            Start-Sleep -Seconds 2
          }
          if(-not $r){throw 'No se encontro el borrador recien creado'}
          "release_id=$($r.id)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verificar borrador remoto por hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $rid='${{ steps.draft.outputs.release_id }}'
          $r=gh api "/repos/$repo/releases/$rid" | ConvertFrom-Json
          if(-not $r.draft -or $r.prerelease){throw 'Estado inesperado del borrador'}
          if([string]$r.tag_name -ne "v$env:FR_VERSION"){throw 'Tag inesperado'}
          if($r.assets.Count -ne 3){throw "Se esperaban exactamente 3 assets y hay $($r.assets.Count)"}
          $expected=@{
            $env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256"
            $env:FR_ASSET_SIG="sha256:$env:FR_SIG_SHA256"
            'latest.json'="sha256:$env:FR_LATEST_SHA256"
          }
          foreach($name in $expected.Keys){
            $a=$r.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if(-not $a){throw "Falta asset remoto: $name"}
            if([string]$a.state -ne 'uploaded'){throw "Asset no subido: $name"}
            if([string]::IsNullOrWhiteSpace([string]$a.digest)){throw "GitHub no reporto digest para $name"}
            if([string]$a.digest -ne $expected[$name]){throw "Hash remoto incorrecto para $name"}
          }
          Write-Host 'REMOTE DRAFT HASHES OK'

      - name: Publicar release estable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $rid='${{ steps.draft.outputs.release_id }}'
          gh api --method PATCH "/repos/$repo/releases/$rid" -f draft=false -f prerelease=false -f make_latest=true | Out-Null

      - name: Verificacion publica final por descarga
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if([string]$latest.tag_name -ne "v$env:FR_VERSION"){throw 'La version publicada no quedo como latest'}
          if($latest.draft -or $latest.prerelease){throw 'La release final no es estable'}
          New-Item -ItemType Directory -Force public-check | Out-Null
          $base="https://github.com/$repo/releases/download/v$env:FR_VERSION"
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE" -OutFile "public-check/$env:FR_ASSET_EXE" -UseBasicParsing
          Invoke-WebRequest "$base/$env:FR_ASSET_SIG" -OutFile "public-check/$env:FR_ASSET_SIG" -UseBasicParsing
          Invoke-WebRequest "$base/latest.json" -OutFile "public-check/latest.json" -UseBasicParsing
          $eh=(Get-FileHash "public-check/$env:FR_ASSET_EXE" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh=(Get-FileHash "public-check/$env:FR_ASSET_SIG" -Algorithm SHA256).Hash.ToLowerInvariant()
          $lh=(Get-FileHash "public-check/latest.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($eh -ne $env:FR_EXE_SHA256){throw 'EXE publico no coincide'}
          if($sh -ne $env:FR_SIG_SHA256){throw 'SIG publica no coincide'}
          if($lh -ne $env:FR_LATEST_SHA256){throw 'latest.json publico no coincide'}
          $j=Get-Content public-check/latest.json -Raw | ConvertFrom-Json
          if([string]$j.version -ne $env:FR_VERSION){throw 'latest.json anuncia otra version'}
          if([string]$j.platforms.'windows-x86_64'.url -ne "$base/$env:FR_ASSET_EXE"){throw 'latest.json apunta a URL incorrecta'}
          Write-Host "PUBLIC RELEASE OK v$env:FR_VERSION EXE_SHA256=$eh"

      - name: Limpiar borrador si falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'
          $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          $drafts=$rels | Where-Object { $_.draft -eq $true -and $_.tag_name -eq $tag }
          foreach($r in $drafts){ gh api --method DELETE "/repos/$repo/releases/$($r.id)" | Out-Null }
          gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" 2>$null
          $global:LASTEXITCODE=0

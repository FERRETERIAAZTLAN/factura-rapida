name: Factura Rapida - Release v0.1.17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0117.yml'
      - 'release-v0117'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.17"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v11"

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar version nueva
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:FR_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "$tag ya existe" }
          $global:LASTEXITCODE = 0

      - name: Preparar Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem -File -Filter "Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip" | Select-Object -First 1
          if (-not $zip) { throw "No se encontro ZIP base" }
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force
          if (-not (Test-Path "desktop")) { throw "No se creo desktop" }

      - name: Descargar y validar interfaz produccion v11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile "index.html" -UseBasicParsing
          $html = Get-Content "index.html" -Raw
          $required = @(
            'data-fr-production-clean="1"',
            'data-fr-facturar-real="8"',
            'data-fr-usage-ui="1"',
            'data-fr-business-mail-ui="1"',
            'data-fr-issue-delivery="1"',
            "api('saveDraft',{draft:payload})",
            "cfdiApi('preflight',{draftId:d.id})",
            "readiness('ensure')",
            'finkok-production-readiness-api',
            "issueApi('timber',{draftId:d.id})",
            'cfdi-issue-api',
            "if(!r?.uuid)",
            'cfdi-usage-api',
            'Uso de timbres',
            'Comparar con Finkok',
            'business-email-settings-api',
            'gmail-mail-api',
            'Correo y datos del negocio',
            'Conectar este Gmail',
            'Enviar correo de prueba',
            'Contraseña de aplicación de Google',
            'autoSendInvoices',
            'uploadLogo',
            'Correo enviado',
            'CFDI válido; correo pendiente'
          )
          foreach ($x in $required) { if (-not $html.Contains($x)) { throw "Falta contrato obligatorio: $x" } }
          $forbidden = @('>Finkok · DEMO<','Producción está bloqueada.','id="finkokSmokeBtn"','id="sandboxCsdForm"')
          foreach ($x in $forbidden) { if ($html.Contains($x)) { throw "Contenido DEMO visible/prohibido: $x" } }
          $iSave=$html.IndexOf("api('saveDraft',{draft:payload})")
          $iPre=$html.LastIndexOf("cfdiApi('preflight',{draftId:d.id})")
          $iReady=$html.LastIndexOf("readiness('ensure')")
          $iConfirm=$html.LastIndexOf("const ok=confirm('Vas a emitir un CFDI REAL")
          $iTimber=$html.LastIndexOf("issueApi('timber',{draftId:d.id})")
          $iClear=$html.LastIndexOf('cart=[]')
          if ($iSave -lt 0 -or $iPre -lt 0 -or $iReady -lt 0 -or $iConfirm -lt 0 -or $iTimber -lt 0 -or $iClear -lt 0) { throw "No se pudo comprobar el flujo FACTURAR" }
          if (-not ($iSave -lt $iPre -and $iPre -lt $iReady -and $iReady -lt $iConfirm -and $iConfirm -lt $iTimber -and $iTimber -lt $iClear)) { throw "Orden inseguro del flujo FACTURAR" }

      - name: Validar firma y updater
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Falta TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "Falta TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)) { throw "Falta TAURI_UPDATER_PUBKEY" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Asegurar serde_json
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          if (-not (Select-String -Path "Cargo.toml" -Pattern "serde_json" -Quiet)) { cargo add serde_json@1 }

      - name: Establecer version
        working-directory: desktop
        run: node scripts/set-version.mjs "${{ env.FR_VERSION }}"

      - name: Sincronizar interfaz
        working-directory: desktop
        run: npm run sync-web

      - name: Verificar paquete final y sintaxis
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "desktop/dist/index.html"
          if (-not (Test-Path $path)) { throw "Falta desktop/dist/index.html" }
          $html = Get-Content $path -Raw
          foreach($x in @('data-fr-facturar-real="8"','data-fr-usage-ui="1"','data-fr-business-mail-ui="1"','data-fr-issue-delivery="1"','cfdi-issue-api','business-email-settings-api','gmail-mail-api','Comparar con Finkok')){if(-not $html.Contains($x)){throw "No llego al paquete: $x"}}
          $script = @'
          const fs=require('fs');
          const h=fs.readFileSync('desktop/dist/index.html','utf8');
          const a=h.match(/<script data-fr-facturar-real="8">([\s\S]*?)<\/script>/);
          const b=h.match(/<script data-fr-usage-ui="1">([\s\S]*?)<\/script>/);
          const c=h.match(/<script data-fr-business-mail-ui="1">([\s\S]*?)<\/script>/);
          if(!a) throw new Error('No se encontro FACTURAR v8');
          if(!b) throw new Error('No se encontro panel de timbres');
          if(!c) throw new Error('No se encontro configuracion de correo por negocio');
          if(!a[1].includes("issueApi('timber',{draftId:d.id})")) throw new Error('FACTURAR no usa cfdi-issue-api');
          if(!a[1].includes("cfdi-issue-api")) throw new Error('Falta API de emision y entrega');
          new Function(a[1]);
          new Function(b[1]);
          new Function(c[1]);
          console.log('FACTURAR, Timbres, Correo por negocio y entrega automatica: sintaxis valida');
          '@
          node -e $script
          $tauri = Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ([string]$tauri.build.frontendDist -ne "../dist") { throw "Tauri no apunta a ../dist" }

      - name: Configurar actualizador
        shell: pwsh
        run: |
          $config = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{
              pubkey = $env:FR_UPDATER_PUBKEY
              endpoints = @("https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json")
            }}
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content "desktop/src-tauri/tauri.release.conf.json" -Encoding UTF8

      - name: Compilar firmar y publicar
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: "v__VERSION__"
          releaseName: "Factura Rapida v__VERSION__"
          releaseBody: "Facturacion real con Finkok PRODUCCION, control de timbres, Gmail independiente por negocio y entrega automatica posterior al UUID. El fallo de correo nunca invalida el CFDI y la aplicacion evita reenvios cuando el correo ya fue entregado."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: "--config src-tauri/tauri.release.conf.json --bundles nsis"

      - name: Esperar release publica
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo="${{ github.repository }}"; $tag="v$env:FR_VERSION"; $found=$false
          for($i=1;$i -le 25;$i++){
            gh release view $tag --repo $repo --json isDraft,isPrerelease,tagName *> release.json
            if($LASTEXITCODE -eq 0){$r=Get-Content release.json -Raw|ConvertFrom-Json;if($r.tagName -eq $tag -and -not $r.isDraft -and -not $r.isPrerelease){$found=$true;break}}
            Start-Sleep -Seconds 3
          }
          if(-not $found){throw "Release publica no aparecio"}

      - name: Reconstruir latest.json desde activos publicados
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo="${{ github.repository }}"; $tag="v$env:FR_VERSION"
          $assets=gh release view $tag --repo $repo --json assets|ConvertFrom-Json
          $exe=$assets.assets|Where-Object{$_.name -match '\.exe$'}|Select-Object -First 1
          $sig=$assets.assets|Where-Object{$_.name -match '\.exe\.sig$'}|Select-Object -First 1
          if(-not $exe -or -not $sig){throw "Faltan EXE o firma"}
          New-Item -ItemType Directory release-files -Force|Out-Null
          gh release download $tag --repo $repo --pattern "*.exe.sig" --dir release-files --clobber
          $sigFile=Get-ChildItem release-files -File -Filter "*.exe.sig"|Select-Object -First 1
          $sigText=(Get-Content $sigFile.FullName -Raw).Trim()
          if([string]::IsNullOrWhiteSpace($sigText)){throw "Firma vacia"}
          $url="https://github.com/$repo/releases/download/$tag/$([uri]::EscapeDataString($exe.name).Replace('%20','%20'))"
          $latest=[ordered]@{version=$env:FR_VERSION;notes="Factura Rapida $env:FR_VERSION - facturacion real, timbres, correo por negocio y entrega automatica.";pub_date=[DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ");platforms=[ordered]@{"windows-x86_64"=[ordered]@{signature=$sigText;url=$url}}}
          $latest|ConvertTo-Json -Depth 8|Set-Content latest.json -Encoding UTF8
          gh release upload $tag latest.json --clobber --repo $repo

      - name: Verificacion final de release y updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference="Stop"
          $repo="${{ github.repository }}"; $tag="v$env:FR_VERSION"; Start-Sleep -Seconds 4
          $release=gh release view $tag --repo $repo --json isDraft,isPrerelease,assets,tagName|ConvertFrom-Json
          if($release.tagName -ne $tag -or $release.isDraft -or $release.isPrerelease){throw "Release no estable"}
          $exe=$release.assets|Where-Object{$_.name -match '\.exe$'}|Select-Object -First 1
          $sig=$release.assets|Where-Object{$_.name -match '\.exe\.sig$'}|Select-Object -First 1
          $latestAsset=$release.assets|Where-Object{$_.name -eq 'latest.json'}|Select-Object -First 1
          if(-not $exe -or -not $sig -or -not $latestAsset){throw "Release incompleta"}
          New-Item -ItemType Directory verify-files -Force|Out-Null
          gh release download $tag --repo $repo --pattern "latest.json" --dir verify-files --clobber
          gh release download $tag --repo $repo --pattern "*.exe.sig" --dir verify-files --clobber
          $j=Get-Content verify-files/latest.json -Raw|ConvertFrom-Json
          $sigFile=Get-ChildItem verify-files -File -Filter "*.exe.sig"|Select-Object -First 1
          $sigText=(Get-Content $sigFile.FullName -Raw).Trim()
          if([string]$j.version -ne $env:FR_VERSION){throw "Version latest incorrecta"}
          $p=$j.platforms.'windows-x86_64';if(-not $p){throw "Falta plataforma windows-x86_64"}
          if([string]$p.signature.Trim() -ne $sigText){throw "Firma updater no coincide"}
          if([string]$p.url -notmatch "/releases/download/v$([regex]::Escape($env:FR_VERSION))/"){throw "URL updater incorrecta"}
          Write-Host "v$env:FR_VERSION LISTA: FACTURAR real, gate Finkok, Timbres, Gmail por negocio, entrega automatica, EXE firmado y updater verificados"

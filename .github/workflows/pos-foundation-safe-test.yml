name: POS Foundation Safe Test

on:
  push:
    branches: [feature/pos-foundation-safe]
    paths:
      - 'pos-module.js'
      - 'quotes-email-module.js'
      - 'tests/pos-module-smoke.mjs'
      - '.github/workflows/pos-foundation-safe-test.yml'
  pull_request:
    paths:
      - 'pos-module.js'
      - 'quotes-email-module.js'
      - 'tests/pos-module-smoke.mjs'
      - '.github/workflows/pos-foundation-safe-test.yml'

permissions:
  contents: read

env:
  FR_FIX1_COMMIT: "73ff1fa0d4345d492278eef5f2dc836e7ece7695"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_POS_API: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/pos-api"
  FR_SUPPLIER_API: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/supplier-api"

jobs:
  pos-safe:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxis y smoke POS sin ventas reales
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-save --no-audit --no-fund jsdom@25
          node --check pos-module.js
          node --check quotes-email-module.js
          node tests/pos-module-smoke.mjs
          $qe=Get-Content quotes-email-module.js -Raw
          foreach($m in @('pos-module.js?v=1','data-fr-pos-loader')){if(-not $qe.Contains($m)){throw "Loader POS faltante: $m"}}
          $pm=Get-Content pos-module.js -Raw
          foreach($m in @('Punto de venta','Proveedores','completeSale','ensureOperationalSession','posSearch','PRODUCT_IMAGE_BASE')){
            if(-not $pm.Contains($m)){throw "Contrato UI POS incompleto: $m"}
          }
          foreach($legacy in @('posOpenCash','posCloseCash','posOpenDialog','posCloseDialog')){
            if($pm.Contains($legacy)){throw "POS: regresó control manual de caja: $legacy"}
          }
          if($pm -match 'posApi\(["''](?:openCash|closeCash)["'']'){throw 'POS: regresó operación manual openCash/closeCash'}
          Write-Host 'POS_STATIC_AND_UI_SMOKE_OK_NO_REAL_SALE_AUTOMATIC_SHIFTS'

      - name: Health POS y Proveedores sin escribir datos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $h=Get-Content index.html -Raw
          $m=[regex]::Match($h,'const\s+ANON_KEY\s*=\s*[''"]([^''"]+)[''"]')
          if(-not $m.Success){throw 'No se pudo leer ANON_KEY pública de index.html'}
          $anon=$m.Groups[1].Value
          $headers=@{Authorization="Bearer $anon";apikey=$anon}
          $p=Invoke-RestMethod -Method Post -Uri $env:FR_POS_API -Headers $headers -ContentType 'application/json' -Body '{"action":"health"}' -TimeoutSec 30
          if(-not $p.ok -or [string]$p.service -ne 'pos-api' -or [int]$p.version -ne 1 -or $p.atomicSale -ne $true -or $p.cfdiUntouched -ne $true){throw 'pos-api health/contrato inválido'}
          $s=Invoke-RestMethod -Method Post -Uri $env:FR_SUPPLIER_API -Headers $headers -ContentType 'application/json' -Body '{"action":"health"}' -TimeoutSec 30
          if(-not $s.ok -or [string]$s.service -ne 'supplier-api' -or [int]$s.version -ne 1 -or $s.suppliers -ne $true){throw 'supplier-api health/contrato inválido'}
          Write-Host 'POS_SUPPLIER_HEALTH_OK_READ_ONLY'

      - name: Reconstruir paquete Windows FIX1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmd /c "git show $env:FR_FIX1_COMMIT`:Factura_Rapida_Desktop_Windows_FIX1.zip > FIX1.zip"
          if($LASTEXITCODE -ne 0){throw 'No se pudo recuperar FIX1'}
          $sha=(Get-FileHash FIX1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '144c3fc22729fde4f440088b20f880b90363d0cc8e3b915fcf181e6ef9178134'){throw "FIX1 hash inesperado $sha"}
          Expand-Archive FIX1.zip . -Force
          node scripts/rebase-fix1-native-v0142.mjs desktop
          Push-Location desktop
          npm install --no-audit --no-fund
          Pop-Location

      - name: Sincronizar UI productiva y empaquetar POS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'} -TimeoutSec 30
          if((Get-Item production-source.html).Length -lt 10000){throw 'UI productiva incompleta'}
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          Pop-Location
          node scripts/sanitize-production-ui-v0142.mjs desktop/dist/index.html
          node scripts/clean-webview-startup-v0148.mjs desktop/dist/index.html
          node scripts/fix-facturar-mutation-v0148.mjs desktop/dist/index.html
          foreach($f in @('quotes-module.js','quotes-email-module.js','product-images-module.js','pos-module.js')){
            if(-not(Test-Path $f)){throw "Falta módulo origen $f"}
            Copy-Item $f "desktop/dist/$f" -Force
            node --check "desktop/dist/$f"
          }
          $p='desktop/dist/index.html';$html=Get-Content $p -Raw
          foreach($tag in @('<script src="quotes-module.js?v=1"></script>','<script src="quotes-email-module.js?v=1"></script>','<script src="product-images-module.js?v=1"></script>')){
            if(-not $html.Contains($tag)){
              if(-not $html.Contains('</body>')){throw 'index.html sin cierre body'}
              $html=$html.Replace('</body>',"$tag`r`n</body>")
            }
          }
          Set-Content $p $html -Encoding UTF8
          foreach($f in @('quotes-module.js','quotes-email-module.js','product-images-module.js','pos-module.js')){if(-not(Test-Path "desktop/dist/$f")){throw "Módulo no empaquetado: $f"}}
          $qe=Get-Content desktop/dist/quotes-email-module.js -Raw
          if(-not $qe.Contains('pos-module.js?v=1')){throw 'El paquete no carga pos-module.js'}
          $pm=Get-Content desktop/dist/pos-module.js -Raw
          foreach($m in @('Punto de venta','Proveedores','completeSale','ensureOperationalSession')){if(-not $pm.Contains($m)){throw "POS empaquetado incompleto: $m"}}
          foreach($legacy in @('posOpenCash','posCloseCash','posOpenDialog','posCloseDialog')){if($pm.Contains($legacy)){throw "POS empaquetado reintrodujo control manual de caja: $legacy"}}
          if($pm -match 'posApi\(["''](?:openCash|closeCash)["'']'){throw 'POS empaquetado reintrodujo openCash/closeCash manual'}
          Write-Host 'WINDOWS_PACKAGE_POS_MODULE_OK_AUTOMATIC_SHIFTS'

      - name: Login base sigue estable
        shell: pwsh
        run: node tests/ui-login-smoke-v15.mjs desktop/dist/index.html

name: Factura Rapida - Release v0.1.40 Zero Storage Parser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0140.yml'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.40"
  FR_WEBVIEW_PROFILE: "webview-profile-v10"
  FR_STORAGE_BOOT_MODE: "isolated-profile"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui-v15"
  FR_PRODUCTION_HEALTH_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-production-health?business=AZTLAN"

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight version nueva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($rels | Where-Object {$_.tag_name -eq $tag}){throw "$tag ya existe"}
          gh api "/repos/$repo/git/ref/tags/$tag" *> $null
          if($LASTEXITCODE -eq 0){throw "$tag ya existe como tag"}
          $global:LASTEXITCODE=0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Auditoria LIVE produccion
        shell: pwsh
        run: node tests/production-live-smoke.mjs

      - name: Preparar Desktop base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem -File -Filter 'Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip' | Select-Object -First 1
          if(-not $zip){throw 'No se encontro ZIP base'}
          Expand-Archive $zip.FullName . -Force
          node scripts/prepare-windows-desktop.mjs

      - name: Instalar dependencias
        shell: pwsh
        run: |
          Push-Location desktop
          npm install --no-audit --no-fund
          Pop-Location
          npm install --no-save --no-audit --no-fund jsdom@25
          Push-Location desktop/src-tauri
          if(-not(Select-String -Path Cargo.toml -Pattern 'serde_json' -Quiet)){cargo add serde_json@1}
          Pop-Location

      - name: Establecer version
        working-directory: desktop
        shell: pwsh
        run: node scripts/set-version.mjs "$env:FR_VERSION"

      - name: Descargar y fusionar UI productiva
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile production-source.html -UseBasicParsing -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'}
          $h=Get-Content production-source.html -Raw
          foreach($m in @('data-fr-production-clean="1"','data-fr-webview-debug="1"','data-fr-facturar-real="8"','data-fr-login-clean="1"')){if(-not $h.Contains($m)){throw "Fuente productiva incompleta $m"}}
          $env:FR_WEB_SOURCE=(Resolve-Path production-source.html).Path
          Push-Location desktop
          npm run sync-web
          Pop-Location

      - name: Preparar arranque aislado
        shell: pwsh
        run: |
          node scripts/finalize-windows-html.mjs desktop/dist/index.html
          node scripts/guard-windows-login-v0135.mjs desktop/dist/index.html
          node scripts/reorder-windows-login-guard-v0137.mjs desktop/dist/index.html
          node scripts/patch-windows-startup-v0140.mjs desktop/dist/index.html

      - name: Vendorizar XLSX local async
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force desktop/dist/vendor | Out-Null
          $dest='desktop/dist/vendor/xlsx.full.min.js'
          Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -OutFile $dest -UseBasicParsing
          if((Get-Item $dest).Length -lt 500000){throw 'XLSX incompleto'}
          node scripts/vendor-windows-static-assets.mjs desktop/dist/index.html $dest

      - name: Pruebas estaticas estrictas
        shell: pwsh
        run: |
          node tests/windows-zero-storage-parser-v0140.mjs desktop/dist/index.html
          node tests/windows-xlsx-nonblocking-v0136.mjs desktop/dist/index.html
          node tests/audit-external-startup-resources.mjs desktop/dist/index.html --require-zero
          node tests/windows-storage-isolated-v0137.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json
          node tests/windows-webview-profile-v0132.mjs desktop/dist/index.html desktop/src-tauri/tauri.conf.json desktop/src-tauri/src/main.rs
          node tests/windows-login-hit-target-v0135.mjs desktop/dist/index.html desktop/src-tauri/src/main.rs desktop/src-tauri/tauri.conf.json
          node tests/ui-login-smoke-v15.mjs desktop/dist/index.html

      - name: Auditoria productiva HTML exacto
        shell: pwsh
        env:
          FR_LOCAL_UI_PATH: desktop/dist/index.html
        run: node tests/production-live-smoke.mjs

      - name: Configurar release Tauri
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)){throw 'Falta signing key'}
          if([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)){throw 'Falta updater pubkey'}
          $t=Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if([string]$t.version -ne $env:FR_VERSION){throw 'Version Tauri incorrecta'}
          if($t.app.withGlobalTauri -ne $true){throw 'window.__TAURI__ deshabilitado'}
          $w=$t.app.windows | Where-Object {$_.label -eq 'main'} | Select-Object -First 1
          if([string]$w.dataDirectory -ne $env:FR_WEBVIEW_PROFILE){throw 'Perfil WebView2 incorrecto'}
          $c=@{app=@{withGlobalTauri=$true};bundle=@{createUpdaterArtifacts=$true};plugins=@{updater=@{pubkey=$env:FR_UPDATER_PUBKEY;endpoints=@('https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json')}}}
          $c | ConvertTo-Json -Depth 10 | Set-Content desktop/src-tauri/tauri.release.conf.json -Encoding UTF8

      - name: Compilar y firmar Windows
        working-directory: desktop
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Probar EXE real parser DOM foco y hit-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:TEMP 'factura-rapida-startup.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'desktop/src-tauri/target/release/factura-rapida.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          try{
            $ok=$false
            for($i=1;$i -le 60;$i++){
              Start-Sleep -Seconds 1
              if($p.HasExited){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE se cerro: $txt"}
              if(Test-Path $log){
                $txt=Get-Content $log -Raw
                $base=$txt.Contains("START $env:FR_VERSION") -and $txt.Contains("SETUP_OK $env:FR_VERSION") -and $txt.Contains('PAGE_LOAD Started')
                $parser=$txt.Contains('WEBVIEW_MILESTONE HEAD_SCRIPT_STARTED') -and $txt.Contains('WEBVIEW_MILESTONE DOM_CONTENT_LOADED')
                $ready=$txt.Contains('WEBVIEW_MILESTONE LOGIN_HIT_FOCUS_OK') -and $txt.Contains('LOGIN_UI_READY ') -and $txt.Contains('\"ok\":true') -and $txt.Contains('\"hitOk\":true') -and $txt.Contains('\"focusOk\":true')
                if($base -and $parser -and $ready){$ok=$true;Write-Host $txt;break}
              }
            }
            if(-not $ok){$txt=if(Test-Path $log){Get-Content $log -Raw}else{'(sin log)'};throw "EXE real no paso aceptacion: $txt"}
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}
          Write-Host 'WINDOWS REAL LOGIN ACCEPTANCE V0.1.40 OK'

      - name: Preparar assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis='desktop/src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $nsis -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'No EXE NSIS'}
          $sig="$($exe.FullName).sig"; if(-not(Test-Path $sig)){throw 'No firma .sig'}
          New-Item -ItemType Directory -Force release-files | Out-Null
          $name="Factura.Rapida_$env:FR_VERSION`_x64-setup.exe"
          Copy-Item $exe.FullName "release-files/$name" -Force
          Copy-Item $sig "release-files/$name.sig" -Force
          "FR_ASSET_EXE=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $eh=(Get-FileHash "release-files/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh=(Get-FileHash "release-files/$name.sig" -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_EXE_SHA256=$eh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FR_SIG_SHA256=$sh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generar latest.json
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $sig=(Get-Content "release-files/$env:FR_ASSET_EXE.sig" -Raw).Trim()
          $url="https://github.com/$repo/releases/download/$tag/$env:FR_ASSET_EXE"
          $j=[ordered]@{version=$env:FR_VERSION;notes='Arranque WebView2 sin acceso parser-time a storage; login validado en EXE real';pub_date=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ');platforms=[ordered]@{'windows-x86_64'=[ordered]@{signature=$sig;url=$url}}}
          $j | ConvertTo-Json -Depth 8 | Set-Content release-files/latest.json -Encoding UTF8
          $lh=(Get-FileHash release-files/latest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "FR_LATEST_SHA256=$lh" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publicar borrador verificado y hacerlo estable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          gh release create $tag "release-files/$env:FR_ASSET_EXE" "release-files/$env:FR_ASSET_EXE.sig" release-files/latest.json --repo $repo --target $env:GITHUB_SHA --title "Factura Rapida $tag" --notes 'v0.1.40: parser sin storage sincronico; EXE real paso DOM, hit-test y foco. No se emitio CFDI en pruebas.' --draft
          Start-Sleep -Seconds 3
          $r=(gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json | Where-Object {$_.tag_name -eq $tag -and $_.draft} | Select-Object -First 1)
          if(-not $r){throw 'No se encontro borrador'}
          $expected=@{$env:FR_ASSET_EXE="sha256:$env:FR_EXE_SHA256";"$env:FR_ASSET_EXE.sig"="sha256:$env:FR_SIG_SHA256";'latest.json'="sha256:$env:FR_LATEST_SHA256"}
          foreach($n in $expected.Keys){$a=$r.assets|Where-Object{$_.name -eq $n}|Select-Object -First 1;if(-not $a -or [string]$a.digest -ne $expected[$n]){throw "Hash remoto incorrecto $n"}}
          gh api --method PATCH "/repos/$repo/releases/$($r.id)" -f draft=false -f prerelease=false -f make_latest=true | Out-Null

      - name: Verificacion publica final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"; $base="https://github.com/$repo/releases/download/$tag"
          $latest=gh api "/repos/$repo/releases/latest" | ConvertFrom-Json
          if([string]$latest.tag_name -ne $tag -or $latest.draft -or $latest.prerelease){throw 'Release no estable/latest'}
          New-Item -ItemType Directory -Force public-check | Out-Null
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE" -OutFile "public-check/$env:FR_ASSET_EXE" -UseBasicParsing
          Invoke-WebRequest "$base/$env:FR_ASSET_EXE.sig" -OutFile "public-check/$env:FR_ASSET_EXE.sig" -UseBasicParsing
          Invoke-WebRequest "$base/latest.json" -OutFile public-check/latest.json -UseBasicParsing
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_EXE_SHA256){throw 'EXE publico hash incorrecto'}
          if((Get-FileHash "public-check/$env:FR_ASSET_EXE.sig" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_SIG_SHA256){throw 'SIG publico hash incorrecto'}
          if((Get-FileHash public-check/latest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FR_LATEST_SHA256){throw 'latest publico hash incorrecto'}
          Write-Host "PUBLIC RELEASE OK $tag SHA256=$env:FR_EXE_SHA256"

      - name: Limpiar borrador si falla
        if: failure()
        shell: pwsh
        run: |
          $repo='${{ github.repository }}'; $tag="v$env:FR_VERSION"
          $rels=gh api "/repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach($r in ($rels|Where-Object{$_.draft -and $_.tag_name -eq $tag})){gh api --method DELETE "/repos/$repo/releases/$($r.id)" | Out-Null}
          gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" 2>$null; $global:LASTEXITCODE=0

name: Bootstrap SOLRAK v0.1.72 Windows Release

on:
  push:
    branches: [release/v0.1.72-reports]
    paths:
      - '.github/workflows/bootstrap-windows-release-v0172.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-release-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar flujo estable v0.1.71
        run: |
          set -euo pipefail
          git fetch origin release/v0.1.71-sumapro-fiel:refs/remotes/origin/release/v0.1.71-sumapro-fiel
          git show origin/release/v0.1.71-sumapro-fiel:.github/workflows/windows-release-v0171.yml > /tmp/windows-release-v0171.yml
          test -s /tmp/windows-release-v0171.yml

      - name: Generar flujo v0.1.72 con cambios mínimos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('/tmp/windows-release-v0171.yml').read_text(encoding='utf-8')
          text = src

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaban 1 coincidencia y hubo {count}')
              text = text.replace(old, new, 1)

          once('name: SOLRAK - Release v0.1.71 POS Fiel', 'name: SOLRAK - Release v0.1.72 Venta y Reportes', 'nombre')
          text = text.replace('release/v0.1.71-sumapro-fiel', 'release/v0.1.72-reports')
          text = text.replace('windows-release-v0171.yml', 'windows-release-v0172.yml')
          text = text.replace('0.1.71', '0.1.72')

          once("'solrak-sumapro-fiel-v0171.js','scripts/apply-solrak-brand-v0162.mjs'", "'solrak-sumapro-fiel-v0171.js','solrak-reports-v0172.js','scripts/apply-solrak-brand-v0162.mjs'", 'módulo preflight')
          once("'tests/solrak-pos-operations-v0171-contract.mjs','tests/solrak-desktop-v0162-smoke.mjs'", "'tests/solrak-pos-operations-v0171-contract.mjs','tests/solrak-reports-v0172-smoke.mjs','tests/solrak-desktop-v0162-smoke.mjs'", 'test preflight')
          once('          node tests/solrak-pos-operations-v0171-contract.mjs\n          node tests/pos-module-smoke.mjs', '          node tests/solrak-pos-operations-v0171-contract.mjs\n          node tests/solrak-reports-v0172-smoke.mjs\n          node tests/pos-module-smoke.mjs', 'ejecución test reportes')

          once('          $fiel=Get-Content solrak-sumapro-fiel-v0171.js -Raw', '          $fiel=Get-Content solrak-sumapro-fiel-v0171.js -Raw\n          $reportsV0172=Get-Content solrak-reports-v0172.js -Raw', 'lectura reportes preflight')
          marker = "          if($fiel -match '(?i)cfdi-api|finkok|completeSale|Recargas y Servicios'){throw 'POS fiel v0.1.72 invadió CFDI/cobro o agregó Recargas'}"
          addition = marker + "\n          foreach($m in @('Venta','Resumen de Ventas','Detalle de Ventas','F.P. en Ventas','Inventario','Historial Movimientos','Más Vendidos','SOLRAKReportsV0172','FacturaRapidaPOS?.api')){if(-not $reportsV0172.Contains($m)){throw \"Reportes v0.1.72 incompletos: $m\"}}\n          if($reportsV0172 -match '(?i)cfdi-api|finkok|completeSale|Recargas y Servicios'){throw 'Reportes v0.1.72 invadieron CFDI/cobro o agregaron Recargas'}"
          once(marker, addition, 'contrato reportes preflight')

          old_health = "          if(-not $p.ok -or [string]$p.service -ne 'pos-api' -or [int]$p.version -ne 1 -or [int]$p.capabilitiesVersion -ne 2 -or $p.atomicSale -ne $true -or $p.stockMovements -ne $true -or $p.cashSessions -ne $true -or $p.customProducts -ne $true -or $p.returns -ne $true -or $p.voids -ne $true -or $p.credits -ne $true -or $p.promotions -ne $true -or $p.cfdiUntouched -ne $true){throw 'pos-api health/contrato v2 inválido'}"
          new_health = "          if(-not $p.ok -or [string]$p.service -ne 'pos-api' -or [int]$p.version -ne 1 -or [int]$p.capabilitiesVersion -ne 3 -or $p.atomicSale -ne $true -or $p.stockMovements -ne $true -or $p.cashSessions -ne $true -or $p.customProducts -ne $true -or $p.returns -ne $true -or $p.voids -ne $true -or $p.credits -ne $true -or $p.promotions -ne $true -or $p.reports -ne $true -or $p.cfdiUntouched -ne $true){throw 'pos-api health/contrato v3 inválido'}\n          foreach($k in @('summary','detail','payments','inventory','movements','best-sellers')){if(-not($p.reportKinds -contains $k)){throw \"pos-api sin reporte $k\"}}"
          once(old_health, new_health, 'health pos-api v3')

          once("'solrak-redesign-v0170.js','solrak-sumapro-fiel-v0171.js')){", "'solrak-redesign-v0170.js','solrak-sumapro-fiel-v0171.js','solrak-reports-v0172.js')){", 'módulo paquete')
          once("          $fielTag='<script src=\"solrak-sumapro-fiel-v0171.js?v=1\"></script>'\n          $h=$h.Replace($redesignTag,'')\n          $h=$h.Replace($fielTag,'')", "          $fielTag='<script src=\"solrak-sumapro-fiel-v0171.js?v=1\"></script>'\n          $reportsTag='<script src=\"solrak-reports-v0172.js?v=1\"></script>'\n          $h=$h.Replace($redesignTag,'')\n          $h=$h.Replace($fielTag,'')\n          $h=$h.Replace($reportsTag,'')", 'tag reportes')
          once("'<script src=\"solrak-redesign-v0170.js?v=1\"></script>','<script src=\"solrak-sumapro-fiel-v0171.js?v=1\"></script>')){", "'<script src=\"solrak-redesign-v0170.js?v=1\"></script>','<script src=\"solrak-sumapro-fiel-v0171.js?v=1\"></script>','<script src=\"solrak-reports-v0172.js?v=1\"></script>')){", 'tag loop')
          once("'desktop/dist/solrak-redesign-v0170.js','desktop/dist/solrak-sumapro-fiel-v0171.js'))", "'desktop/dist/solrak-redesign-v0170.js','desktop/dist/solrak-sumapro-fiel-v0171.js','desktop/dist/solrak-reports-v0172.js'))", 'archivo paquete')

          text = text.replace("'solrak-sumapro-fiel-v0171.js?v=1','SOLRAK'", "'solrak-sumapro-fiel-v0171.js?v=1','solrak-reports-v0172.js?v=1','SOLRAK'")
          text = text.replace("'solrak-sumapro-fiel-v0171.js?v=1')){if(-not $h.Contains($m))", "'solrak-sumapro-fiel-v0171.js?v=1','solrak-reports-v0172.js?v=1')){if(-not $h.Contains($m))")

          once('          $fiel=Get-Content desktop/dist/solrak-sumapro-fiel-v0171.js -Raw', '          $fiel=Get-Content desktop/dist/solrak-sumapro-fiel-v0171.js -Raw\n          $reportsV0172=Get-Content desktop/dist/solrak-reports-v0172.js -Raw', 'lectura reportes paquete')
          packaged_marker = "          if($fiel -match '(?i)cfdi-api|finkok|completeSale|Recargas y Servicios'){throw 'POS fiel empaquetado invadió CFDI/cobro o agregó Recargas'}"
          packaged_add = packaged_marker + "\n          foreach($m in @('Venta','Resumen de Ventas','Detalle de Ventas','F.P. en Ventas','Inventario','Historial Movimientos','Más Vendidos','SOLRAKReportsV0172')){if(-not $reportsV0172.Contains($m)){throw \"Reportes empaquetados incompletos: $m\"}}\n          if($reportsV0172 -match '(?i)cfdi-api|finkok|completeSale|Recargas y Servicios'){throw 'Reportes empaquetados invadieron CFDI/cobro o agregaron Recargas'}"
          once(packaged_marker, packaged_add, 'contrato reportes paquete')

          text = text.replace("Write-Host 'WINDOWS_PACKAGE_V0171_POS_FIEL_OK'", "Write-Host 'WINDOWS_PACKAGE_V0172_REPORTS_OK'")
          text = text.replace("Write-Host 'SOLRAK_V0171_POS_FIEL_PREFLIGHT_OK_NO_REAL_SALE'", "Write-Host 'SOLRAK_V0172_REPORTS_PREFLIGHT_OK_NO_REAL_SALE'")
          text = text.replace("Write-Host 'V0170_SOLRAK_PUBLICADA_Y_MARCADA_LATEST'", "Write-Host 'V0172_SOLRAK_PUBLICADA_Y_MARCADA_LATEST'")

          text = re.sub(r"notes='SOLRAK v0\.1\.72:[^']+';pub_date=", "notes='SOLRAK v0.1.72: Venta restaurada como acceso principal y seis reportes reales: Resumen, Detalle, Formas de Pago, Inventario, Historial de Movimientos y Más Vendidos. Incluye filtros, impresión y CSV. POS, tickets, Producto Común, Facturación, CFDI, Finkok e inventario preservados.';pub_date=", text, count=1)
          text = re.sub(r"--notes 'v0\.1\.72 estable:[^']+' --draft", "--notes 'v0.1.72 estable: restaura Venta como acceso principal y conecta los seis Reportes al POS real con filtros, impresión y exportación CSV. Sin Recargas. Producto común exige nombre. Facturación, CFDI/Finkok, tickets, caja, inventario y updater preservados. EXE real validado.' --draft", text, count=1)

          required = [
              'FR_VERSION: "0.1.72"',
              'release/v0.1.72-reports',
              'solrak-reports-v0172.js',
              'tests/solrak-reports-v0172-smoke.mjs',
              'capabilitiesVersion -ne 3',
              "'best-sellers'",
              'WINDOWS_PACKAGE_V0172_REPORTS_OK',
              'PUBLIC_RELEASE_OK v0.1.72 SOLRAK LATEST',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Falta marcador generado: {item}')
          if text.count('solrak-reports-v0172.js?v=1') < 3:
              raise SystemExit('El módulo de reportes no quedó integrado en todas las auditorías')
          if 'FR_VERSION: "0.1.71"' in text or 'release/v0.1.71-sumapro-fiel' in text:
              raise SystemExit('Quedó configuración de release anterior')

          Path('.github/workflows/windows-release-v0172.yml').write_text(text, encoding='utf-8')
          PY
          test -s .github/workflows/windows-release-v0172.yml
          grep -q 'solrak-reports-v0172.js' .github/workflows/windows-release-v0172.yml
          grep -q 'capabilitiesVersion -ne 3' .github/workflows/windows-release-v0172.yml

      - name: Persistir flujo definitivo y retirar bootstrap
        run: |
          set -euo pipefail
          git config user.name 'SOLRAK Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/windows-release-v0172.yml
          git rm .github/workflows/bootstrap-windows-release-v0172.yml
          git commit -m 'release: preparar Windows v0.1.72'
          git push

name: SOLRAK - Dispatch v0.1.72 clean release

on:
  push:
    branches: [release/v0.1.72-reports]
    paths:
      - '.github/workflows/dispatch-v0172.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v0.1.72 release on current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/actions/workflows/windows-release-v0172.yml/dispatches" -f ref='release/v0.1.72-reports'
          echo 'V0172_CLEAN_DISPATCH_SENT'

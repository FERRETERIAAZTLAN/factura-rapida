name: Quote Email No Reprompt Smoke

on:
  push:
    branches: [fix/quote-email-no-reprompt]
    paths:
      - 'quotes-email-module.js'
      - 'tests/quote-email-ui-smoke.mjs'
      - '.github/workflows/quote-email-no-reprompt-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund jsdom@25
      - run: node --check quotes-email-module.js
      - run: node tests/quote-email-ui-smoke.mjs

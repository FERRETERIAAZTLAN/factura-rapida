name: Factura Rapida - Release v0.1.12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-v0112.yml'
      - 'release-v0112'

permissions:
  contents: write

env:
  FR_VERSION: "0.1.12"
  FR_PRODUCTION_UI_URL: "https://jojzhohqrshsjmlirkqz.supabase.co/functions/v1/factura-desktop-production-ui"

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FR_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar que la version no exista
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ github.repository }}"
          $tag = "v$env:FR_VERSION"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw "La version $tag ya existe. Usa una version nueva." }
          $global:LASTEXITCODE = 0
          Write-Host "$tag disponible"

      - name: Preparar base Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem -File -Filter "Factura_Rapida_Desktop_Windows_SAFE_0.1.4.zip" | Select-Object -First 1
          if (-not $zip) { throw "No se encontro ZIP base" }
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force
          if (-not (Test-Path "desktop")) { throw "No se creo desktop" }

      - name: Descargar y validar interfaz PRODUCCION funcional
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:FR_PRODUCTION_UI_URL -OutFile "index.html" -UseBasicParsing
          $html = Get-Content "index.html" -Raw
          if ($html -notmatch 'data-fr-production-clean="1"') { throw "Falta marcador PRODUCCION" }
          if ($html -notmatch 'data-fr-facturar-real="2"') { throw "Falta FACTURAR real v2" }
          if ($html -notmatch '>FACTURAR<') { throw "Falta boton FACTURAR" }
          if (-not $html.Contains('window.frFacturarReal=frFacturarReal')) { throw "Falta controlador global FACTURAR" }
          if (-not $html.Contains("cfdiApi('timber',{draftId:d.id})")) { throw "FACTURAR no llama al timbrado real" }
          if (-not $html.Contains("api('saveDraft',{draft})")) { throw "FACTURAR no guarda la factura actual" }
          $forbidden = @('id="pacForm"','id="sandboxCsdForm"','id="finkokSmokeBtn"','id="finkokCancelBtn"','id="finkokCancelCheckBtn"','>Finkok · DEMO<','Producción está bloqueada.')
          foreach ($bad in $forbidden) { if ($html.Contains($bad)) { throw "Contenido DEMO prohibido: $bad" } }

      - name: Validar firma y actualizador
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Falta TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "Falta TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:FR_UPDATER_PUBKEY)) { throw "Falta TAURI_UPDATER_PUBKEY" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Asegurar serde_json
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          if (-not (Select-String -Path "Cargo.toml" -Pattern "serde_json" -Quiet)) { cargo add serde_json@1 }

      - name: Establecer version
        working-directory: desktop
        run: node scripts/set-version.mjs "${{ env.FR_VERSION }}"

      - name: Sincronizar interfaz
        working-directory: desktop
        run: npm run sync-web

      - name: Verificar paquete final antes de compilar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "desktop/dist/index.html"
          if (-not (Test-Path $path)) { throw "Falta desktop/dist/index.html" }
          $html = Get-Content $path -Raw
          if ($html -notmatch 'data-fr-production-clean="1"') { throw "HTML final no es PRODUCCION" }
          if ($html -notmatch 'data-fr-facturar-real="2"') { throw "HTML final no tiene FACTURAR real v2" }
          if (-not $html.Contains('window.frFacturarReal=frFacturarReal')) { throw "Controlador FACTURAR no llego al paquete" }
          if (-not $html.Contains("cfdiApi('timber',{draftId:d.id})")) { throw "Timbrado real no llego al paquete" }
          if (-not $html.Contains("api('saveDraft',{draft})")) { throw "Guardado+facturado no llego al paquete" }
          $tauri = Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ([string]$tauri.build.frontendDist -ne "../dist") { throw "Tauri no apunta a ../dist" }

      - name: Configurar actualizador
        shell: pwsh
        run: |
          $config = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{
              pubkey = $env:FR_UPDATER_PUBKEY
              endpoints = @("https://github.com/FERRETERIAAZTLAN/factura-rapida/releases/latest/download/latest.json")
            }}
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content "desktop/src-tauri/tauri.release.conf.json" -Encoding UTF8

      - name: Compilar firmar y publicar
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: "v__VERSION__"
          releaseName: "Factura Rapida v__VERSION__"
          releaseBody: "Version productiva estable: FACTURAR guarda, valida y timbra con Finkok PRODUCCION. Incluye flujo de historial, firma del instalador y actualizador verificado."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: "--config src-tauri/tauri.release.conf.json --bundles nsis"

      - name: Esperar release publica
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ github.repository }}"
          $tag = "v$env:FR_VERSION"
          $found = $false
          for ($i=1; $i -le 20; $i++) {
            gh release view $tag --repo $repo --json isDraft,isPrerelease,tagName *> release.json
            if ($LASTEXITCODE -eq 0) {
              $r = Get-Content release.json -Raw | ConvertFrom-Json
              if ($r.tagName -eq $tag -and -not $r.isDraft -and -not $r.isPrerelease) { $found = $true; break }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $found) { throw "La release publica no aparecio a tiempo" }

      - name: Reconstruir latest.json desde el EXE y firma publicados
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ github.repository }}"
          $tag = "v$env:FR_VERSION"
          $assets = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $exe = $assets.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          $sig = $assets.assets | Where-Object { $_.name -match '\.exe\.sig$' } | Select-Object -First 1
          if (-not $exe) { throw "Falta instalador EXE" }
          if (-not $sig) { throw "Falta firma EXE.sig" }
          gh release download $tag --repo $repo --pattern "*.exe.sig" --dir release-files --clobber
          $sigFile = Get-ChildItem "release-files" -File -Filter "*.exe.sig" | Select-Object -First 1
          if (-not $sigFile) { throw "No se pudo descargar la firma" }
          $sigText = (Get-Content $sigFile.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($sigText)) { throw "Firma vacia" }
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$([uri]::EscapeDataString($exe.name).Replace('%20','%20'))"
          $latest = [ordered]@{
            version = $env:FR_VERSION
            notes = "Factura Rapida $env:FR_VERSION - produccion estable con Finkok."
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigText
                url = $downloadUrl
              }
            }
          }
          $latest | ConvertTo-Json -Depth 8 | Set-Content "latest.json" -Encoding UTF8
          gh release upload $tag latest.json --clobber --repo $repo

      - name: Verificacion final de release y actualizador
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ github.repository }}"
          $tag = "v$env:FR_VERSION"
          Start-Sleep -Seconds 4
          $release = gh release view $tag --repo $repo --json isDraft,isPrerelease,assets,tagName | ConvertFrom-Json
          if ($release.tagName -ne $tag -or $release.isDraft -or $release.isPrerelease) { throw "Release no es publica estable" }
          $exe = $release.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          $sig = $release.assets | Where-Object { $_.name -match '\.exe\.sig$' } | Select-Object -First 1
          $latestAsset = $release.assets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1
          if (-not $exe -or -not $sig -or -not $latestAsset) { throw "Release incompleta" }
          Remove-Item -Recurse -Force verify-files -ErrorAction SilentlyContinue
          New-Item -ItemType Directory verify-files | Out-Null
          gh release download $tag --repo $repo --pattern "latest.json" --dir verify-files --clobber
          gh release download $tag --repo $repo --pattern "*.exe.sig" --dir verify-files --clobber
          $j = Get-Content "verify-files/latest.json" -Raw | ConvertFrom-Json
          $sigFile = Get-ChildItem "verify-files" -File -Filter "*.exe.sig" | Select-Object -First 1
          $sigText = (Get-Content $sigFile.FullName -Raw).Trim()
          if ([string]$j.version -ne $env:FR_VERSION) { throw "Version incorrecta en latest.json" }
          $p = $j.platforms.'windows-x86_64'
          if (-not $p) { throw "Falta windows-x86_64" }
          if ([string]::IsNullOrWhiteSpace([string]$p.url) -or [string]$p.url -notmatch "/releases/download/v$([regex]::Escape($env:FR_VERSION))/") { throw "URL de actualizacion incorrecta" }
          if ([string]$p.signature.Trim() -ne $sigText) { throw "Firma del actualizador no coincide" }
          Write-Host "v$env:FR_VERSION LISTA: interfaz produccion, EXE firmado y actualizador verificados"
